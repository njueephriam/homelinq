    '<div class="modal-actions">' +
    '<button class="btn-sm btn-teal" id="csv-import-btn" style="display:none" onclick="importCSVLeads()">Import Leads</button>' +
    '<button class="btn-sm btn-outline" onclick="document.getElementById(\'csvUploadModal\').remove()">Cancel</button>' +
    '</div></div>';

  document.body.appendChild(overlay);
}

var _csvParsedRows = [];

function parseCSVFile(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
    if (lines.length < 2) { document.getElementById('csv-preview').innerHTML = '<div style="color:var(--red)">CSV appears empty</div>'; return; }

    // Parse header
    var header = lines[0].split(',').map(function(h) { return h.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_'); });

    // Map columns
    var colMap = {};
    var fieldNames = ['business_name','contact_name','email','phone','trade','location','postcode','gas_safe_number'];
    var aliases = {
      business_name: ['business_name','business','company','company_name','name','business name','company name'],
      contact_name: ['contact_name','contact','person','full_name','contact name','first_name','owner'],
      email: ['email','email_address','e_mail','mail'],
      phone: ['phone','phone_number','telephone','tel','mobile'],
      trade: ['trade','type','category','trade_type'],
      location: ['location','city','area','town','region'],
      postcode: ['postcode','post_code','zip','zip_code','postal_code'],
      gas_safe_number: ['gas_safe_number','gas_safe','gassafe','gas_safe_no','registration']
    };

    for (var f = 0; f < fieldNames.length; f++) {
      var field = fieldNames[f];
      var possible = aliases[field];
      for (var c = 0; c < header.length; c++) {
        if (possible.indexOf(header[c]) !== -1) { colMap[field] = c; break; }
      }
    }

    // Parse rows
    _csvParsedRows = [];
    for (var r = 1; r < lines.length; r++) {
      var cols = lines[r].split(',');
      var row = {};
      for (var field in colMap) {
        row[field] = (cols[colMap[field]] || '').trim().replace(/^"|"$/g, '');
      }
      if (row.business_name || row.contact_name || row.email) {
        row.source = 'csv_upload';
        row.status = 'new';
        _csvParsedRows.push(row);
      }
    }

    // Show preview
    var preview = '<div style="font-weight:700;margin-bottom:8px">' + _csvParsedRows.length + ' leads found</div>';
    preview += '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">Columns mapped: ' + Object.keys(colMap).join(', ') + '</div>';
    if (_csvParsedRows.length > 0) {
      preview += '<div style="max-height:200px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:8px;font-size:13px">';
      var showRows = Math.min(_csvParsedRows.length, 5);
      for (var p = 0; p < showRows; p++) {
        var pr = _csvParsedRows[p];
        preview += '<div style="padding:8px 12px;border-bottom:1px solid #F1F5F9">' +
          '<strong>' + (pr.business_name || 'Unknown') + '</strong>' +
          (pr.email ? ' — ' + pr.email : ' — <span style="color:var(--red)">no email</span>') +
          (pr.location ? ' — ' + pr.location : '') + '</div>';
      }
      if (_csvParsedRows.length > 5) {
        preview += '<div style="padding:8px 12px;color:var(--muted);text-align:center">...and ' + (_csvParsedRows.length - 5) + ' more</div>';
      }
      preview += '</div>';
      document.getElementById('csv-import-btn').style.display = '';
    }
    document.getElementById('csv-preview').innerHTML = preview;
  };
  reader.readAsText(file);
}

function importCSVLeads() {
  if (_csvParsedRows.length === 0) return;
  var btn = document.getElementById('csv-import-btn');
  if (btn) { btn.textContent = 'Importing...'; btn.disabled = true; }

  // Check for duplicates by email
  var existingEmails = {};
  for (var i = 0; i < salesData.leads.length; i++) {
    if (salesData.leads[i].email) existingEmails[salesData.leads[i].email.toLowerCase()] = true;
  }

  var toInsert = _csvParsedRows.filter(function(r) {
    if (!r.email) return true; // Import even without email
    return !existingEmails[r.email.toLowerCase()];
  });

  var skipped = _csvParsedRows.length - toInsert.length;

  if (toInsert.length === 0) {
    alert('All leads already exist in the database (matched by email). ' + skipped + ' duplicates skipped.');
    if (btn) { btn.textContent = 'Import Leads'; btn.disabled = false; }
    return;
  }

  sb.from('leads').insert(toInsert).select().then(function(res) {
    if (res.error) { alert('Import error: ' + res.error.message); if (btn) { btn.textContent = 'Import Leads'; btn.disabled = false; } return; }
    salesData.leads = (res.data || []).concat(salesData.leads);
    document.getElementById('csvUploadModal').remove();
    _csvParsedRows = [];
    renderPage();
    alert(toInsert.length + ' lead' + (toInsert.length > 1 ? 's' : '') + ' imported!' + (skipped > 0 ? ' (' + skipped + ' duplicate' + (skipped > 1 ? 's' : '') + ' skipped)' : ''));
  });
}

// ===== DISCOVER LEADS =====
var _discoverResults = [];

function toggleDiscoverSection() {
  var el = document.getElementById('discover-section');
  if (!el) return;
  el.classList.toggle('open');
  if (!el.classList.contains('open')) {
    // Clear results when closing
    var res = document.getElementById('discover-results');
    if (res) res.innerHTML = '';
  }
}

function discoverByArea() {
  var location = document.getElementById('discover-location');
  var trade = document.getElementById('discover-trade');
  var count = document.getElementById('discover-count');
  if (!location || !location.value.trim()) { alert('Enter a town or postcode'); return; }

  var resultsEl = document.getElementById('discover-results');
  if (!resultsEl) return;
  resultsEl.innerHTML = '<div class="discover-loading"><div class="spinner"></div><div style="color:var(--muted);font-size:14px">Moti is searching for ' + trade.value.replace(/_/g, ' ') + 's near ' + location.value.trim() + '...</div><div style="color:var(--muted);font-size:12px;margin-top:4px">This can take 30–60 seconds</div></div>';

  fetch(EDGE_URL + '/discover-leads', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'apikey': SUPABASE_KEY},
    body: JSON.stringify({mode: 'search', location: location.value.trim(), trade: trade.value, count: parseInt(count.value)})
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (res.error) { resultsEl.innerHTML = '<div style="color:var(--red);padding:16px">' + res.error + '</div>'; return; }
    if (!res.leads || res.leads.length === 0) { resultsEl.innerHTML = '<div style="color:var(--muted);padding:16px;text-align:center">' + (res.message || 'No leads found. Try a different location.') + '</div>'; return; }
    _discoverResults = res.leads;
    resultsEl.innerHTML = '<div style="color:var(--teal);padding:16px;text-align:center;font-weight:600">' + res.leads.length + ' leads found! Importing...</div>';
    importDiscoveredLeads(true);
  }).catch(function(err) {
    resultsEl.innerHTML = '<div style="color:var(--red);padding:16px">Failed to reach Moti. Check your connection and try again.</div>';
    console.log('Discover error:', err);
  });
}

function discoverByUrls() {
  var textarea = document.getElementById('discover-urls');
  if (!textarea || !textarea.value.trim()) { alert('Paste at least one URL or company name'); return; }

  var items = textarea.value.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
  if (items.length === 0) { alert('No valid entries found'); return; }
  if (items.length > 10) { alert('Maximum 10 items at a time'); return; }

  var resultsEl = document.getElementById('discover-results');
  if (!resultsEl) return;
  resultsEl.innerHTML = '<div class="discover-loading"><div class="spinner"></div><div style="color:var(--muted);font-size:14px">Moti is researching ' + items.length + ' business' + (items.length > 1 ? 'es' : '') + '...</div><div style="color:var(--muted);font-size:12px;margin-top:4px">Each one takes about 20–30 seconds</div></div>';

  fetch(EDGE_URL + '/discover-leads', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'apikey': SUPABASE_KEY},
    body: JSON.stringify({mode: 'urls', items: items})
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (res.error) { resultsEl.innerHTML = '<div style="color:var(--red);padding:16px">' + res.error + '</div>'; return; }
    if (!res.leads || res.leads.length === 0) { resultsEl.innerHTML = '<div style="color:var(--muted);padding:16px;text-align:center">No business info could be extracted.</div>'; return; }
    _discoverResults = res.leads;
    resultsEl.innerHTML = '<div style="color:var(--teal);padding:16px;text-align:center;font-weight:600">' + res.leads.length + ' leads found! Importing...</div>';
    importDiscoveredLeads(true);
  }).catch(function(err) {
    resultsEl.innerHTML = '<div style="color:var(--red);padding:16px">Failed to reach Moti. Check your connection and try again.</div>';
    console.log('Discover URL error:', err);
  });
}

function showDiscoverResults(container) {
  var h = '<div class="discover-results">';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
  h += '<div style="font-weight:700;font-size:16px">' + _discoverResults.length + ' lead' + (_discoverResults.length > 1 ? 's' : '') + ' found</div>';
  h += '<div style="display:flex;gap:8px">';
  h += '<button class="btn-sm btn-teal" onclick="importDiscoveredLeads(true)">Import All</button>';
  h += '<button class="btn-sm btn-green" onclick="importDiscoveredLeads(false)">Import Selected</button>';
  h += '<label style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);cursor:pointer"><input type="checkbox" id="discover-select-all" onchange="toggleDiscoverSelectAll(this.checked)"> Select all</label>';
  h += '</div></div>';

  for (var i = 0; i < _discoverResults.length; i++) {
    var lead = _discoverResults[i];
    var hasError = lead._status && lead._status !== 'ok';
    h += '<div class="discover-lead-row' + (hasError ? ' style="opacity:.6"' : '') + '">';
    h += '<input type="checkbox" class="discover-cb" data-idx="' + i + '"' + (hasError ? '' : ' checked') + '>';
    h += '<div class="discover-lead-info">';
    h += '<div class="discover-lead-name">' + (lead.business_name || 'Unknown') + '</div>';
    h += '<div class="discover-lead-meta">';
    var metaParts = [];
    if (lead.contact_name) metaParts.push(lead.contact_name);
    if (lead.phone) metaParts.push(lead.phone);
    if (lead.email) metaParts.push(lead.email);
    else metaParts.push('<span style="color:var(--red)">no email</span>');
    if (lead.location) metaParts.push(lead.location);
    if (lead.postcode) metaParts.push(lead.postcode);
    if (lead.gas_safe_number) metaParts.push('Gas Safe: ' + lead.gas_safe_number);
    if (lead.website) metaParts.push('<a href="' + lead.website + '" target="_blank" style="color:var(--teal)">website</a>');
    h += metaParts.join(' &middot; ');
    if (hasError) h += ' &middot; <span style="color:var(--orange)">' + (lead._status || '').replace(/_/g, ' ') + '</span>';
    h += '</div></div></div>';
  }

  h += '</div>';
  container.innerHTML = h;
}

function toggleDiscoverSelectAll(checked) {
  var cbs = document.querySelectorAll('.discover-cb');
  for (var i = 0; i < cbs.length; i++) {
    cbs[i].checked = checked;
  }
}

function importDiscoveredLeads(importAll) {
  var toImport = [];

  if (importAll) {
    toImport = _discoverResults.filter(function(l) { return l.business_name && !l._status; });
  } else {
    var cbs = document.querySelectorAll('.discover-cb:checked');
    for (var i = 0; i < cbs.length; i++) {
      var idx = parseInt(cbs[i].getAttribute('data-idx'));
      if (_discoverResults[idx] && _discoverResults[idx].business_name) {
        toImport.push(_discoverResults[idx]);
      }
    }
  }

  if (toImport.length === 0) { alert('No leads selected for import'); return; }

  // Check for duplicate emails
  var existingEmails = {};
  for (var i = 0; i < salesData.leads.length; i++) {
    if (salesData.leads[i].email) existingEmails[salesData.leads[i].email.toLowerCase()] = true;
  }

  var rows = [];
  var skipped = 0;
  for (var i = 0; i < toImport.length; i++) {
    var l = toImport[i];
    if (l.email && existingEmails[l.email.toLowerCase()]) { skipped++; continue; }
    rows.push({
      business_name: l.business_name,
      contact_name: l.contact_name || null,
      email: l.email || null,
      phone: l.phone || null,
      trade: l.trade || 'gas_engineer',
      location: l.location || null,
      postcode: l.postcode || null,
      gas_safe_number: l.gas_safe_number || null,
      website: l.website || null,
      source: 'web_discover',
      status: 'new'
    });
  }

  if (rows.length === 0) {
    alert('All selected leads already exist (matched by email). ' + skipped + ' skipped.');
    return;
  }

  sb.from('leads').insert(rows).select().then(function(res) {
    if (res.error) { alert('Import error: ' + res.error.message); return; }
    salesData.leads = (res.data || []).concat(salesData.leads);
    _discoverResults = [];
    var resultsEl = document.getElementById('discover-results');
    if (resultsEl) resultsEl.innerHTML = '';
    toggleDiscoverSection();
    salesSubTab = 'leads';
    renderPage();
    alert(rows.length + ' lead' + (rows.length > 1 ? 's' : '') + ' imported! Click "Research" on each lead to have Moti analyse them.' + (skipped > 0 ? ' (' + skipped + ' duplicate' + (skipped > 1 ? 's' : '') + ' skipped)' : ''));
  });
}

// ===== INIT =====
// Admin requires EXPLICIT login — do NOT piggyback off app.html session.
// We use sessionStorage to track if admin has authenticated on THIS page.
var ADMIN_AUTH_KEY = 'homelinq_admin_auth';

// Handle password recovery flow from email link
sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'PASSWORD_RECOVERY') {
    _adminRecovery = true;
    showAdminPasswordReset();
  }
});

sb.auth.getSession().then(function(res) {
  if (_adminRecovery) return;
  // Only auto-login if admin explicitly authenticated in this browser tab
  var adminAuthed = sessionStorage.getItem(ADMIN_AUTH_KEY);
  if (adminAuthed === 'true' && res.data.session && res.data.session.user && res.data.session.user.email === ADMIN_EMAIL) {
    currentUser = res.data.session.user;
    loadDashboard();
  } else {
    // Always show login — never auto-enter dashboard from app session
    renderLogin();
  }
});
</script>
