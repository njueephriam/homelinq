<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeLinq Admin — Platform Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--teal:#0D9488;--teal-light:#14B8A6;--navy:#0F172A;--dark:#1E293B;--card:#fff;--bg:#F1F5F9;--text:#1E293B;--muted:#64748B;--green:#10B981;--red:#EF4444;--orange:#F59E0B;--blue:#3B82F6;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.1)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* Login */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--dark))}
    .login-box{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .login-box h1{font-size:24px;margin-bottom:4px;color:var(--navy)}
    .login-box p{color:var(--muted);font-size:14px;margin-bottom:24px}
    .login-box .badge{display:inline-block;background:var(--teal);color:#fff;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:16px;letter-spacing:.5px}
    .login-input{width:100%;padding:12px 16px;border:2px solid #E2E8F0;border-radius:var(--radius);font-size:15px;margin-bottom:12px;transition:border-color .2s}
    .login-input:focus{outline:none;border-color:var(--teal)}
    .login-btn{width:100%;padding:14px;background:var(--teal);color:#fff;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;transition:background .2s}
    .login-btn:hover{background:var(--teal-light)}
    .login-error{color:var(--red);font-size:13px;margin-top:8px;display:none}

    /* Layout */
    .topbar{background:#fff;border-bottom:1px solid #E2E8F0;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .topbar h1{font-size:20px;color:var(--navy)}
    .topbar h1 span{color:var(--teal)}
    .topbar-right{display:flex;align-items:center;gap:16px}
    .topbar-user{font-size:13px;color:var(--muted)}
    .topbar-btn{padding:8px 16px;border:2px solid #E2E8F0;border-radius:var(--radius);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s}
    .topbar-btn:hover{border-color:var(--red);color:var(--red)}
    .refresh-btn{padding:8px 16px;border:2px solid var(--teal);border-radius:var(--radius);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--teal);transition:all .2s}
    .refresh-btn:hover{background:var(--teal);color:#fff}

    .container{max-width:1200px;margin:0 auto;padding:24px}

    /* Stats */
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
    .stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
    .stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
    .stat-card .value{font-size:32px;font-weight:800;margin-top:4px;color:var(--navy)}
    .stat-card .sub{font-size:13px;color:var(--muted);margin-top:4px}
    .stat-card.teal .value{color:var(--teal)}
    .stat-card.green .value{color:var(--green)}
    .stat-card.blue .value{color:var(--blue)}
    .stat-card.orange .value{color:var(--orange)}

    /* Cards */
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden}
    .card-header{padding:20px 24px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between}
    .card-header h2{font-size:18px;color:var(--navy)}
    .card-header .count{background:var(--bg);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;color:var(--muted)}
    .card-body{padding:24px}

    /* Table */
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{text-align:left;padding:12px 16px;background:var(--bg);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;white-space:nowrap}
    td{padding:12px 16px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#F8FAFC}
    .eng-name{font-weight:700;color:var(--navy)}
    .eng-email{color:var(--muted);font-size:13px}

    /* Badges */
    .badge-active{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#ECFDF5;color:#059669}
    .badge-pending{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#FEF3C7;color:#D97706}
    .badge-inactive{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#FEE2E2;color:#DC2626}

    /* Area chart */
    .area-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
    .area-card{background:var(--bg);border-radius:var(--radius);padding:16px;text-align:center}
    .area-card .area-name{font-weight:700;font-size:15px;color:var(--navy);margin-bottom:4px}
    .area-card .area-count{font-size:28px;font-weight:800;color:var(--teal)}
    .area-card .area-label{font-size:12px;color:var(--muted)}

    /* Data mode indicator */
    .data-mode{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px}
    .data-mode.live{background:#ECFDF5;color:#059669}

    /* Approval cards */
    .approval-card{background:#fff;border:2px solid #FDE68A;border-radius:var(--radius);padding:20px;margin-bottom:16px;display:flex;align-items:flex-start;gap:20px;transition:border-color .2s}
    .approval-card:hover{border-color:var(--orange)}
    .approval-avatar{width:48px;height:48px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
    .approval-info{flex:1;min-width:0}
    .approval-info h3{font-size:16px;color:var(--navy);margin-bottom:2px}
    .approval-info .meta{font-size:13px;color:var(--muted);margin-bottom:8px}
    .approval-detail{display:inline-flex;align-items:center;gap:6px;background:var(--bg);padding:6px 12px;border-radius:8px;font-size:13px;margin-right:8px;margin-bottom:6px}
    .approval-detail strong{color:var(--navy)}
    .approval-actions{display:flex;gap:8px;flex-shrink:0;align-items:center}
    .btn-approve{padding:10px 20px;background:var(--green);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s}
    .btn-approve:hover{opacity:.85}
    .btn-reject{padding:10px 20px;background:#fff;color:var(--red);border:2px solid var(--red);border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
    .btn-reject:hover{background:var(--red);color:#fff}
    .pending-alert{background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-radius:var(--radius);padding:16px 20px;margin-bottom:24px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:#92400E}
    .pending-alert .pulse{width:12px;height:12px;border-radius:50%;background:var(--orange);animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

    /* Loading */
    .loading{text-align:center;padding:60px 20px}
    .loading .spinner{width:40px;height:40px;border:4px solid #E2E8F0;border-top:4px solid var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Responsive */
    @media(max-width:768px){
      .stats-row{grid-template-columns:repeat(2,1fr)}
      .container{padding:16px}
      .topbar{padding:12px 16px}
      .topbar h1{font-size:16px}
      .area-grid{grid-template-columns:repeat(2,1fr)}
      .card-body{padding:16px}
      th,td{padding:10px 12px}
    }
    @media(max-width:480px){
      .stats-row{grid-template-columns:1fr}
      .topbar-user{display:none}
    }

    /* Tabs */
    .tab-nav{display:flex;gap:4px;background:#F1F5F9;border-radius:10px;padding:3px}
    .tab-btn{padding:8px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);transition:all .2s}
    .tab-btn.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
    .tab-btn:hover:not(.active){color:var(--navy)}

    /* Sales pipeline */
    .pipe-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
    .pipe-stat{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center}
    .pipe-stat .ps-val{font-size:28px;font-weight:800}
    .pipe-stat .ps-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:2px}
    .pipe-stat.new .ps-val{color:var(--blue)}
    .pipe-stat.contacted .ps-val{color:var(--orange)}
    .pipe-stat.replied .ps-val{color:var(--green)}
    .pipe-stat.signedup .ps-val{color:var(--teal)}
    .pipe-stat.due .ps-val{color:var(--red)}

    .action-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
    .action-bar .search-input{flex:1;min-width:200px;padding:10px 14px;border:2px solid #E2E8F0;border-radius:var(--radius);font-size:14px}
    .action-bar .search-input:focus{outline:none;border-color:var(--teal)}
    .action-bar select{padding:10px 14px;border:2px solid #E2E8F0;border-radius:var(--radius);font-size:13px;font-weight:600;background:#fff;cursor:pointer}
    .btn-sm{padding:8px 16px;border:none;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
    .btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{background:var(--teal-light)}
    .btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{opacity:.85}
    .btn-green{background:var(--green);color:#fff}.btn-green:hover{opacity:.85}
    .btn-outline{background:#fff;color:var(--navy);border:2px solid #E2E8F0}.btn-outline:hover{border-color:var(--teal);color:var(--teal)}
    .btn-danger{background:#fff;color:var(--red);border:2px solid #FEE2E2}.btn-danger:hover{background:#FEE2E2}

    .lead-row{display:flex;align-items:center;gap:16px;padding:14px 16px;border-bottom:1px solid #F1F5F9;transition:background .15s}
    .lead-row:hover{background:#F8FAFC}
    .lead-row:last-child{border-bottom:none}
    .lead-info{flex:1;min-width:0}
    .lead-name{font-weight:700;color:var(--navy);font-size:15px}
    .lead-meta{font-size:13px;color:var(--muted);margin-top:2px}
    .lead-actions{display:flex;gap:6px;flex-shrink:0}

    .badge-new{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#DBEAFE;color:#1D4ED8}
    .badge-contacted{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#FEF3C7;color:#D97706}
    .badge-replied{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#ECFDF5;color:#059669}
    .badge-signed{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#F0FDFA;color:#0D9488}
    .badge-declined{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#FEE2E2;color:#DC2626}

    /* Modal overlay */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}
    .modal-box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto}
    .modal-box h2{margin-bottom:16px;font-size:20px;color:var(--navy)}
    .modal-box label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px;margin-top:12px}
    .modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:10px 12px;border:2px solid #E2E8F0;border-radius:var(--radius);font-size:14px;font-family:inherit}
    .modal-box input:focus,.modal-box textarea:focus{outline:none;border-color:var(--teal)}
    .modal-box textarea{resize:vertical;min-height:80px}
    .modal-actions{display:flex;gap:8px;margin-top:20px}
    .csv-drop{border:2px dashed #E2E8F0;border-radius:var(--radius);padding:32px;text-align:center;color:var(--muted);cursor:pointer;transition:all .2s}
    .csv-drop:hover{border-color:var(--teal);color:var(--teal)}

    /* Outreach history */
    .oh-item{padding:10px 14px;border-left:3px solid #E2E8F0;margin-bottom:8px;background:#FAFBFC;border-radius:0 8px 8px 0}
    .oh-item.sent{border-left-color:var(--green)}
    .oh-item.failed{border-left-color:var(--red)}
    .oh-item.pending{border-left-color:var(--orange)}
    .oh-date{font-size:12px;color:var(--muted)}
    .oh-subject{font-weight:600;font-size:14px;color:var(--navy)}

    .followup-banner{background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-radius:var(--radius);padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:#92400E}

    /* Draft review modal — wider for email preview */
    .draft-modal{max-width:680px}
    .draft-subject{width:100%;padding:10px 14px;border:2px solid #E2E8F0;border-radius:var(--radius);font-size:15px;font-weight:600;font-family:inherit;margin-bottom:12px}
    .draft-subject:focus{outline:none;border-color:var(--teal)}
    .draft-preview{border:1px solid #E2E8F0;border-radius:var(--radius);padding:20px;max-height:400px;overflow-y:auto;background:#FAFBFC;margin-bottom:12px}
    .draft-preview img{max-width:100%}
    .draft-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
    .draft-moti-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#0D9488,#14B8A6);color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:16px}
    .draft-loading{text-align:center;padding:40px 20px}
    .draft-loading .spinner{width:32px;height:32px;border:3px solid #E2E8F0;border-top:3px solid var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
    .draft-edit-area{width:100%;min-height:200px;padding:12px;border:2px solid #E2E8F0;border-radius:var(--radius);font-size:13px;font-family:monospace;resize:vertical;display:none}
    .draft-edit-area:focus{outline:none;border-color:var(--teal)}
    .btn-purple{background:#7C3AED;color:#fff}.btn-purple:hover{opacity:.85}

    /* Discover leads */
    .discover-section{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:24px;display:none}
    .discover-section.open{display:block}
    .discover-section h3{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:16px}
    .discover-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
    .discover-row .field{flex:1;min-width:160px}
    .discover-row .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
    .discover-row .field input,.discover-row .field select{width:100%;padding:10px 12px;border:2px solid #E2E8F0;border-radius:var(--radius);font-size:14px}
    .discover-row .field input:focus,.discover-row .field select:focus{outline:none;border-color:var(--teal)}
    .discover-hint{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:16px}
    .discover-divider{text-align:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:20px 0;position:relative}
    .discover-divider::before,.discover-divider::after{content:'';position:absolute;top:50%;width:calc(50% - 50px);height:1px;background:#E2E8F0}
    .discover-divider::before{left:0}
    .discover-divider::after{right:0}
    .discover-textarea{width:100%;min-height:120px;padding:12px;border:2px solid #E2E8F0;border-radius:var(--radius);font-size:13px;font-family:'SFMono-Regular',monospace;resize:vertical;line-height:1.6}
    .discover-textarea:focus{outline:none;border-color:var(--teal)}
    .discover-textarea::placeholder{color:#CBD5E1}
    .discover-results{margin-top:20px;border-top:1px solid #E2E8F0;padding-top:16px}
    .discover-lead-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid #F1F5F9;font-size:14px}
    .discover-lead-row:hover{background:#F8FAFC}
    .discover-lead-row input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--teal)}
    .discover-lead-info{flex:1;min-width:0}
    .discover-lead-name{font-weight:700;color:var(--navy)}
    .discover-lead-meta{font-size:12px;color:var(--muted);margin-top:1px}
    .discover-loading{text-align:center;padding:32px}
    .discover-loading .spinner{width:32px;height:32px;border:3px solid #E2E8F0;border-top:3px solid var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}

    /* Sales sub-tabs */
    .sales-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
    .sales-tab{padding:8px 18px;border:2px solid #E2E8F0;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--muted);transition:all .2s}
    .sales-tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
    .sales-tab:hover:not(.active){border-color:var(--teal);color:var(--teal)}
    .sales-tab .tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;background:rgba(255,255,255,.3);border-radius:10px;font-size:11px;font-weight:700;margin-left:4px;padding:0 6px}
    .sales-tab:not(.active) .tab-count{background:#F1F5F9}
    .research-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px}
    .research-card h3{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:4px}
    .research-card .rc-meta{font-size:13px;color:var(--muted);margin-bottom:16px}
    .rc-fit{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-left:8px}
    .rc-fit.good{background:#ECFDF5;color:#059669}
    .rc-fit.ok{background:#FEF3C7;color:#D97706}
    .rc-fit.poor{background:#FEE2E2;color:#DC2626}
    .rc-section{margin-bottom:14px}
    .rc-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
    .rc-list{padding-left:20px;font-size:14px;line-height:1.8;color:var(--text)}
    .rc-warning{background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:10px 14px;font-size:13px;color:#92400E;margin-bottom:6px}
    .draft-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px}
    .draft-card .dc-to{font-size:13px;color:var(--muted);margin-bottom:4px}
    .draft-card .dc-subject{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:12px}
    .draft-card .dc-body{border:1px solid #E2E8F0;border-radius:var(--radius);padding:16px;max-height:300px;overflow-y:auto;background:#FAFBFC;margin-bottom:16px;font-size:14px;line-height:1.6}
    .outbox-item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 24px;margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .outbox-item .oi-info{flex:1;min-width:0}
    .outbox-item .oi-name{font-weight:700;color:var(--navy);font-size:15px}
    .outbox-item .oi-subject{font-size:14px;color:var(--text);margin-top:2px}
    .outbox-item .oi-meta{font-size:12px;color:var(--muted);margin-top:4px}
    .lc-item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 24px;margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .lc-item .lc-info{flex:1;min-width:0}
    .lc-item .lc-name{font-weight:700;color:var(--navy);font-size:15px}
    .lc-item .lc-meta{font-size:13px;color:var(--muted);margin-top:2px}
    .funnel-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F1F5F9;font-size:14px}

      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, 'apikey': SUPABASE_KEY},
      body: JSON.stringify(payload)

      else { console.log('Email error:', res.error); }

function viewVerificationDocs(engId) {
  sb.storage.from('verification-docs').list(engId, {limit: 50, sortBy: {column: 'created_at', order: 'desc'}}).then(function(res) {
    if (res.error) { alert('Could not load documents: ' + res.error.message); return; }
    var files = (res.data || []).filter(function(f) { return f.name && f.name.charAt(0) !== '.'; });
    if (!files.length) { alert('This engineer has not uploaded any documents yet.'); return; }
    var paths = files.map(function(f) { return engId + '/' + f.name; });
    sb.storage.from('verification-docs').createSignedUrls(paths, 600).then(function(sres) {
      if (sres.error) { alert('Could not open documents: ' + sres.error.message); return; }

  });

  var errEl = document.getElementById('login-error');
  if (!newPass || newPass.length < 6) { errEl.textContent = 'Password must be at least 6 characters'; errEl.style.display = 'block'; return; }
  if (newPass !== confirmPass) { errEl.textContent = 'Passwords do not match'; errEl.style.display = 'block'; return; }

  var btn = document.getElementById('save-pass-btn');
  if (btn) { btn.textContent = 'Saving...'; btn.disabled = true; }
  sb.auth.updateUser({password: newPass}).then(function(res) {
    if (res.error) {
      errEl.textContent = res.error.message;
      errEl.style.display = 'block';
      if (btn) { btn.textContent = 'Set Password & Sign In'; btn.disabled = false; }

    window.location.hash = '';
    currentUser = res.data.user;
    sessionStorage.setItem(ADMIN_AUTH_KEY, 'true');
    loadDashboard();
  });
}

    '<button class="login-btn" onclick="doAdminLogin()">Sign In</button>' +

    '<div style="margin-top:16px;text-align:center">' +

// ===== TAB SWITCHING =====
function switchAdminTab(tab) {
  currentAdminTab = tab;
  renderPage();
}

function switchSalesTab(tab) {
  salesSubTab = tab;
  renderPage();
}

function renderPage() {
  var h = '';
  // Topbar with tabs
  h += '<div class="topbar">' +
    '<h1>Home<span>Linq</span> Admin</h1>' +
    '<div class="tab-nav">' +
    '<button class="tab-btn' + (currentAdminTab === 'dashboard' ? ' active' : '') + '" onclick="switchAdminTab(\'dashboard\')">Dashboard</button>' +
    '<button class="tab-btn' + (currentAdminTab === 'sales' ? ' active' : '') + '" onclick="switchAdminTab(\'sales\')">Sales</button>' +
    '</div>' +
    '<div class="topbar-right">' +
    '<span class="data-mode live">● LIVE</span>' +
    '<button class="refresh-btn" onclick="loadDashboard()">↻ Refresh</button>' +
    '<span class="topbar-user">' + (currentUser ? currentUser.email : '') + '</span>' +
    '<button class="topbar-btn" onclick="doAdminLogout()">Sign Out</button>' +
    '</div></div>';

  h += '<div class="container">';

  // Connection errors
  if (queryErrors.length > 0) {
    h += '<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:var(--radius);padding:16px 20px;margin-bottom:16px">' +
      '<div style="font-weight:700;color:#DC2626;margin-bottom:8px">⚠️ Some tables could not be queried</div>' +
      '<div style="font-size:13px;color:#7F1D1D">' + queryErrors.join('<br>') + '</div></div>';
  }

  // Last refresh
  h += '<div style="text-align:right;margin-bottom:16px;font-size:12px;color:var(--muted)">' +
    'Last updated: ' + (lastRefresh ? fmtDateTime(lastRefresh) : '—') + '</div>';

  if (currentAdminTab === 'sales') {
    h += renderSalesContent();
  } else {
    h += renderDashboardContent();
  }

  h += '</div>'; // container
  document.getElementById('app').innerHTML = h;
}

// ===== RENDER DASHBOARD =====
function renderDashboardContent() {
  var engs = dashData.engineers;
  var custs = dashData.customers;
  var jobs = dashData.jobs;
  var invs = dashData.invoices;
  var mkpl = dashData.marketplace;

  // Split engineers by approval status
  var pendingEngs = [];
  var approvedEngs = [];
  var rejectedEngs = [];
  for (var i = 0; i < engs.length; i++) {
    var st = engs[i].status || 'pending'; // every engineer must be verified
    if (st === 'pending') pendingEngs.push(engs[i]);
    else if (st === 'rejected') rejectedEngs.push(engs[i]);
    else approvedEngs.push(engs[i]);
  }

  // Compute stats
  var totalEngs = approvedEngs.length;
  var totalCusts = custs.length;
  var totalJobs = jobs.length;
  var stripeActive = 0;
  var stripePending = 0;
  for (var i = 0; i < approvedEngs.length; i++) {
    var si = getStripeInfo(approvedEngs[i].id);
    if (si.stripe_status === 'active' && si.payouts_enabled) stripeActive++;
    else stripePending++;
  }

  var totalRevenue = 0;
  var paidInvoices = 0;
  var unpaidInvoices = 0;
  for (var i = 0; i < invs.length; i++) {
    if (invs[i].status === 'paid') { totalRevenue += (invs[i].amount || invs[i].total || 0); paidInvoices++; }
    else { unpaidInvoices++; }
  }

  var platformFees = Math.floor(totalRevenue * (15/85));

  var completedJobs = 0;
  var activeJobs = 0;
  for (var i = 0; i < jobs.length; i++) {
    if (jobs[i].status === 'completed') completedJobs++;
    else activeJobs++;
  }

  var openMarketplace = 0;
  for (var i = 0; i < mkpl.length; i++) {
    if (mkpl[i].status === 'new') openMarketplace++;
  }

  // Area breakdown (approved only) — reads from engineer 'area' column (comma-separated)
  var areas = {};
  for (var i = 0; i < approvedEngs.length; i++) {
    var engAreas = (approvedEngs[i].area || '').split(',').map(function(a){return a.trim()}).filter(function(a){return a});
    if (engAreas.length === 0) engAreas = ['Not Set'];
    for (var j = 0; j < engAreas.length; j++) {
      areas[engAreas[j]] = (areas[engAreas[j]] || 0) + 1;
    }
  }
  var areaKeys = Object.keys(areas).sort(function(a, b) { return areas[b] - areas[a]; });

  // Recent signups (last 7 days)
  var recentEngs = 0;
  var recentCusts = 0;
  for (var i = 0; i < engs.length; i++) { if (daysSince(engs[i].created_at) <= 7) recentEngs++; }
  for (var i = 0; i < custs.length; i++) { if (daysSince(custs[i].created_at) <= 7) recentCusts++; }

  // Build HTML
  var h = '';

  // PENDING APPROVALS — top of dashboard
  if (pendingEngs.length > 0) {
    h += '<div class="pending-alert"><div class="pulse"></div>' + pendingEngs.length + ' engineer' + (pendingEngs.length > 1 ? 's' : '') + ' awaiting Gas Safe verification</div>';
    h += '<div class="card" style="border:2px solid var(--orange)">';
    h += '<div class="card-header" style="background:#FFFBEB"><h2 style="color:#92400E">Pending Approvals</h2><span class="count" style="background:#FEF3C7;color:#D97706">' + pendingEngs.length + ' pending</span></div>';
    h += '<div class="card-body">';
    for (var i = 0; i < pendingEngs.length; i++) {
      var pe = pendingEngs[i];
      var initials = (pe.full_name || '??').split(' ').map(function(n){return n.charAt(0)}).join('').toUpperCase();
      h += '<div class="approval-card">' +
        '<div class="approval-avatar">' + initials + '</div>' +
        '<div class="approval-info">' +
        '<h3>' + (pe.full_name || 'Unknown') + '</h3>' +
        '<div class="meta">' + (pe.email || '—') + ' — Applied ' + fmtDate(pe.created_at) + '</div>' +
        '<div>' +
        '<span class="approval-detail">Gas Safe: <strong>' + (pe.gas_safe_number || 'N/A') + '</strong></span>' +
        '<span class="approval-detail">Business: <strong>' + (pe.business_name || 'N/A') + '</strong></span>' +
        '<span class="approval-detail">Phone: <strong>' + (pe.phone || 'N/A') + '</strong></span>' +
        '<span class="approval-detail">Area: <strong>' + (pe.area || 'Not Set') + '</strong></span>' +
        '</div></div>' +
        '<div class="approval-actions">' +
        '<button class="btn-approve" id="approve-' + pe.id + '" onclick="approveEngineer(\'' + pe.id + '\')">Approve</button>' +
        '<button class="btn-reject" id="reject-' + pe.id + '" onclick="rejectEngineer(\'' + pe.id + '\')">Reject</button>' +
        '<button class="btn-reject" style="background:#0D9488;color:#fff;border-color:#0D9488" onclick="viewVerificationDocs(\'' + pe.id + '\')">📄 Documents</button>' +
        '</div></div>';
    }
    h += '</div></div>';
  }

  // Stats row
  h += '<div class="stats-row">';
  h += '<div class="stat-card teal"><div class="label">Approved Engineers</div><div class="value">' + totalEngs + '</div><div class="sub">' + pendingEngs.length + ' pending approval</div></div>';
  h += '<div class="stat-card blue"><div class="label">Registered Customers</div><div class="value">' + totalCusts + '</div><div class="sub">' + recentCusts + ' new this week</div></div>';
  h += '<div class="stat-card green"><div class="label">Total Jobs</div><div class="value">' + totalJobs + '</div><div class="sub">' + completedJobs + ' completed, ' + activeJobs + ' active</div></div>';
  h += '<div class="stat-card orange"><div class="label">Platform Fees Earned</div><div class="value">&#163;' + platformFees.toLocaleString() + '</div><div class="sub">From &#163;' + totalRevenue.toLocaleString() + ' total revenue</div></div>';
  h += '</div>';

  // Second stats row
  h += '<div class="stats-row">';
  h += '<div class="stat-card"><div class="label">Stripe Connected</div><div class="value" style="color:var(--green)">' + stripeActive + '</div><div class="sub">' + stripePending + ' pending setup</div></div>';
  h += '<div class="stat-card"><div class="label">Invoices Paid</div><div class="value" style="color:var(--green)">' + paidInvoices + '</div><div class="sub">' + unpaidInvoices + ' outstanding</div></div>';
  h += '<div class="stat-card"><div class="label">Marketplace Jobs</div><div class="value" style="color:var(--blue)">' + mkpl.length + '</div><div class="sub">' + openMarketplace + ' open listings</div></div>';
  h += '<div class="stat-card"><div class="label">Coverage Areas</div><div class="value" style="color:var(--teal)">' + areaKeys.length + '</div><div class="sub">' + areaKeys.slice(0, 3).join(', ') + (areaKeys.length > 3 ? '...' : '') + '</div></div>';
  h += '</div>';

  // Third stats row — quotes & certificates
  var totalQuotes = dashData.quotes.length;
  var totalCerts = dashData.certificates.length;
  h += '<div class="stats-row" style="grid-template-columns:repeat(2,1fr)">';
  h += '<div class="stat-card"><div class="label">Quotes Sent</div><div class="value" style="color:var(--blue)">' + totalQuotes + '</div><div class="sub">Track quote conversions</div></div>';
  h += '<div class="stat-card"><div class="label">CP12 Certificates</div><div class="value" style="color:var(--teal)">' + totalCerts + '</div><div class="sub">Gas safety compliance</div></div>';
  h += '</div>';

  // Engineers table (approved only)
  h += '<div class="card">';
  h += '<div class="card-header"><h2>Approved Engineers</h2><span class="count">' + approvedEngs.length + ' active</span></div>';
  h += '<div class="card-body"><div class="table-wrap"><table>';
  h += '<thead><tr><th>Engineer</th><th>Business</th><th>Gas Safe</th><th>Area</th><th>Phone</th><th>Stripe</th><th>Registered</th></tr></thead>';
  h += '<tbody>';
  for (var i = 0; i < approvedEngs.length; i++) {
    var e = approvedEngs[i];
    var si = getStripeInfo(e.id);
    var stripeHtml = '';
    if (si.stripe_status === 'active' && si.payouts_enabled) {
      stripeHtml = '<span class="badge-active">Active</span>';
    } else if (si.stripe_account_id) {
      stripeHtml = '<span class="badge-pending">Incomplete</span>';
    } else {
      stripeHtml = '<span class="badge-inactive">Not Connected</span>';
    }
    h += '<tr>' +
      '<td><div class="eng-name">' + (e.full_name || '—') + '</div><div class="eng-email">' + (e.email || '—') + '</div></td>' +
      '<td>' + (e.business_name || '—') + '</td>' +
      '<td>' + (e.gas_safe_number || '—') + '</td>' +
      '<td>' + (e.area ? e.area.split(',').slice(0,3).map(function(a){return areaLabel(a.trim())}).join(', ') + (e.area.split(',').length > 3 ? ' <span style="color:var(--muted)">+' + (e.area.split(',').length - 3) + ' more</span>' : '') : '<span style="color:var(--muted)">Not Set</span>') + '</td>' +
      '<td>' + (e.phone || '—') + '</td>' +
      '<td>' + stripeHtml + '</td>' +
      '<td>' + fmtDate(e.created_at) + '</td>' +
      '</tr>';
  }
  if (approvedEngs.length === 0) {
    h += '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:40px">No approved engineers yet</td></tr>';
  }
  h += '</tbody></table></div></div></div>';

  // Geographic Coverage
  h += '<div class="card">';
  h += '<div class="card-header"><h2>Geographic Coverage</h2><span class="count">' + areaKeys.length + ' areas</span></div>';
  h += '<div class="card-body">';
  if (areaKeys.length > 0) {
    h += '<div class="area-grid">';
    for (var i = 0; i < areaKeys.length; i++) {
      h += '<div class="area-card">' +
        '<div class="area-name">' + areaLabel(areaKeys[i]) + '</div>' +
        '<div class="area-count">' + areas[areaKeys[i]] + '</div>' +
        '<div class="area-label">engineer' + (areas[areaKeys[i]] > 1 ? 's' : '') + '</div>' +
        '</div>';
    }
    h += '</div>';
  } else {
    h += '<div style="text-align:center;color:var(--muted);padding:20px">No geographic data yet</div>';
  }
  h += '</div></div>';

  // Customers table
  h += '<div class="card">';
  h += '<div class="card-header"><h2>Registered Customers</h2><span class="count">' + totalCusts + ' total</span></div>';
  h += '<div class="card-body"><div class="table-wrap"><table>';
  h += '<thead><tr><th>Customer</th><th>Email</th><th>Phone</th><th>Address</th><th>Registered</th></tr></thead>';
  h += '<tbody>';
  for (var i = 0; i < custs.length; i++) {
    var c = custs[i];
    h += '<tr>' +
      '<td><strong>' + (c.full_name || '—') + '</strong></td>' +
      '<td>' + (c.email || '—') + '</td>' +
      '<td>' + (c.phone || '—') + '</td>' +
      '<td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (c.address || '—') + '</td>' +
      '<td>' + fmtDate(c.created_at) + '</td>' +
      '</tr>';
  }
  if (custs.length === 0) {
    h += '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:40px">No customers registered yet</td></tr>';
  }
  h += '</tbody></table></div></div></div>';

  // Helper: engineer name by ID
  function engNameById(eid) {
    for (var x = 0; x < engs.length; x++) { if (engs[x].id === eid) return engs[x].full_name || engs[x].business_name || '—'; }
    return '—';
  }

  // Jobs table
  var sortedJobs = jobs.slice().sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
  h += '<div class="card">';
  h += '<div class="card-header"><h2>All Jobs</h2><span class="count">' + totalJobs + ' total</span></div>';
  h += '<div class="card-body"><div class="table-wrap"><table>';
  h += '<thead><tr><th>Date</th><th>Engineer</th><th>Customer</th><th>Description</th><th>Status</th><th>Price</th><th>Address</th></tr></thead>';
  h += '<tbody>';
  var showJobs = Math.min(sortedJobs.length, 30);
  for (var i = 0; i < showJobs; i++) {
    var jb = sortedJobs[i];
    var jStatus = jb.status || 'upcoming';
    var jBadge = jStatus === 'completed' ? 'badge-active' : jStatus === 'in_progress' ? 'badge-pending' : 'badge-inactive';
    h += '<tr>' +
      '<td style="white-space:nowrap">' + fmtDate(jb.scheduled_date || jb.created_at) + '</td>' +
      '<td>' + engNameById(jb.engineer_id) + '</td>' +
      '<td>' + (jb.customer_name || '—') + '</td>' +
      '<td>' + (jb.description || '—') + '</td>' +
      '<td><span class="' + jBadge + '">' + jStatus + '</span></td>' +
      '<td>' + (jb.price ? '&#163;' + jb.price : '—') + '</td>' +
      '<td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (jb.address || '—') + '</td>' +
      '</tr>';
  }
  if (sortedJobs.length === 0) {
    h += '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:40px">No jobs yet</td></tr>';
  }
  if (sortedJobs.length > 30) {
    h += '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:12px;font-size:13px">Showing latest 30 of ' + sortedJobs.length + ' jobs</td></tr>';
  }
  h += '</tbody></table></div></div></div>';

  // Invoices table
  var sortedInvs = invs.slice().sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
  h += '<div class="card">';
  h += '<div class="card-header"><h2>Invoices</h2><span class="count">' + invs.length + ' total &mdash; ' + paidInvoices + ' paid, ' + unpaidInvoices + ' outstanding</span></div>';
  h += '<div class="card-body"><div class="table-wrap"><table>';
  h += '<thead><tr><th>Date</th><th>Invoice #</th><th>Engineer</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead>';
  h += '<tbody>';
  var showInvs = Math.min(sortedInvs.length, 30);
  for (var i = 0; i < showInvs; i++) {
    var inv = sortedInvs[i];
    var invBadge = inv.status === 'paid' ? 'badge-active' : inv.status === 'sent' ? 'badge-pending' : 'badge-inactive';
    h += '<tr>' +
      '<td style="white-space:nowrap">' + fmtDate(inv.created_at) + '</td>' +
      '<td style="font-weight:700">' + (inv.invoice_number || inv.id || '—') + '</td>' +
      '<td>' + engNameById(inv.engineer_id) + '</td>' +
      '<td>' + (inv.customer_name || '—') + '</td>' +
      '<td style="font-weight:700">&#163;' + (inv.amount || inv.total || 0) + '</td>' +
      '<td><span class="' + invBadge + '">' + (inv.status || 'draft') + '</span></td>' +
      '</tr>';
  }
  if (sortedInvs.length === 0) {
    h += '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:40px">No invoices yet</td></tr>';
  }
  if (sortedInvs.length > 30) {
    h += '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:12px;font-size:13px">Showing latest 30 of ' + sortedInvs.length + ' invoices</td></tr>';
  }
  h += '</tbody></table></div></div></div>';

  // Quotes table
  var quotes = dashData.quotes;
  var sortedQuotes = quotes.slice().sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
  var acceptedQuotes = 0;
  var pendingQuotes = 0;
  for (var i = 0; i < quotes.length; i++) {
    if (quotes[i].status === 'accepted' || quotes[i].status === 'scheduled') acceptedQuotes++;
    else if (quotes[i].status === 'sent' || quotes[i].status === 'draft') pendingQuotes++;
  }
  h += '<div class="card">';
  h += '<div class="card-header"><h2>Quotes</h2><span class="count">' + quotes.length + ' total &mdash; ' + acceptedQuotes + ' accepted, ' + pendingQuotes + ' pending</span></div>';
  h += '<div class="card-body"><div class="table-wrap"><table>';
  h += '<thead><tr><th>Date</th><th>Engineer</th><th>Customer</th><th>Description</th><th>Amount</th><th>Status</th></tr></thead>';
  h += '<tbody>';
  var showQuotes = Math.min(sortedQuotes.length, 30);
  for (var i = 0; i < showQuotes; i++) {
    var qt = sortedQuotes[i];
    var qtBadge = (qt.status === 'accepted' || qt.status === 'scheduled') ? 'badge-active' : (qt.status === 'sent' || qt.status === 'draft') ? 'badge-pending' : 'badge-inactive';
    h += '<tr>' +
      '<td style="white-space:nowrap">' + fmtDate(qt.created_at) + '</td>' +
      '<td>' + engNameById(qt.engineer_id) + '</td>' +
      '<td>' + (qt.customer_name || '—') + '</td>' +
      '<td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (qt.description || qt.job_type || '—') + '</td>' +
      '<td style="font-weight:700">' + (qt.total ? '&#163;' + qt.total : '—') + '</td>' +
      '<td><span class="' + qtBadge + '">' + (qt.status || 'draft') + '</span></td>' +
      '</tr>';
  }
  if (sortedQuotes.length === 0) {
    h += '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:40px">No quotes yet</td></tr>';
  }
  h += '</tbody></table></div></div></div>';

  // Certificates table
  var certs = dashData.certificates;
  var sortedCerts = certs.slice().sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
  h += '<div class="card">';
  h += '<div class="card-header"><h2>CP12 Certificates</h2><span class="count">' + certs.length + ' issued</span></div>';
  h += '<div class="card-body"><div class="table-wrap"><table>';
  h += '<thead><tr><th>Date</th><th>Engineer</th><th>Customer</th><th>Address</th><th>Appliances</th><th>Result</th></tr></thead>';
  h += '<tbody>';
  var showCerts = Math.min(sortedCerts.length, 30);
  for (var i = 0; i < showCerts; i++) {
    var ct = sortedCerts[i];
    var ctResult = ct.overall_result || ct.result || 'pass';
    var ctBadge = ctResult.toLowerCase() === 'pass' ? 'badge-active' : ctResult.toLowerCase() === 'fail' ? 'badge-inactive' : 'badge-pending';
    h += '<tr>' +
      '<td style="white-space:nowrap">' + fmtDate(ct.inspection_date || ct.created_at) + '</td>' +
      '<td>' + engNameById(ct.engineer_id) + '</td>' +
      '<td>' + (ct.customer_name || ct.landlord_name || '—') + '</td>' +
      '<td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (ct.address || '—') + '</td>' +
      '<td>' + (ct.appliance_count || ct.num_appliances || '—') + '</td>' +
      '<td><span class="' + ctBadge + '">' + ctResult + '</span></td>' +
      '</tr>';
  }
  if (sortedCerts.length === 0) {

// ===== SALES PIPELINE =====
var FOLLOWUP_DAYS = [3, 7, 14];

function getLeadOutreach(leadId) {
  return salesData.outreach.filter(function(o) { return o.lead_id === leadId; });
}

function getFollowUpsDue() {
  var due = [];
  var now = Date.now();
  for (var i = 0; i < salesData.leads.length; i++) {
    var lead = salesData.leads[i];
    if (!lead.email || lead.status === 'replied' || lead.status === 'signed_up' || lead.status === 'declined' || lead.status === 'unsubscribed') continue;
    var emails = getLeadOutreach(lead.id).filter(function(o) { return o.status === 'sent'; });
    if (emails.length === 0) continue;
    // Sort by sent_at descending
    emails.sort(function(a, b) { return new Date(b.sent_at) - new Date(a.sent_at); });
    var lastSent = emails[0];
    var daysSinceLast = Math.floor((now - new Date(lastSent.sent_at).getTime()) / 86400000);
    var totalSent = emails.length;
    // Determine next follow-up number
    var nextFollowup = totalSent; // 1=followup1, 2=followup2, 3=followup3
    if (nextFollowup > 3) continue; // All follow-ups sent
    var dueAfterDays = FOLLOWUP_DAYS[nextFollowup - 1];
    if (daysSinceLast >= dueAfterDays) {
      due.push({lead: lead, followupNum: nextFollowup, daysSinceLast: daysSinceLast, lastEmail: lastSent});
    }
  }
  return due;
}

function getNextFollowupType(leadId) {
  var emails = getLeadOutreach(leadId).filter(function(o) { return o.status === 'sent'; });
  var totalSent = emails.length;
  if (totalSent <= 0) return 'followup_1';
  if (totalSent >= 3) return 'followup_3';
  return 'followup_' + totalSent;
}

}

  if (draftsReady > 0) h += '<button class="btn-sm btn-teal" onclick="switchSalesTab(\'drafts\')">' + draftsReady + ' Draft' + (draftsReady > 1 ? 's' : '') + ' approved</button>';

    h += '<button class="btn-sm btn-danger" onclick="rejectDraft(\'' + d.id + '\')">Reject</button>';
    h += '</div>';

    // Amendment area (hidden by default)
    h += '<div id="amend-area-' + d.id + '" style="display:none;margin-top:16px">';
    h += '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Tell Moti what to change</div>';
    h += '<textarea id="amend-text-' + d.id + '" placeholder="e.g. &quot;make it less pitchy&quot;, &quot;mention their boiler servicing line&quot;, &quot;shorten by 30 words&quot;" style="width:100%;min-height:80px;padding:12px;border:2px solid #E2E8F0;border-radius:var(--radius);font-size:14px;font-family:inherit;resize:vertical"></textarea>';
    h += '<div style="display:flex;gap:8px;margin-top:8px">';
    h += '<button class="btn-sm btn-teal" onclick="submitAmendment(\'' + d.id + '\')">Ask Moti to rewrite</button>';
    h += '<button class="btn-sm btn-outline" onclick="document.getElementById(\'amend-area-' + d.id + '\').style.display=\'none\'">Cancel</button>';
    h += '</div></div>';

    h += '</div>';
  }

  return h;
}

    h += '<button class="pill' + (lcFilter === filters[f] ? ' active' : '') + '" onclick="lcFilter=\'' + filters[f] + '\';renderPage()">' + filterLabels[f] + '</button>';
  }
  h += '</div>';

  for (var i = 0; i < salesData.leads.length; i++) {

    h += '<div class="card"><div class="card-body" style="text-align:center;color:var(--muted);padding:60px">';

    h += '<span style="display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;' + badgeColor + '">' + ls.replace(/_/g, ' ').toUpperCase() + '</span>';

    h += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
    h += '<button class="btn-sm btn-outline" onclick="viewLeadHistory(\'' + l.id + '\')">View thread</button>';

      h += '<button class="btn-sm btn-green" onclick="markLeadStatus(\'' + l.id + '\',\'replied\')">Mark replied</button>';

    }
    h += '</div></div>';
  }

  return h;
}

// ===== INSIGHTS TAB =====
function renderInsightsTab() {
  var leads = salesData.leads;
  var outreach = salesData.outreach;
  var h = '';

  // Count funnel stages
  var total = leads.length;
  var researched = 0, drafted = 0, sent = 0, replied = 0, customer = 0;
  for (var i = 0; i < leads.length; i++) {
    if (leads[i].research_status === 'completed' || leads[i].research_status === 'approved') researched++;
    var st = leads[i].status || 'new';
    if (st === 'replied') replied++;
    if (st === 'signed_up') customer++;
  }
  for (var i = 0; i < outreach.length; i++) {
    if (outreach[i].status === 'draft') drafted++;
    if (outreach[i].status === 'sent') sent++;
  }

  // Conversion funnel
  h += '<div class="card" style="margin-bottom:24px"><div class="card-header"><h2>Conversion funnel</h2></div><div class="card-body">';
  var maxVal = Math.max(total, 1);
  var funnelData = [
    {label: 'Leads', val: total, pct: '—'},
    {label: 'Researched', val: researched, pct: total > 0 ? Math.round(researched / total * 100) + '%' : '0%'},
    {label: 'Drafted', val: drafted, pct: total > 0 ? Math.round(drafted / total * 100) + '%' : '0%'},
    {label: 'Sent', val: sent, pct: total > 0 ? Math.round(sent / total * 100) + '%' : '0%'},
    {label: 'Replied', val: replied, pct: sent > 0 ? Math.round(replied / sent * 100) + '%' : '0%'},
    {label: 'Customer', val: customer, pct: sent > 0 ? Math.round(customer / sent * 100) + '%' : '—'}
  ];
  for (var f = 0; f < funnelData.length; f++) {
    var fd = funnelData[f];
    var barW = maxVal > 0 ? Math.max((fd.val / maxVal) * 100, fd.val > 0 ? 2 : 0) : 0;
    h += '<div class="funnel-row">';
    h += '<div class="funnel-label">' + fd.label + '</div>';
    h += '<div class="funnel-bar-wrap"><div class="funnel-bar" style="width:' + barW + '%"></div></div>';
    h += '<div class="funnel-val">' + fd.val + '</div>';
    h += '<div class="funnel-pct" style="color:' + (fd.pct !== '—' && fd.pct !== '0%' ? 'var(--green)' : 'var(--muted)') + '">' + fd.pct + '</div>';
    h += '</div>';
  }
  h += '</div></div>';

  // Insight cards
  h += '<div class="insight-grid">';

  // Hot leads
  var hotLeads = [];
  for (var i = 0; i < leads.length; i++) {
    if (leads[i].research_status === 'completed' && leads[i].research_data && leads[i].research_data.fit_score >= 7) hotLeads.push(leads[i]);
  }
  h += '<div class="insight-card"><h4>&#128293; Hot leads (fit 7+)</h4>';
  if (hotLeads.length === 0) {
    h += '<div style="text-align:center;color:var(--muted);padding:20px;font-size:13px">No high-fit leads yet. Research more leads to find hot prospects.</div>';
  } else {
    for (var i = 0; i < Math.min(hotLeads.length, 5); i++) {
      var hl = hotLeads[i];
      h += '<div style="padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:13px"><strong>' + (hl.business_name || '') + '</strong> — fit ' + (hl.research_data.fit_score || 0) + '/10</div>';
    }
  }
  h += '</div>';

  // Replied - needs action
  var needsAction = [];
  for (var i = 0; i < leads.length; i++) {
    if (leads[i].status === 'replied') needsAction.push(leads[i]);
  }
  h += '<div class="insight-card"><h4>&#128172; Replied — needs action</h4>';
  if (needsAction.length === 0) {
    h += '<div style="text-align:center;color:var(--muted);padding:20px;font-size:13px">No replies pending action.</div>';
  } else {
    for (var i = 0; i < Math.min(needsAction.length, 5); i++) {
      h += '<div style="padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:13px"><strong>' + (needsAction[i].business_name || '') + '</strong> — ' + (needsAction[i].location || '') + '</div>';
    }
  }
  h += '</div>';

  // No email leads
  var noEmailCount = 0;
  for (var i = 0; i < leads.length; i++) {
    if (!leads[i].email) noEmailCount++;
  }
  h += '<div class="insight-card"><h4>&#9888; No email address</h4>';
  h += '<div style="font-size:32px;font-weight:800;color:var(--orange);margin-bottom:4px">' + noEmailCount + '</div>';
  h += '<div style="font-size:13px;color:var(--muted)">leads without email — research their websites to find contact details</div>';
  h += '</div>';

  h += '</div>';

  // Trade breakdown
  h += '<div class="card"><div class="card-header"><h2>&#9881; Trade breakdown</h2></div><div class="card-body">';
  var trades = {};
  for (var i = 0; i < leads.length; i++) {
    var tr = leads[i].trade || 'unknown';
    if (!trades[tr]) trades[tr] = {total: 0, contacted: 0};
    trades[tr].total++;
    var st = leads[i].status || 'new';
    if (st === 'contacted' || st === 'replied' || st === 'signed_up') trades[tr].contacted++;
  }
  for (var tr in trades) {
    var pct = trades[tr].total > 0 ? Math.round(trades[tr].contacted / trades[tr].total * 100) : 0;
    h += '<div style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #F1F5F9">';
    h += '<div style="font-weight:700;min-width:180px">' + tr.replace(/_/g, ' ') + '</div>';
    h += '<div style="color:var(--muted);font-size:13px">' + trades[tr].total + ' leads &middot; ' + pct + '% engaged</div>';
    h += '</div>';
  }
  h += '</div></div>';

  return h;
}

// ===== RESEARCH ACTIONS =====
function researchLead(leadId) {
  var lead = null;
  for (var i = 0; i < salesData.leads.length; i++) {
    if (salesData.leads[i].id === leadId) { lead = salesData.leads[i]; break; }
  }
  if (!lead) return;

  // Update UI immediately
  lead.research_status = 'pending';
  renderPage();

  fetch(EDGE_URL + '/research-lead', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'apikey': SUPABASE_KEY},
    body: JSON.stringify({lead: lead})
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (res.error) {
      lead.research_status = null;
      renderPage();
      alert('Research failed: ' + res.error);
      return;
    }
    lead.research_data = res.research;
    lead.research_status = 'completed';
    lead.researched_at = new Date().toISOString();
    renderPage();
    alert('Research complete. Check the Research tab to review and approve.');
  }).catch(function(err) {
    lead.research_status = null;
    renderPage();
    alert('Failed to reach Moti. Check your connection.');
    console.log('Research error:', err);
  });
}

function approveResearch(leadId) {
  var lead = null;
  for (var i = 0; i < salesData.leads.length; i++) {
    if (salesData.leads[i].id === leadId) { lead = salesData.leads[i]; break; }
  }
  if (!lead || !lead.email) { alert('No email address for this lead'); return; }

  // Update research status
  sb.from('leads').update({research_status: 'approved'}).eq('id', leadId).then(function() {
    lead.research_status = 'approved';
  });

  // Show loading indicator
  alert('Moti is drafting the email... This takes 10-20 seconds. You\'ll get an alert when done.');

  // Call draft-outreach with research data included in the lead
  var leadWithResearch = {};
  for (var key in lead) { leadWithResearch[key] = lead[key]; }

  fetch(EDGE_URL + '/draft-outreach', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'apikey': SUPABASE_KEY},
    body: JSON.stringify({lead: leadWithResearch, email_type: 'initial'})
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (res.error) {
      alert('Draft failed: ' + res.error);
      return;
    }

    // Save as draft in outreach_emails
    var fullBody = res.body_html + SALES_SIGNATURE;
    sb.from('outreach_emails').insert({
      lead_id: leadId,
      subject: res.subject,
      body_html: fullBody,
      email_type: 'initial',
      status: 'draft',
      followup_number: 0
    }).select().then(function(insertRes) {
      if (insertRes.error) { alert('Failed to save draft: ' + insertRes.error.message); return; }
      salesData.outreach.unshift(insertRes.data[0]);
      salesSubTab = 'drafts';
      renderPage();
      alert('Draft created! Review it in the Drafts tab.');
    });
  }).catch(function(err) {
    alert('Failed to reach Moti for drafting.');
    console.log('Draft error:', err);
  });
}

function rejectResearch(leadId) {
  if (!confirm('Reject this research? The lead will go back to the Leads tab as unresearched.')) return;
  sb.from('leads').update({research_status: 'rejected', research_data: null}).eq('id', leadId).then(function(res) {
    if (res.error) { alert('Error: ' + res.error.message); return; }
    var lead = null;
    for (var i = 0; i < salesData.leads.length; i++) {
      if (salesData.leads[i].id === leadId) { lead = salesData.leads[i]; break; }
    }
    if (lead) { lead.research_status = 'rejected'; lead.research_data = null; }
    renderPage();
  });
}

// ===== DRAFT ACTIONS (TAB-BASED) =====
function approveDraftFromTab(outreachId) {
  var draft = null;
  for (var i = 0; i < salesData.outreach.length; i++) {
    if (salesData.outreach[i].id === outreachId) { draft = salesData.outreach[i]; break; }
  }
  if (!draft) return;

  var lead = null;
  for (var i = 0; i < salesData.leads.length; i++) {
    if (salesData.leads[i].id === draft.lead_id) { lead = salesData.leads[i]; break; }
  }
  if (!lead || !lead.email) { alert('No email for this lead'); return; }

  if (!confirm('Send this email to ' + lead.email + '?')) return;

  // Send the email
  sendAdminEmail(lead.email, draft.subject, 'generic', {message: draft.body_html});

  // Update outreach status
  sb.from('outreach_emails').update({status: 'sent', sent_at: new Date().toISOString()}).eq('id', outreachId).then(function(res) {
    if (res.error) { alert('Error updating status: ' + res.error.message); return; }
    draft.status = 'sent';
    draft.sent_at = new Date().toISOString();

    // Update lead status to contacted
    sb.from('leads').update({status: 'contacted', updated_at: new Date().toISOString()}).eq('id', draft.lead_id).then(function() {
      if (lead) lead.status = 'contacted';
      renderPage();
      alert('Email sent to ' + lead.email + '!');
    });
  });
}

function showAmendArea(outreachId) {
  var el = document.getElementById('amend-area-' + outreachId);
  if (el) el.style.display = 'block';
}

function submitAmendment(outreachId) {
  var textarea = document.getElementById('amend-text-' + outreachId);
  if (!textarea || !textarea.value.trim()) { alert('Tell Moti what to change'); return; }

  var draft = null;
  for (var i = 0; i < salesData.outreach.length; i++) {
    if (salesData.outreach[i].id === outreachId) { draft = salesData.outreach[i]; break; }
  }
  if (!draft) return;

  var lead = null;
  for (var i = 0; i < salesData.leads.length; i++) {
    if (salesData.leads[i].id === draft.lead_id) { lead = salesData.leads[i]; break; }
  }
  if (!lead) return;

  var feedback = textarea.value.trim();
  var leadWithContext = {};
  for (var key in lead) { leadWithContext[key] = lead[key]; }
  leadWithContext._amendment_feedback = feedback;
  leadWithContext._original_draft = draft.body_html;

  alert('Moti is rewriting... You\'ll get an alert when done.');

  fetch(EDGE_URL + '/draft-outreach', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'apikey': SUPABASE_KEY},
    body: JSON.stringify({lead: leadWithContext, email_type: draft.email_type || 'initial'})
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (res.error) { alert('Rewrite failed: ' + res.error); return; }

    var fullBody = res.body_html + SALES_SIGNATURE;
    sb.from('outreach_emails').update({subject: res.subject, body_html: fullBody}).eq('id', outreachId).then(function(upRes) {
      if (upRes.error) { alert('Failed to save rewrite: ' + upRes.error.message); return; }
      draft.subject = res.subject;
      draft.body_html = fullBody;
      renderPage();
      alert('Draft rewritten by Moti. Review the updated version.');
    });
  }).catch(function(err) {
    alert('Failed to reach Moti for rewrite.');
    console.log('Amendment error:', err);
  });
}

function rejectDraft(outreachId) {
  if (!confirm('Reject this draft? It will be removed.')) return;
  sb.from('outreach_emails').update({status: 'rejected'}).eq('id', outreachId).then(function(res) {
    if (res.error) { alert('Error: ' + res.error.message); return; }
    for (var i = 0; i < salesData.outreach.length; i++) {
      if (salesData.outreach[i].id === outreachId) { salesData.outreach[i].status = 'rejected'; break; }
    }
    renderPage();
  });
}

// Legacy template-based send functions (kept as fallback, now with signature)
function sendOutreach(leadId) {
  var lead = salesData.leads.find(function(l) { return l.id === leadId; });
  if (!lead || !lead.email) { alert('No email address for this lead'); return; }
  if (!confirm('Send template pitch to ' + lead.email + '? (Use "Draft Email" for AI-personalised version)')) return;

  var email = buildOutreachEmail(lead, 'initial');
  var fullBody = email.body + SALES_SIGNATURE;

  sb.from('outreach_emails').insert({
    lead_id: leadId,
    subject: email.subject,
    body_html: fullBody,
    email_type: 'initial',
    status: 'pending',
    followup_number: 0
  }).select().then(function(insertRes) {
    if (insertRes.error) { alert('Failed to record email: ' + insertRes.error.message); return; }
    var outreachId = insertRes.data[0].id;

    sendAdminEmail(lead.email, email.subject, 'generic', {message: fullBody});

    sb.from('outreach_emails').update({status: 'sent', sent_at: new Date().toISOString()}).eq('id', outreachId).then(function() {
      sb.from('leads').update({status: 'contacted', updated_at: new Date().toISOString()}).eq('id', leadId).then(function() {
        var localLead = salesData.leads.find(function(l) { return l.id === leadId; });
        if (localLead) localLead.status = 'contacted';
        salesData.outreach.push({id: outreachId, lead_id: leadId, subject: email.subject, email_type: 'initial', status: 'sent', sent_at: new Date().toISOString(), followup_number: 0, created_at: new Date().toISOString()});
        renderPage();
        alert('Outreach email sent to ' + lead.email);
      });
    });
  });
}

// ===== MOTI AI DRAFTING =====
var _draftState = {leadId: null, emailType: null, subject: '', bodyHtml: '', editing: false};

function draftOutreachEmail(leadId, emailType) {
  var lead = salesData.leads.find(function(l) { return l.id === leadId; });
  if (!lead || !lead.email) { alert('No email address for this lead'); return; }

  // Show loading modal
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'draftModal';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = '<div class="modal-box draft-modal">' +
    '<div class="draft-moti-badge"><span style="font-size:14px">&#129302;</span> Moti AI</div>' +
    '<h2>Drafting email for ' + (lead.business_name || 'lead') + '</h2>' +
    '<div class="draft-loading">' +
    '<div class="spinner"></div>' +
    '<div style="color:var(--muted);font-size:14px">Moti is writing a personalised ' + emailType.replace(/_/g, ' ') + ' email...</div>' +
    '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  // Call draft-outreach edge function
  fetch(EDGE_URL + '/draft-outreach', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'apikey': SUPABASE_KEY},
    body: JSON.stringify({lead: lead, email_type: emailType})
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (res.error) {
      overlay.remove();
      alert('Moti could not draft the email: ' + res.error);
      return;
    }
    // Store draft state
    _draftState.leadId = leadId;
    _draftState.emailType = emailType;
    _draftState.subject = res.subject;
    _draftState.bodyHtml = res.body_html;
    _draftState.editing = false;

    // Show review modal
    showDraftReviewModal(lead);
  }).catch(function(err) {
    overlay.remove();
    alert('Failed to reach Moti. Please check your connection and try again.');
    console.log('Draft error:', err);
  });
}

function showDraftReviewModal(lead) {
  var overlay = document.getElementById('draftModal');
  if (!overlay) return;

  var bodyWithSig = _draftState.bodyHtml + SALES_SIGNATURE;

  var h = '<div class="modal-box draft-modal">';
  h += '<div class="draft-moti-badge"><span style="font-size:14px">&#129302;</span> Drafted by Moti AI</div>';
  h += '<h2>Review email for ' + (lead.business_name || 'lead') + '</h2>';
  h += '<div style="font-size:13px;color:var(--muted);margin-bottom:4px">To: ' + lead.email + '</div>';

  // Subject line (editable)
  h += '<div class="draft-label">Subject</div>';
  h += '<input type="text" class="draft-subject" id="draft-subject" value="' + _draftState.subject.replace(/"/g, '&quot;') + '">';

  // Email preview
  h += '<div class="draft-label">Email Preview</div>';
  h += '<div class="draft-preview" id="draft-preview">' + bodyWithSig + '</div>';

  // Edit area (hidden by default)
  h += '<textarea class="draft-edit-area" id="draft-edit-area">' + _draftState.bodyHtml.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</textarea>';

  // Actions
  h += '<div class="modal-actions">';
  h += '<button class="btn-sm btn-teal" onclick="approveDraft()" id="draft-approve-btn">Approve &amp; Send</button>';
  h += '<button class="btn-sm btn-purple" onclick="toggleDraftEdit()" id="draft-edit-btn">Edit HTML</button>';
  h += '<button class="btn-sm btn-blue" onclick="redraftEmail()" id="draft-redraft-btn">Redraft</button>';
  h += '<button class="btn-sm btn-outline" onclick="document.getElementById(\'draftModal\').remove()">Discard</button>';
  h += '</div>';
  h += '</div>';

  overlay.innerHTML = h;
}

function toggleDraftEdit() {
  var preview = document.getElementById('draft-preview');
  var editArea = document.getElementById('draft-edit-area');
  var editBtn = document.getElementById('draft-edit-btn');
  if (!preview || !editArea) return;

  if (_draftState.editing) {
    // Save edits and show preview
    _draftState.bodyHtml = editArea.value;
    preview.innerHTML = _draftState.bodyHtml + SALES_SIGNATURE;
    preview.style.display = '';
    editArea.style.display = 'none';
    editBtn.textContent = 'Edit HTML';
    _draftState.editing = false;
  } else {
    // Show editor
    editArea.value = _draftState.bodyHtml;
    preview.style.display = 'none';
    editArea.style.display = 'block';
    editBtn.textContent = 'Preview';
    _draftState.editing = true;
  }
}

function redraftEmail() {
  var lead = salesData.leads.find(function(l) { return l.id === _draftState.leadId; });
  if (!lead) return;
  document.getElementById('draftModal').remove();
  draftOutreachEmail(_draftState.leadId, _draftState.emailType);
}

function approveDraft() {
  var leadId = _draftState.leadId;
  var emailType = _draftState.emailType;
  var lead = salesData.leads.find(function(l) { return l.id === leadId; });
  if (!lead || !lead.email) return;

  // If editing, save the HTML first
  if (_draftState.editing) {
    var editArea = document.getElementById('draft-edit-area');
    if (editArea) _draftState.bodyHtml = editArea.value;
  }

  // Get subject from the input
  var subjectEl = document.getElementById('draft-subject');
  var subject = subjectEl ? subjectEl.value.trim() : _draftState.subject;
  if (!subject) { alert('Subject cannot be empty'); return; }

  // Append signature to the body
  var fullBody = _draftState.bodyHtml + SALES_SIGNATURE;

  // Disable button
  var btn = document.getElementById('draft-approve-btn');
  if (btn) { btn.textContent = 'Sending...'; btn.disabled = true; }

  // Determine follow-up number
  var followupNum = 0;
  if (emailType === 'followup_1') followupNum = 1;
  else if (emailType === 'followup_2') followupNum = 2;
  else if (emailType === 'followup_3') followupNum = 3;

  // Record in outreach_emails
  sb.from('outreach_emails').insert({
    lead_id: leadId,
    subject: subject,
    body_html: fullBody,
    email_type: emailType,
    status: 'pending',
    followup_number: followupNum
  }).select().then(function(insertRes) {
    if (insertRes.error) {
      alert('Failed to record email: ' + insertRes.error.message);
      if (btn) { btn.textContent = 'Approve & Send'; btn.disabled = false; }
      return;
    }
    var outreachId = insertRes.data[0].id;

    // Send via send-email edge function
    sendAdminEmail(lead.email, subject, 'generic', {message: fullBody});

    // Mark as sent
    sb.from('outreach_emails').update({status: 'sent', sent_at: new Date().toISOString()}).eq('id', outreachId).then(function() {
      // Update lead status if initial pitch
      var newStatus = (emailType === 'initial') ? 'contacted' : lead.status;
      if (newStatus !== lead.status) {
        sb.from('leads').update({status: newStatus, updated_at: new Date().toISOString()}).eq('id', leadId).then(function() {
          var localLead = salesData.leads.find(function(l) { return l.id === leadId; });
          if (localLead) localLead.status = newStatus;
          finishDraftSend(outreachId, leadId, subject, emailType, followupNum, lead.email);
        });
      } else {
        finishDraftSend(outreachId, leadId, subject, emailType, followupNum, lead.email);
      }
    });
  });
}

function finishDraftSend(outreachId, leadId, subject, emailType, followupNum, toEmail) {
  salesData.outreach.push({id: outreachId, lead_id: leadId, subject: subject, email_type: emailType, status: 'sent', sent_at: new Date().toISOString(), followup_number: followupNum, created_at: new Date().toISOString()});
  var modal = document.getElementById('draftModal');
  if (modal) modal.remove();
  renderPage();
  alert('Email sent to ' + toEmail);
}
