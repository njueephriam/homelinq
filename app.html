  <style>
    :root{--bg:#F8FAFC;--bg2:#F1F5F9;--card:#FFFFFF;--border:#E2E8F0;--text:#0F172A;--text2:#334155;--muted:#64748B;--primary:#0D9488;--primary-light:#CCFBF1;--primary-dark:#0F766E;--success:#10B981;--success-light:#D1FAE5;--warning:#FFB800;--warning-light:#FFF8E1;--danger:#EF4444;--danger-light:#FEE2E2;--blue:#3B82F6;--blue-light:#DBEAFE;--purple:#8B5CF6;--purple-light:#EDE9FE;--sidebar-w:260px;--radius:12px;--radius-lg:16px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.08)}

    .btn-success{background:var(--success);color:#fff}.btn-danger{background:var(--danger);color:#fff}.btn-sm{padding:6px 12px;font-size:13px}.btn-lg{padding:14px 24px;font-size:16px}.btn-block{width:100%;justify-content:center}
    .badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}.badge-success{background:var(--success-light);color:#065F46}.badge-warning{background:var(--warning-light);color:#92400E}.badge-danger{background:var(--danger-light);color:#991B1B}.badge-blue{background:var(--blue-light);color:#1E40AF}.badge-purple{background:var(--purple-light);color:#5B21B6}.badge-neutral{background:var(--bg2);color:var(--muted)}

    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 20px rgba(239,68,68,0)}}@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

    .parsed-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.parsed-item{padding:14px;background:var(--bg);border-radius:var(--radius)}.parsed-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}.parsed-value{font-size:16px;font-weight:700;margin-top:4px}
    .avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;flex-shrink:0}.avatar-teal{background:var(--primary)}.avatar-blue{background:var(--blue)}.avatar-warning{background:var(--warning)}.avatar-danger{background:var(--danger)}.avatar-purple{background:var(--purple)}.avatar-success{background:var(--success)}
    .list-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}.list-item:hover{background:var(--bg)}.list-item:last-child{border-bottom:none}.list-item-info{flex:1}.list-item-title{font-weight:700;font-size:14px}.list-item-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .timeline-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}.timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0}.timeline-date{font-size:12px;color:var(--muted)}.timeline-text{font-size:14px;margin-top:2px}

    .login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0F766E,#0D9488,#14B8A6);padding:24px}.login-card{background:#fff;border-radius:20px;padding:40px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.15)}.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center}
    .quick-action{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:var(--radius-lg);cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--card)}.quick-action:hover{border-color:var(--primary);background:var(--primary-light)}.qa-icon{font-size:26px}.qa-label{font-size:12px;font-weight:700;color:var(--text2);text-align:center}
    .invoice-preview{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:600px}.invoice-header-row{display:flex;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--text)}.invoice-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}.invoice-total{display:flex;justify-content:space-between;padding:12px 0;border-top:2px solid var(--text);margin-top:8px;font-weight:800;font-size:18px}

    .search-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}.search-bar input{border:none;background:none;outline:none;flex:1;font-family:inherit;font-size:14px;color:var(--text)}
    .back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:700;font-size:14px;cursor:pointer;border:none;background:none;padding:0;margin-bottom:16px}.back-btn:hover{color:var(--primary-dark)}
    .toast{position:fixed;top:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;box-shadow:var(--shadow-md);z-index:100;display:none;font-weight:600;font-size:14px;max-width:360px}.toast.show{display:flex;align-items:center;gap:10px;animation:slideIn .3s ease}.toast.success{border-left:4px solid var(--success)}.toast.error{border-left:4px solid var(--danger)}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
    .flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}.text-muted{color:var(--muted)}.text-sm{font-size:13px}.text-lg{font-size:18px}.fw-700{font-weight:700}.fw-800{font-weight:800}.text-center{text-align:center}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    /* Job sheet */
    .job-slot{display:flex;gap:14px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;background:var(--card);transition:all .15s}.job-slot:hover{box-shadow:var(--shadow-md)}
    .job-time{font-size:13px;font-weight:800;color:var(--primary);min-width:50px;padding-top:2px}.job-slot-info{flex:1}.job-slot-title{font-weight:700;font-size:15px}.job-slot-sub{font-size:13px;color:var(--muted);margin-top:2px}
    .job-slot.completed{opacity:.7;border-left:3px solid var(--success)}.job-slot.in_progress{border-left:3px solid var(--warning)}.job-slot.upcoming{border-left:3px solid var(--blue)}
    /* Progress bar */
    .progress-bar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;border-radius:4px;transition:width .3s}
    /* Tax gauge */
    .tax-card{text-align:center;padding:24px}.tax-amount{font-size:42px;font-weight:900;margin:8px 0}.tax-sub{font-size:13px;color:var(--muted)}
    .breakdown-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}.breakdown-row:last-child{border-bottom:none}.breakdown-row.total{font-weight:800;font-size:16px;border-top:2px solid var(--text);margin-top:4px;padding-top:14px}
    /* Cascade overlay */
    .cascade-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s}
    .sig-pad-canvas{border:2px solid #e5e7eb;border-radius:12px;background:#fff;cursor:crosshair;touch-action:none;width:100%;max-width:500px;height:180px}
    .cascade-panel{background:var(--card);border-radius:20px;padding:32px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
    .cascade-step{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);opacity:0;animation:cascadeIn .4s forwards}
    .cascade-step:last-child{border-bottom:none}
    .cascade-check{width:28px;height:28px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex-shrink:0}
    .cascade-step-info{flex:1}.cascade-step-title{font-weight:700;font-size:14px}.cascade-step-sub{font-size:12px;color:var(--muted);margin-top:2px}

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(60px)}}
    /* Add to home banner */
    .home-banner{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px 20px;border-radius:var(--radius-lg);margin-bottom:20px;display:flex;align-items:center;gap:14px}
    .home-banner-icon{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:24px;flex-shrink:0}
    .home-banner-info{flex:1}.home-banner-title{font-weight:800;font-size:15px}.home-banner-sub{font-size:12px;opacity:.85;margin-top:4px;line-height:1.5}
    .home-banner .btn{background:rgba(255,255,255,.95);color:var(--primary-dark);flex-shrink:0}
    /* Job expenses panel */
    .job-expenses{margin-top:12px;padding:12px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border)}
    .job-expenses-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .job-expenses-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

    .exp-desc{flex:1;font-weight:600}.exp-amt{font-weight:800;min-width:60px;text-align:right}
    .exp-billable{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}

    .exp-receipt-btn.has-receipt{border-style:solid;border-color:var(--success);color:var(--success);background:var(--success-light)}
    .exp-add-row{display:flex;gap:6px;margin-top:8px}.exp-add-row input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit}.exp-add-row input.exp-amt-input{max-width:80px}
    .exp-add-row button{padding:6px 10px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
    .exp-summary{display:flex;gap:16px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px}
    .exp-summary-item{display:flex;align-items:center;gap:4px}.exp-summary-label{color:var(--muted)}.exp-summary-val{font-weight:800}
    /* General expense modal */
    .gen-exp-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s}
    .gen-exp-panel{background:var(--card);border-radius:20px;padding:32px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}

    .company-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--purple-light);color:#5B21B6}
    .direct-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--blue-light);color:#1E40AF}
    /* Calendar grid */
    .cal-wrap{margin-bottom:20px}
    .cal-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-radius:var(--radius-lg);cursor:pointer;border:1px solid var(--border);margin-bottom:8px;transition:all .15s}
    .cal-toggle:hover{border-color:var(--primary)}
    .cal-toggle-left{display:flex;align-items:center;gap:10px}
    .cal-toggle-date{font-weight:800;font-size:15px;color:var(--text)}
    .cal-toggle-info{font-size:12px;color:var(--muted)}
    .cal-toggle-arrow{font-size:12px;color:var(--muted);transition:transform .2s}.cal-toggle-arrow.open{transform:rotate(180deg)}
    .cal-body{overflow:hidden;transition:max-height .3s ease}
    .cal-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-bottom:8px}
    .cal-nav-arrows{display:flex;gap:4px}
    .cal-nav-btn{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
    .cal-nav-btn:hover{background:var(--primary-light);border-color:var(--primary)}
    .cal-nav-btn:disabled{opacity:.3;cursor:default}
    .cal-nav-center{display:flex;gap:6px;align-items:center}
    .cal-nav-select{padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
    .cal-nav-today{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--primary);background:var(--primary-light);color:var(--primary-dark);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
    .cal-nav-today:hover{background:var(--primary);color:#fff}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
    .cal-hdr{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:6px 0;text-transform:uppercase}
    .cal-cell{min-height:48px;padding:4px;border-radius:var(--radius);text-align:center;cursor:pointer;border:2px solid transparent;transition:all .15s;background:var(--card);position:relative}
    .cal-cell:hover{border-color:var(--primary-light);background:var(--primary-light)}
    .cal-cell.active{border-color:var(--primary);background:var(--primary-light)}
    .cal-cell.today{border-color:var(--warning)}
    .cal-cell.has-jobs::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary);position:absolute;bottom:4px;left:50%;transform:translateX(-50%)}
    .cal-cell.other-month{opacity:.35}
    .cal-cell.past-day{background:var(--bg)}
    .cal-cell-num{font-size:14px;font-weight:800;margin-top:2px}
    .cal-cell-info{font-size:8px;color:var(--muted);margin-top:1px;line-height:1.2;white-space:nowrap;overflow:hidden}
    .cal-cell-info.has-data{color:var(--primary-dark);font-weight:700}
    /* Collapsible */
    .collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:14px 0;user-select:none}
    .collapse-arrow{transition:transform .2s;font-size:14px}.collapse-arrow.open{transform:rotate(180deg)}
    .collapse-body{overflow:hidden;transition:max-height .3s ease}
    /* Send invoice btn */
    .send-inv-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:var(--success);color:#fff;font-weight:700;font-size:12px;cursor:pointer;margin-top:6px;transition:all .15s;font-family:inherit}.send-inv-btn:hover{background:#059669}
    /* Marketplace notifications */
    .notif-card{padding:16px;border:2px solid var(--warning);border-radius:var(--radius-lg);background:var(--warning-light);margin-bottom:12px;animation:notifPulse 2s ease-in-out 1}
    .notif-card.urgent{border-color:var(--danger);background:var(--danger-light)}
    .notif-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .notif-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;background:var(--warning);color:#fff}
    .notif-badge.urgent{background:var(--danger)}
    .notif-badge.direct{background:linear-gradient(135deg,#FFB800,#F59E0B);color:#000;font-size:12px;padding:5px 12px;box-shadow:0 2px 8px rgba(255,184,0,.3)}
    .notif-time{font-size:11px;color:var(--muted)}
    .notif-body{display:flex;gap:14px;align-items:flex-start}
    .notif-avatar{width:44px;height:44px;border-radius:50%;background:var(--warning);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
    .notif-info{flex:1}.notif-title{font-weight:800;font-size:15px;margin-bottom:4px}.notif-desc{font-size:13px;color:var(--text2);line-height:1.5}
    .notif-details{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .notif-detail{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:rgba(255,255,255,.7);border-radius:6px;font-size:12px;font-weight:600}
    .notif-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}
    .notif-count{position:relative}.notif-count-badge{position:absolute;top:-6px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
    @keyframes notifPulse{0%{transform:scale(1)}10%{transform:scale(1.01)}20%{transform:scale(1)}30%{transform:scale(1.01)}40%{transform:scale(1)}}
    /* HMRC category picker */
    .exp-cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
    .exp-cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:var(--radius);border:2px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;text-align:center}
    .exp-cat-btn:hover{border-color:var(--primary);background:var(--primary-light)}
    .exp-cat-btn.selected{border-color:var(--primary);background:var(--primary-light);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
    .exp-cat-icon{font-size:22px}.exp-cat-label{font-size:11px;font-weight:700;color:var(--text)}.exp-cat-sa103{font-size:9px;color:var(--muted);line-height:1.3}
    /* Daily notepad */
    .notepad{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
    .notepad-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
    .note-item{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}.note-item:last-child{border-bottom:none}
    .note-pin{cursor:pointer;font-size:16px;flex-shrink:0;margin-top:2px}.note-text{flex:1;font-size:13px;line-height:1.5}.note-time{font-size:11px;color:var(--muted);flex-shrink:0}
    .note-actions{display:flex;gap:6px;flex-shrink:0}.note-del{width:24px;height:24px;border-radius:6px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:12px;display:grid;place-items:center}.note-del:hover{background:var(--danger-light);color:var(--danger)}
    .notepad-input{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}.notepad-input input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit}
    .notepad-input button{padding:8px 14px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
    /* Date reminder banner */
    .date-reminder-banner{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--warning-light);border:1px solid var(--warning);border-radius:var(--radius);margin-bottom:12px;animation:notifPulse 2s ease-in-out 1}
    .date-reminder-banner.deadline{background:var(--danger-light);border-color:var(--danger)}
    .date-reminder-banner.tax{background:var(--purple-light);border-color:var(--purple)}
    /* SA103 form */
    .sa103-box{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}.sa103-box:last-child{border-bottom:none}
    .sa103-box-num{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;min-width:60px}
    .sa103-box-label{flex:1;font-size:13px;font-weight:600}.sa103-box-val{font-size:15px;font-weight:800;min-width:80px;text-align:right}
    /* Invoice payment tracking */
    .inv-filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .inv-filter{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;font-weight:700;transition:all .15s}
    .inv-filter:hover{border-color:var(--primary)}.inv-filter.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .chase-timeline{display:flex;flex-direction:column;gap:0;margin-top:12px}
    .chase-step{display:flex;align-items:flex-start;gap:10px;padding:10px 0;position:relative}
    .chase-step::before{content:'';position:absolute;left:11px;top:32px;bottom:-2px;width:2px;background:var(--border)}
    .chase-step:last-child::before{display:none}
    .chase-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex-shrink:0;font-weight:800;z-index:1}
    .chase-dot.sent{background:var(--warning-light);color:#92400E;border:2px solid var(--warning)}
    .chase-dot.pending{background:var(--bg2);color:var(--muted);border:2px solid var(--border)}
    .chase-dot.paid{background:var(--success-light);color:#065F46;border:2px solid var(--success)}
    .pay-link-box{display:flex;align-items:center;gap:12px;padding:16px;background:linear-gradient(135deg,#EEF2FF,#E0E7FF);border:2px solid #818CF8;border-radius:var(--radius-lg);margin-top:16px}
    .pay-link-url{flex:1;padding:10px 14px;background:#fff;border-radius:8px;font-size:12px;font-weight:600;color:var(--text2);border:1px solid var(--border);word-break:break-all}
    .payment-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700}
    .payment-badge.paid{background:var(--success-light);color:#065F46}.payment-badge.unpaid{background:var(--warning-light);color:#92400E}.payment-badge.overdue{background:var(--danger-light);color:#991B1B}
    .bank-connect-card{padding:24px;background:linear-gradient(135deg,#F0FDF4,#DCFCE7);border:2px solid var(--success);border-radius:var(--radius-lg);text-align:center}
    /* Photo thumbnails */
    .photo-strip{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .photo-thumb{width:56px;height:56px;border-radius:8px;background:var(--bg2);border:2px solid var(--border);cursor:pointer;overflow:hidden;display:grid;place-items:center;transition:all .15s;position:relative}
    .photo-thumb:hover{border-color:var(--primary);transform:scale(1.05)}
    .photo-thumb img{width:100%;height:100%;object-fit:cover}
    .photo-thumb-placeholder{font-size:20px}
    .photo-count{position:absolute;bottom:0;right:0;background:rgba(0,0,0,.7);color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px 0 0 0}
    /* Photo lightbox */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s}
    .lightbox-inner{max-width:700px;width:100%;text-align:center}
    .lightbox-img{max-width:100%;max-height:70vh;border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .lightbox-caption{color:#fff;font-size:14px;margin-top:12px;font-weight:600}
    .lightbox-nav{display:flex;justify-content:center;gap:12px;margin-top:16px}
    .lightbox-close{position:absolute;top:20px;right:24px;color:#fff;font-size:32px;cursor:pointer;background:none;border:none;font-weight:800;opacity:.7;transition:opacity .15s}.lightbox-close:hover{opacity:1}
    /* Emergency price */
    .price-tag{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);font-weight:900;font-size:18px}
    .price-tag.standard{background:var(--success-light);color:#065F46;border:1px solid rgba(16,185,129,.3)}
    .price-tag.emergency{background:var(--danger-light);color:#991B1B;border:1px solid rgba(239,68,68,.3)}
    .price-tag.custom{background:var(--warning-light);color:#92400E;border:1px solid rgba(255,184,0,.3)}
    .price-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    /* Message inbox */
    .msg-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}.msg-item:hover{background:var(--bg)}.msg-item:last-child{border-bottom:none}
    .msg-item.unread{background:var(--blue-light)}
    .msg-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;margin-top:6px}
    .msg-dot.read{background:transparent}
    .msg-preview{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .msg-time{font-size:11px;color:var(--muted);white-space:nowrap}
    .msg-unread-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;padding:0 6px}
    .chat-bubble{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5;margin-bottom:8px}
    .chat-bubble.them{background:var(--bg2);border-bottom-left-radius:4px;align-self:flex-start}
    .chat-bubble.me{background:var(--primary);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
    .chat-time{font-size:10px;color:var(--muted);margin-top:2px}
    .chat-photos{display:flex;gap:6px;margin-top:8px}.chat-photos img{width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--border)}
    /* Availability picker */
    .avail-grid{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin:16px 0}
    .avail-day{min-width:120px;padding:14px 12px;border-radius:var(--radius);border:2px solid var(--border);cursor:pointer;transition:all .15s;flex-shrink:0;text-align:center;background:var(--card)}
    .avail-day:hover{border-color:var(--primary);background:var(--primary-light)}
    .avail-day.selected{border-color:var(--primary);background:var(--primary-light);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
    .avail-day.green{border-left:4px solid var(--success)}.avail-day.amber{border-left:4px solid var(--warning)}.avail-day.red{border-left:4px solid var(--danger)}
    .avail-day-name{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted)}.avail-day-date{font-size:16px;font-weight:900;margin-top:2px}
    .avail-day-jobs{font-size:12px;color:var(--text2);margin-top:6px;font-weight:600}.avail-day-hours{font-size:11px;color:var(--muted);margin-top:2px}
    .avail-day-status{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;margin-top:6px}
    .avail-day-status.green{background:var(--success-light);color:#065F46}.avail-day-status.amber{background:var(--warning-light);color:#92400E}.avail-day-status.red{background:var(--danger-light);color:#991B1B}
    .slot-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
    .slot-btn{padding:8px 16px;border-radius:8px;border:2px solid var(--border);background:var(--card);cursor:pointer;font-weight:700;font-size:13px;transition:all .15s;font-family:inherit;color:var(--text)}
    .slot-btn:hover{border-color:var(--primary);background:var(--primary-light)}
    .slot-btn.selected{border-color:var(--primary);background:var(--primary);color:#fff}
    .slot-btn.taken{opacity:.4;cursor:not-allowed;text-decoration:line-through}
    .notif-sent{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--success-light);border-radius:var(--radius);margin-top:8px;font-size:13px;font-weight:600;color:#065F46}
    /* Customer picker */
    .cust-picker{position:relative}.cust-picker-input{padding-right:36px !important}
    .cust-picker-list{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow-md);z-index:30;max-height:240px;overflow-y:auto;display:none}
    .cust-picker-list.open{display:block}
    .cust-pick-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border)}.cust-pick-item:last-child{border-bottom:none}
    .cust-pick-item:hover{background:var(--primary-light)}
    .cust-pick-item .avatar{width:32px;height:32px;font-size:12px}
    .cust-pick-info{flex:1}.cust-pick-name{font-weight:700;font-size:13px}.cust-pick-sub{font-size:11px;color:var(--muted)}
    .cust-pick-item.new-entry{border-top:2px solid var(--border);color:var(--primary);font-weight:700;justify-content:center;gap:6px}
    .autofill-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--success);padding:2px 6px;background:var(--success-light);border-radius:4px;margin-left:6px}
    .type-toggle{display:flex;gap:0;border:2px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .type-toggle-btn{flex:1;padding:12px 16px;text-align:center;cursor:pointer;font-weight:700;font-size:14px;border:none;background:var(--card);color:var(--text2);transition:all .15s;font-family:inherit}
    .type-toggle-btn.active{background:var(--primary);color:#fff}
    .type-toggle-btn:first-child{border-right:1px solid var(--border)}
    /* ===== CUSTOMER SIDE CSS — Light Theme Redesign ===== */
    .cust-app{background:#F8F9FA;min-height:100vh;color:#1A1A1A;position:relative}
    .cust-app *{color:inherit}
    .cust-app .card{background:#fff;border:1px solid #e5e7eb;color:#1A1A1A}
    .cust-app .input,.cust-app .textarea,.cust-app .select{background:#fff;border:1px solid #e5e7eb;color:#1A1A1A}
    .cust-app .input::placeholder,.cust-app .textarea::placeholder{color:#9ca3af}
    .cust-app .label{color:#6b7280}
    .cust-topbar{position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb;padding:12px 16px;z-index:50;display:flex;align-items:center;justify-content:space-between}
    .cust-topbar-brand{display:flex;align-items:center;gap:8px}
    .cust-topbar-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#FFB800,#E5A600);display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff}
    .cust-topbar-name{font-weight:800;font-size:16px;color:#1A1A1A}
    .cust-topbar-sub{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#9ca3af}
    .cust-topbar-actions{display:flex;align-items:center;gap:12px}
    .cust-topbar-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FFB800,#E5A600);display:grid;place-items:center;font-size:12px;font-weight:800;cursor:pointer;border:2px solid #e5e7eb;color:#fff}
    .cust-topbar-bell{position:relative;font-size:20px;cursor:pointer;color:#6b7280}.cust-topbar-bell-count{position:absolute;top:-4px;right:-6px;width:16px;height:16px;border-radius:50%;background:#EF4444;font-size:9px;display:grid;place-items:center;font-weight:800;color:#fff}
    .cust-bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid #e5e7eb;padding:8px 12px env(safe-area-inset-bottom);z-index:50}
    .cust-bottom-nav-inner{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
    .cust-bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;border:none;background:none;cursor:pointer;font-size:9px;color:#9ca3af;font-weight:600;font-family:inherit;transition:all .15s}
    .cust-bnav-item.active{color:#FFB800;background:#FFF8E1}
    .cust-bnav-icon{font-size:20px}
    .cust-hero{background:linear-gradient(135deg,#1A1A1A,#2d2d44);padding:24px 20px;border-radius:var(--radius-lg);margin-bottom:20px;position:relative;overflow:hidden}
    .cust-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,184,0,.12)}
    .cust-hero-title{font-size:22px;font-weight:900;color:#fff;position:relative;z-index:1}
    .cust-hero-sub{font-size:13px;color:rgba(255,255,255,.65);margin-top:4px;position:relative;z-index:1}
    .cust-hero-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px 16px;margin-top:16px;position:relative;z-index:1}
    .cust-hero-search input{border:none;background:none;outline:none;flex:1;font-family:inherit;font-size:14px;color:#fff}
    .cust-hero-search input::placeholder{color:rgba(255,255,255,.45)}
    .cust-service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
    .cust-service-card{padding:18px 10px;border:1px solid #e5e7eb;border-radius:16px;background:#fff;text-align:center;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .cust-service-card:hover,.cust-service-card.selected{border-color:#FFB800;background:#FFF8E1;transform:translateY(-2px)}
    .cust-service-icon{font-size:32px}
    .cust-service-label{font-weight:700;font-size:12px;color:#1A1A1A}
    .cust-engineer-card{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #e5e7eb;border-radius:16px;background:#fff;margin-bottom:10px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .cust-engineer-card:hover{background:#FFF8E1;border-color:#FFB800}
    .cust-engineer-avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0;border:2px solid #e5e7eb}
    .cust-engineer-info{flex:1}
    .cust-engineer-name{font-weight:700;font-size:14px;color:#1A1A1A}
    .cust-engineer-meta{font-size:12px;color:#6b7280;margin-top:2px}

// Timezone-safe date key: returns YYYY-MM-DD in LOCAL time (not UTC)
// toISOString() returns UTC which shifts dates in BST/CET etc.
function localDateKey(dt){
  var y=dt.getFullYear();
  var m=String(dt.getMonth()+1);if(m.length<2)m='0'+m;
  var d=String(dt.getDate());if(d.length<2)d='0'+d;
  return y+'-'+m+'-'+d;
}

function doLogin(role) {
  var emailEl = document.querySelector('#auth-email');
  var passEl = document.querySelector('#auth-pass');
  if (!emailEl || !passEl) { toast('error', 'Please fill in email and password'); return; }
  var email = emailEl.value.trim();
  var pass = passEl.value;
  if (!email || !pass) { toast('error', 'Please fill in email and password'); return; }
  showLoading('Signing in...');
  sb.auth.signInWithPassword({ email: email, password: pass }).then(function(res) {
    if (res.error) { isLoading = false; render(); toast('error', res.error.message); return; }
    currentUser = res.data.user;
    loadUserProfile(role);
  });
}

function doSignup(role) {
  var emailEl = document.querySelector('#auth-email');
  var passEl = document.querySelector('#auth-pass');
  var nameEl = document.querySelector('#auth-name');
  if (!emailEl || !passEl) { toast('error', 'Please fill in all fields'); return; }
  var email = emailEl.value.trim();
  var pass = passEl.value;
  var name = nameEl ? nameEl.value.trim() : '';
  // Capture form values BEFORE showLoading destroys the DOM
  var phone = document.querySelector('#auth-phone') ? document.querySelector('#auth-phone').value.trim() : '';

  var business = document.querySelector('#auth-business') ? document.querySelector('#auth-business').value.trim() : '';

  if (pass.length < 6) { toast('error', 'Password must be at least 6 characters'); return; }
  showLoading('Creating account...');
  sb.auth.signUp({ email: email, password: pass, options: { data: { full_name: name, role: role }, emailRedirectTo: 'https://homelinq.co.uk/app.html' } }).then(function(res) {
    if (res.error) { isLoading = false; render(); toast('error', res.error.message); return; }
    currentUser = res.data.user;

    var profileData = { id: res.data.user.id, email: email, full_name: name, role: role };

      if (pRes.error) { console.log('Profile error:', pRes.error.message); }

    if (S.role === 'engineer') {
      // Store minimal offline data — strip PII (emails, phones, full addresses)
      data.customers = customers.map(function(c){return{id:c.id,name:c.name,ini:c.ini,boiler:c.boiler,last:c.last,next:c.next,jobs:c.jobs,spent:c.spent,c:c.c,isCompany:c.isCompany}});
      data.invoices = invoices.map(function(inv){return{id:inv.id,cust:inv.cust,date:inv.date,amt:inv.amt,st:inv.st,desc:inv.desc,jobNum:inv.jobNum}});
      data.allJobs = allJobs;
      data.generalExpenses = generalExpenses;
      data.mileageLog = mileageLog;
      data.engineerQuotes = engineerQuotes;
    } else {
      // Customer offline — store job statuses without engineer PII
      data.custMyJobs = custMyJobs.map(function(j){return{id:j.id,type:j.type,status:j.status,posted:j.posted,price:j.price,priority:j.priority,scheduledDate:j.scheduledDate,scheduledTime:j.scheduledTime,timeline:j.timeline}});
      data.custInvoices = custInvoices;
      data.boilerPassports = boilerPassports;
      data.custCerts = custCerts;
      data.custQuotes = custQuotes;
    }
    localStorage.setItem(key, JSON.stringify(data));
  } catch (e) { console.log('Offline cache save error:', e); }
}

function scheduleOfflineSave() {
  if (_offlineSaveTimer) clearTimeout(_offlineSaveTimer);
  _offlineSaveTimer = setTimeout(saveOfflineCache, 3000);
}

function loadOfflineCache() {
  if (!currentUser) return false;
  try {
    var key = 'hlq_offline_' + currentUser.id;
    var raw = localStorage.getItem(key);
    if (!raw) return false;
    var data = JSON.parse(raw);
    if (!data || !data.role) return false;

    S.role = data.role;
    if (data.engineer) S.engineer = data.engineer;
    if (data.custUser) S.custUser = data.custUser;

    if (data.role === 'engineer') {
      if (data.allJobs) allJobs = data.allJobs;
      if (data.invoices) invoices = data.invoices;
      if (data.customers) customers = data.customers;
      if (data.generalExpenses) generalExpenses = data.generalExpenses;
      if (data.mileageLog) mileageLog = data.mileageLog;
      if (data.engineerQuotes) engineerQuotes = data.engineerQuotes;
      S.screen = 'jobsheet';
    } else {
      if (data.custMyJobs) custMyJobs = data.custMyJobs;
      if (data.custInvoices) custInvoices = data.custInvoices;
      if (data.boilerPassports) boilerPassports = data.boilerPassports;
      if (data.custCerts) custCerts = data.custCerts;
      if (data.custQuotes) custQuotes = data.custQuotes;
      S.screen = 'custHome';
    }
    return true;
  } catch (e) { console.log('Offline cache load error:', e); return false; }
}

function showOfflineBanner() {
  if (document.getElementById('offline-banner')) return;
  var b = document.createElement('div');
  b.id = 'offline-banner';
  b.textContent = "You're offline — viewing cached data";
  document.body.appendChild(b);
}

function hideOfflineBanner() {
  var b = document.getElementById('offline-banner');
  if (b) b.parentNode.removeChild(b);
}

window.addEventListener('online', function() {
  hideOfflineBanner();
  if (currentUser && S.role === 'engineer') { loadEngineerData(); }
  else if (currentUser && S.role === 'customer') { loadCustomerData(); }
});

window.addEventListener('offline', function() {
  showOfflineBanner();
});

function loadEngineerData() {
  if (!currentUser) return;
  // Load shared certificate lookups (makes, models, types, locations, flue types)
  loadCertLookups();
  // Load jobs
  sb.from('jobs').select('*').eq('engineer_id', currentUser.id).then(function(res) {
    if(res.error){console.log('Load jobs error:',res.error.message);return}
    if (res.data && res.data.length > 0) {
      allJobs = {};
      res.data.forEach(function(j) {
        var dateKey = j.scheduled_date;
        if (!allJobs[dateKey]) allJobs[dateKey] = [];
        var loadedJob={
          id: j.id, jobNum: j.job_number || ('GL-' + j.id), time: j.scheduled_time || '09:00', timeTo: j.time_to || '',
          cust: j.customer_name || 'Unknown', custEmail: j.customer_email || '',
          custPhone: j.customer_phone || '',
          addr: j.address || '', postcode: j.postcode || '', houseNumber: j.house_number || '',
          job: j.description || '', dur: j.estimated_duration || '1hr',
          amt: j.price || 0, st: j.status || 'upcoming', mi: j.miles || 0,
          type: j.source || 'direct', company: j.company_name || null, compRef: j.company_ref || '',
          expenses: [],
          parts: j.parts ? (typeof j.parts === 'string' ? JSON.parse(j.parts) : j.parts) : [],
          fromMarketplace: j.from_marketplace || false,
          _marketplaceId: j.marketplace_job_id || null,
          _marketCustId: j.customer_id || null,
          ecid: j.engineer_customer_id || null
        };
        // Restore marketplace-specific fields
        if(loadedJob.fromMarketplace&&loadedJob._marketplaceId){
          loadedJob.calloutFee=loadedJob.amt;
          loadedJob.calloutPaid=true;
          loadedJob.platformFee=15;
          loadedJob.engineerShare=loadedJob.amt-15;
          loadedJob.escrowStatus=loadedJob.st==='completed'?'released':'held';
        }
        // If postcode/houseNumber missing on marketplace job, fill from customer profile
        if((!loadedJob.postcode||!loadedJob.houseNumber)&&loadedJob._marketCustId){
          (function(job,custId){
            sb.from('customers').select('postcode,house_number').eq('id',custId).single().then(function(cRes){
              if(cRes.data){
                if(!job.postcode&&cRes.data.postcode)job.postcode=cRes.data.postcode;
                if(!job.houseNumber&&cRes.data.house_number)job.houseNumber=cRes.data.house_number;
              }
            });
          })(loadedJob,loadedJob._marketCustId);
        }
        allJobs[dateKey].push(loadedJob);
      });
      // Job numbers continue from the highest saved GL- number (prevents overwriting an existing job)
      var _maxGL=0;
      Object.keys(allJobs).forEach(function(d){allJobs[d].forEach(function(x){var mm=/^GL-(\d+)/.exec(String(x.jobNum||''));if(mm){var nn=parseInt(mm[1],10);if(nn>_maxGL)_maxGL=nn}})});
      if(_maxGL>=glJobNum)glJobNum=_maxGL+1;
      render();
      loadJobExpenses();
    }
    // Always try to recover unsynced jobs from offline cache
    _mergeOfflineJobs();
  });
  // Load invoices
  sb.from('invoices').select('*').eq('engineer_id', currentUser.id).then(function(res) {
    if(res.error){console.log('Load invoices error:',res.error.message);return}
    if (res.data && res.data.length > 0) {
      invoices = res.data.map(function(inv) {
        return {
          id: inv.invoice_number || inv.id, cust: inv.customer_name || '', custEmail: inv.customer_email || '',
          custId: inv.customer_id || null,
          date: inv.sent_date || '', amt: inv.amount || 0, st: inv.status || 'unpaid',
          desc: inv.description || '', vat: inv.vat || 0, vatInclusive: (inv.vat || 0) > 0,
          jobNum: inv.job_number || null,
          paidDate: inv.paid_date || null, paidMethod: inv.paid_method || null,
          paidRef: inv.paid_reference || null, chaseCount: inv.chase_count || 0,
          sentDate: inv.sent_date || '', dueDate: inv.due_date || '', payLink: true,
          items: Array.isArray(inv.items) ? inv.items : [], vatRate: (inv.vat_rate===null||inv.vat_rate===undefined)?null:Number(inv.vat_rate),
          ecid: inv.engineer_customer_id || null,
          addr: (inv.meta&&inv.meta.addr)||'', custPhone: (inv.meta&&inv.meta.custPhone)||'',
          type: (inv.meta&&inv.meta.type)||undefined, company: (inv.meta&&inv.meta.company)||undefined, compRef: (inv.meta&&inv.meta.compRef)||undefined,
          vatNumber: (inv.meta&&inv.meta.vatNumber)||'',
          _supaId: inv.id
        };
      });
      // Cross-reference customers with loaded invoices
      syncCustomerInvoices();
      // Derive nextInvNum from highest existing invoice number to prevent collisions
      var maxNum=0;
      for(var ni=0;ni<invoices.length;ni++){
        var invNumStr=String(invoices[ni].id||'').replace(/[^0-9]/g,'');
        var parsed=parseInt(invNumStr,10);
        if(!isNaN(parsed)&&parsed>maxNum)maxNum=parsed;
      }
      if(maxNum>=nextInvNum)nextInvNum=maxNum+1;
      console.log('nextInvNum set to',nextInvNum,'(from',invoices.length,'loaded invoices)');
      render();
    }
  });
  // Load customers list — ONLY this engineer's own customer records (privacy: engineer_customers + RLS)
  loadEngineerCustomers();
  // Load service reminders
  loadRemindersFromSupabase();
  // Load new marketplace jobs for the feed
  sb.from('marketplace_jobs').select('*').eq('status', 'new').then(function(res) {
    if(res.error){console.log('Load marketplace jobs error:',res.error.message);return}
    if (res.data && res.data.length > 0) {
      var now=new Date().toISOString();
      marketplaceJobs = res.data.filter(function(mj) {
        // MARKETPLACE VISIBILITY FILTER:
        // If job has a preferred engineer that is NOT me:
        if(mj.preferred_engineer_id && mj.preferred_engineer_id !== currentUser.id) {
          if(!mj.priority_expires_at) {
            // DIRECT ASSIGNMENT to another engineer — never show to others
            console.log('Hidden job',mj.id,'— directly assigned to',mj.preferred_engineer_name||'another engineer');
            return false;
          }
          if(mj.priority_expires_at > now) {
            // PRIORITY WINDOW still active for another engineer — hide until expired
            console.log('Hidden job',mj.id,'— priority for',mj.preferred_engineer_name,'until',mj.priority_expires_at);
            return false;
          }
          // Priority window EXPIRED — job is now open to all engineers
          console.log('Showing job',mj.id,'— priority expired, now open to all');
        }
        return true;
      }).map(function(mj) {
        var priorityMins=0;
        if(mj.preferred_engineer_id===currentUser.id&&mj.priority_expires_at){
          var diff=new Date(mj.priority_expires_at).getTime()-Date.now();
          if(diff>0)priorityMins=Math.ceil(diff/60000);
        }
        return {
          id: mj.id, cust: mj.customer_name || '', custEmail: mj.customer_email || '',
          phone: mj.customer_phone || '', addr: mj.address || '',
          postcode: mj.postcode || '', houseNumber: mj.house_number || '',
          job: mj.description || '', urgent: mj.is_emergency || false,
          posted: mj.created_at || '', price: mj.price || CALLOUT_STANDARD,
          priceType: mj.is_emergency ? 'emergency' : 'standard',
          boiler: mj.boiler_info || '', dist: mj.distance || 0, status: 'new',
          photos: [], note: mj.note || mj.notes || '', _custId: mj.customer_id || null,
          preferredSlots: mj.preferred_slots || [],
          preferredEngineerId: mj.preferred_engineer_id || null,
          preferredEngineerName: mj.preferred_engineer_name || null,
          priorityMinsLeft: priorityMins
        };
      });
      // Sort: direct/priority requests for this engineer first, then by date
      marketplaceJobs.sort(function(a, b) {
        var aIsDirect = a.preferredEngineerId === currentUser.id;
        var bIsDirect = b.preferredEngineerId === currentUser.id;
        if(aIsDirect && !bIsDirect) return -1;
        if(!aIsDirect && bIsDirect) return 1;
        return 0;
      });
      render();
    }
  });
  // Load MY accepted marketplace jobs → put on job sheet calendar
  sb.from('marketplace_jobs').select('*').eq('accepted_by', currentUser.id).then(function(res) {
    if(res.error){console.log('Load accepted jobs error:',res.error.message);return}
    if (res.data && res.data.length > 0) {
      res.data.forEach(function(mj) {
        if (mj.status !== 'accepted' && mj.status !== 'in_progress' && mj.status !== 'completed') return;
        var dateKey = mj.scheduled_date || (mj.accepted_at ? mj.accepted_at.split('T')[0] : todayKey);
        var timeVal = mj.scheduled_time || '09:00';
        if (!allJobs[dateKey]) allJobs[dateKey] = [];
        // Check if already loaded from jobs table (by marketplace_job_id) OR by marketplace ID
        var alreadyExists = allJobs[dateKey].find(function(j) { return j._marketplaceId === mj.id; });
        // Also check ALL dates for duplicates (job may be on a different date in jobs table)
        if(!alreadyExists){
          var found=false;
          Object.keys(allJobs).forEach(function(dk){
            allJobs[dk].forEach(function(ej){
              if(ej._marketplaceId===mj.id)found=true;
            });
          });
          if(found)return;
        }
        if (!alreadyExists) {
          // Map marketplace status to local status
          var localSt='upcoming';
          if(mj.status==='in_progress')localSt='in_progress';
          else if(mj.status==='completed')localSt='completed';
          var nj = {
            id: nextJobId++, jobNum: 'GL-' + (glJobNum++), time: timeVal,
            cust: mj.customer_name || '', custEmail: mj.customer_email || '',
            custPhone: mj.customer_phone || '', addr: mj.address || '',
            postcode: mj.postcode || '', houseNumber: mj.house_number || '',
            job: mj.description || '', dur: '1hr', amt: mj.price || CALLOUT_STANDARD,
            st: localSt,
            mi: mj.distance || 0, type: 'direct', company: null, compRef: '',
            expenses: [], fromMarketplace: true,
            _marketplaceId: mj.id, _marketCustId: mj.customer_id || null
          };
          // If postcode/houseNumber missing, fill from customer profile
          if((!nj.postcode||!nj.houseNumber)&&mj.customer_id){
            (function(job,custId){
              sb.from('customers').select('postcode,house_number').eq('id',custId).single().then(function(cRes){
                if(cRes.data){
                  if(!job.postcode&&cRes.data.postcode)job.postcode=cRes.data.postcode;
                  if(!job.houseNumber&&cRes.data.house_number)job.houseNumber=cRes.data.house_number;
                }
              });
            })(nj,mj.customer_id);
          }
          allJobs[dateKey].push(nj);
          allJobs[dateKey].sort(function(a, b) { return a.time.localeCompare(b.time); });
        }
      });
      render();
    }
  });
  // Load general expenses
  sb.from('general_expenses').select('*').eq('engineer_id', currentUser.id).order('date', {ascending: false}).then(function(res) {
    if(res.error){console.log('Load expenses error:',res.error.message);return}
    if (res.data && res.data.length > 0) {
      generalExpenses = res.data.map(function(e) {
        return { id: e.id, date: e.date, desc: e.description || '', amt: e.amount || 0, cat: e.category || 'other', catLabel: e.category_label || 'Other', receipt: e.has_receipt || false };
      });
      render();
    }
  });
  // Load this engineer's certificates (full detail kept in the data column)
  sb.from('cp12_certificates').select('*').eq('engineer_id', currentUser.id).order('issue_date', {ascending: false}).then(function(res) {
    if(res.error){console.log('Load certificates error:',res.error.message);return}
    var rows = res.data || [];
    cp12Certs = rows.map(function(r) {
      var c = (r.data && typeof r.data === 'object') ? JSON.parse(JSON.stringify(r.data)) : {};
      c.id = r.certificate_number || c.id || r.id;
      c.certType = c.certType || r.cert_type || 'domestic';
      c.prop = c.prop || r.property_address || '';
      c.landlord = c.landlord || r.landlord_name || '';
      c.tenant = c.tenant || r.tenant_name || '';
      c.recipientEmail = c.recipientEmail || r.landlord_email || '';
      c.date = c.date || r.issue_date || '';
      c.expiry = c.expiry || r.expiry_date || '';
      c.result = c.result || r.inspection_result || 'PASS';
      c.appliances = (c.appliances && c.appliances.length) ? c.appliances : (r.appliances || []);
      if (c.sent === undefined) c.sent = false;
      c._supaId = r.id;
      return c;
    });
    selCP12 = -1;
    render();
  });
  // Load mileage
  sb.from('mileage_log').select('*').eq('engineer_id', currentUser.id).order('date', {ascending: false}).then(function(res) {
    if(res.error){console.log('Load mileage error:',res.error.message);return}
    if (res.data && res.data.length > 0) {
      mileageLog = res.data.map(function(m) {
        return { date: m.date, cust: m.customer_name || '', from: m.origin || 'Home', to: m.destination || '', mi: m.miles || 0, ret: m.return_miles || 0 };
      });
      render();
    }
  });
  // Load engineer's quotes from Supabase
  sb.rpc('load_engineer_quotes', { p_engineer_id: currentUser.id }).then(function(res) {
    if (res.error) { console.log('Load engineer quotes error:', res.error.message); }
    if (res.data && res.data.length > 0) {
      engineerQuotes = res.data.map(function(q) {
        var slots = [];
        try { slots = typeof q.available_slots === 'string' ? JSON.parse(q.available_slots) : (q.available_slots || []); } catch(e) { slots = []; }
        var accSlot = null;
        try { accSlot = typeof q.accepted_slot === 'string' ? JSON.parse(q.accepted_slot) : q.accepted_slot; } catch(e) { accSlot = null; }
        return {
          id: q.quote_number || q.id, _supaId: q.id,
          jobId: q.parent_job_id || null, jobNum: '', marketplaceId: q.marketplace_job_id || null,
          custId: q.customer_id || null, cust: q.customer_name || '', custEmail: q.customer_email || '',
          addr: q.address || '', originalJob: q.original_job || '', diagnosis: q.diagnosis || '',
          partsDesc: q.parts_description || '', partsCost: q.parts_cost || 0,
          labourCost: q.labour_cost || 0, total: q.total || 0,
          availableSlots: slots, sentDate: q.sent_date || '', expiryDate: q.expiry_date || '',
          status: q.status || 'sent', acceptedSlot: accSlot,
          scheduledDate: q.scheduled_date || null, scheduledTime: q.scheduled_time || '',
          returnJobId: q.return_job_id || null
        };
      });
      console.log('Loaded', engineerQuotes.length, 'engineer quotes from Supabase');
      var _maxQ=0;engineerQuotes.forEach(function(q){var n=parseInt(String(q.id||'').replace(/^Q-/,'').split('-')[0],10);if(!isNaN(n)&&n>_maxQ)_maxQ=n});
      if(_maxQ>=nextQuoteId)nextQuoteId=_maxQ+1;
      render();
    }
  });
  // Load engineer's conversations via RPC
  sb.rpc('load_conversations', { p_user_id: currentUser.id, p_role: 'engineer' }).then(function(res) {
    if(res.error){console.log('Load engineer conversations error:',res.error.message);return}
    if (res.data && res.data.length > 0) {
      // Merge with existing messages (from realtime) — avoid duplicates
      res.data.forEach(function(conv) {
        var existing = messages.find(function(m) { return m._convId === conv.conversation_id; });
        if (!existing) {
          var msgs = (conv.messages || []).map(function(m) {
            return {
              from: m.sender_role === 'engineer' ? 'me' : 'cust',
              text: m.content || '', time: m.created_at ? new Date(m.created_at).toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'}) : '',
              photos: []
            };
          });
          if (!msgs.length) { msgs = [{ from: 'cust', text: 'Conversation started', time: '', photos: [] }]; }
          messages.push({
            id: messages.length + 1, cust: conv.other_name || 'Customer', custEmail: conv.other_email || '',
            phone: '', marketJobId: conv.marketplace_job_id || null, unread: (conv.engineer_unread || 0) > 0,
            lastTime: conv.last_message_at ? new Date(conv.last_message_at).toLocaleDateString() : '',
            _otherUserId: conv.customer_id, _convId: conv.conversation_id,
            thread: msgs
          });
        }
      });
      render();
    }
  });
  // === REALTIME: Listen for new marketplace jobs (customer requests) ===
  if(window._marketplaceSub){try{sb.removeChannel(window._marketplaceSub)}catch(e){}}
  window._marketplaceSub=sb.channel('marketplace-new-jobs');
  window._marketplaceSub
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'marketplace_jobs' }, function(payload) {
      console.log('Realtime: New marketplace job received', payload);
      var mj = payload.new;
      // Don't show engineer's own requests
      if (mj.customer_id === currentUser.id) return;
      var newMarket = {
        id: mj.id, cust: mj.customer_name || '', custEmail: mj.customer_email || '',
        phone: mj.customer_phone || '', addr: mj.address || '',
        postcode: mj.postcode || '', houseNumber: mj.house_number || '',
        job: mj.description || '', urgent: mj.is_emergency || false,
        posted: 'Just now', price: mj.price || CALLOUT_STANDARD,
        priceType: mj.is_emergency ? 'emergency' : 'standard',
        boiler: mj.boiler_info || '', dist: 0, status: 'new',
        photos: [], note: mj.note || '', _custId: mj.customer_id || null,
        preferredSlots: mj.preferred_slots || [],
        preferredEngineerId: mj.preferred_engineer_id || null,
        preferredEngineerName: mj.preferred_engineer_name || null
      };
      // If this job is assigned/prioritised to another engineer, skip
      // Direct assignment (no expiry) or priority window — either way, not for this engineer
      if(newMarket.preferredEngineerId && newMarket.preferredEngineerId !== currentUser.id) return;
      marketplaceJobs.unshift(newMarket);
      // Also create a message thread for this marketplace job
      messages.push({
        id: messages.length + 1, cust: newMarket.cust, custEmail: newMarket.custEmail,
        phone: newMarket.phone, marketJobId: newMarket.id, unread: true, lastTime: 'Just now',
        _otherUserId: mj.customer_id || null, _convId: null,
        thread: [{ from: 'cust', text: newMarket.note || newMarket.job, time: 'Just now', photos: [] }]
      });
      render();
      toast('success', '🔔 New job request from ' + newMarket.cust + (newMarket.urgent ? ' (EMERGENCY)' : ''));
    })
    .subscribe(function(status) {
      console.log('Realtime marketplace subscription status:', status);
    });

  // === REALTIME: Listen for marketplace job UPDATES (accepted/declined/expired) ===
  // When another engineer accepts a job, remove it from our feed instantly
  if(window._marketplaceUpdateSub){try{sb.removeChannel(window._marketplaceUpdateSub)}catch(e){}}
  window._marketplaceUpdateSub=sb.channel('marketplace-status-updates');
  window._marketplaceUpdateSub
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'marketplace_jobs' }, function(payload) {
      var updated=payload.new;
      // If job is no longer 'new' (accepted, declined, expired, etc.), remove from marketplace feed
      if(updated.status !== 'new') {
        var before=marketplaceJobs.length;
        marketplaceJobs = marketplaceJobs.filter(function(mj) { return mj.id !== updated.id; });
        if(marketplaceJobs.length < before) {
          console.log('Realtime: Marketplace job',updated.id,'removed — status now:',updated.status);
          render();
          if(updated.accepted_by && updated.accepted_by !== currentUser.id) {
            toast('info', 'A job was just taken by another engineer');
          }
        }
      }
    })
    .subscribe(function(status) {
      console.log('Realtime marketplace-updates subscription status:', status);
    });

  // === REALTIME: Listen for job status changes (e.g. customer updates) ===
  if(window._jobUpdatesSub){try{sb.removeChannel(window._jobUpdatesSub)}catch(e){}}
  window._jobUpdatesSub=sb.channel('job-updates');
  window._jobUpdatesSub
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'jobs', filter: 'engineer_id=eq.' + currentUser.id }, function(payload) {
      var updated = payload.new;
      Object.keys(allJobs).forEach(function(dateKey) {
        allJobs[dateKey].forEach(function(j) {
          if (j.id === updated.id) { j.st = updated.status || j.st; }
        });
      });
      render();
    })
    .subscribe();

  // === REALTIME: Listen for new messages ===
  if(window._engMessagesSub){try{sb.removeChannel(window._engMessagesSub)}catch(e){}}

  // Load customer's gas certificates from cp12_certificates

  // Load customer's quotes from Supabase

          engineerEmail: q.engineer_email || '',
          engineerId: q.engineer_id || null,
          diagnosis: q.diagnosis || '',
          partsDesc: q.parts_description || '',
          partsCost: q.parts_cost || 0,
          labourCost: q.labour_cost || 0,
          total: q.total || 0,

          addr: q.address || '',

          expiryDate: q.expiry_date || '',
          status: q.status || 'sent',
          acceptedSlot: accSlot,
          scheduledDate: q.scheduled_date || null,
          scheduledTime: q.scheduled_time || ''
        };

      render();

  // === REALTIME: Listen for new quotes sent to this customer ===
  if(window._custQuotesSub){try{sb.removeChannel(window._custQuotesSub)}catch(e){}}
  window._custQuotesSub=sb.channel('cust-quotes');
  window._custQuotesSub
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'quotes', filter: 'customer_id=eq.' + currentUser.id }, function(payload) {
      console.log('REALTIME: Customer got new quote', payload);
      var q = payload.new;
      var slots = [];
      try { slots = typeof q.available_slots === 'string' ? JSON.parse(q.available_slots) : (q.available_slots || []); } catch(e) { slots = []; }
      var exists = custQuotes.find(function(cq) { return cq.id === q.quote_number || cq._supaId === q.id; });
      if (!exists) {
        custQuotes.unshift({
          id: q.quote_number || q.id, _supaId: q.id,
          engineerName: q.engineer_name || 'Engineer', engineerGasSafe: q.engineer_gas_safe || '',
          engineerEmail: q.engineer_email || '', engineerId: q.engineer_id || null,
          diagnosis: q.diagnosis || '', partsDesc: q.parts_description || '',

  // === REALTIME: Listen for job acceptance (engineer accepted customer's request) ===
  if(window._custJobUpdatesSub){try{sb.removeChannel(window._custJobUpdatesSub)}catch(e){}}
  window._custJobUpdatesSub=sb.channel('cust-job-updates');
  window._custJobUpdatesSub
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'marketplace_jobs', filter: 'customer_id=eq.' + currentUser.id }, function(payload) {
      console.log('REALTIME: Customer got marketplace update', payload);
      var updated = payload.new;
      custMyJobs.forEach(function(j) {
        if (j.id === updated.id) {
          j.status = updated.status || j.status;
          if (updated.accepted_by) j.engineer = updated.engineer_name || 'Assigned';
          if (updated.engineer_name) j.engineerName = updated.engineer_name;
          if (updated.scheduled_date) j.scheduledDate = updated.scheduled_date;
          if (updated.scheduled_time) j.scheduledTime = updated.scheduled_time;
          // Update timeline steps
          if (updated.status === 'accepted') {
            if (j.timeline) {
              j.timeline.forEach(function(t) {
                if (t.step === 'Engineer Accepts') { t.done = true; t.date = 'Just now'; }
                if (t.step === 'Scheduled' && updated.scheduled_date) { t.done = true; t.date = updated.scheduled_date + (updated.scheduled_time ? ' at ' + updated.scheduled_time : ''); }
              });
            }
          }
          if (updated.status === 'in_progress') {
            if (j.timeline) { j.timeline.forEach(function(t) { if (t.step === 'In Progress') { t.done = true; t.date = 'Just now'; } }); }
          }
          if (updated.status === 'completed') {
            if (j.timeline) { j.timeline.forEach(function(t) { if (t.step === 'Completed & Paid') { t.done = true; t.date = 'Just now'; } }); }
          }
        }
      });
      if (updated.status === 'accepted') {
        var schedMsg = updated.scheduled_date ? ' Scheduled for ' + updated.scheduled_date + (updated.scheduled_time ? ' at ' + updated.scheduled_time : '') : '';
        toast('success', '🎉 ' + (updated.engineer_name || 'An engineer') + ' has accepted your job!' + schedMsg);
        notifyJobUpdate(updated.description||'Service','accepted',updated.engineer_name||'');
      }
      if (updated.status === 'in_progress') {
        toast('success', '🚐 ' + (updated.engineer_name || 'Your engineer') + ' is on the way!');
        notifyJobUpdate(updated.description||'Service','in_progress',updated.engineer_name||'');
      }
      if (updated.status === 'completed') {
        toast('success', '✅ Your job has been completed!');
        notifyJobUpdate(updated.description||'Service','completed',updated.engineer_name||'');
        // Prompt review after a brief delay
        setTimeout(function(){
          showReviewPrompt(updated.accepted_by||'',updated.engineer_name||'Your Engineer',updated.description||'Service',updated.address||'');
        },2000);
      }
      // Detect engineer decline: preferred_engineer_id cleared, status still 'new'
      if (updated.status === 'new' && !updated.preferred_engineer_id && payload.old && payload.old.preferred_engineer_id) {
        toast('info', '🔄 Your requested engineer was unavailable. Job reopened to all engineers in your area.');
        notifyJobUpdate(updated.description||'Service','rerouted','');
        // Update local job to reflect rerouting
        custMyJobs.forEach(function(j) {
          if (j.id === updated.id) {
            j.engineer = null;
            j.engineerName = null;
            j.requestedEngineerDeclined = true;
          }
        });

  // === REALTIME: Listen for new invoices sent to this customer ===

    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'invoices', filter: 'customer_id=eq.' + currentUser.id }, function(payload) {

    .subscribe(function(status) { console.log('Customer invoices subscription:', status); });

  // === REALTIME: Listen for new messages to this customer ===
  if(window._custMessagesSub){try{sb.removeChannel(window._custMessagesSub)}catch(e){}}
  window._custMessagesSub=sb.channel('cust-messages');
  window._custMessagesSub
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'sender_id=neq.' + currentUser.id }, function(payload) {
      var msg = payload.new;
      var found = false;
      custMessages.forEach(function(m) {
        if (m._convId && m._convId === msg.conversation_id) {
          m.thread.push({ from: 'eng', text: msg.content || '', time: 'Just now' });
          m.lastTime = 'Just now';

          found = true;

          if (res.error || !res.data || !res.data.length) return;
          custMessages = res.data.map(function(conv) {
            var msgs = (conv.messages || []).map(function(m) {
              return { from: m.sender_role === 'customer' ? 'cust' : 'eng', text: m.content || '',
                time: m.created_at ? new Date(m.created_at).toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'}) : '' };
            });
            if (!msgs.length) { msgs = [{ from: 'eng', text: 'Conversation started', time: '' }]; }
            return { engineer: { name: conv.other_name || 'Engineer', avatar: (conv.other_name || 'E').charAt(0), color: 'teal' },

          });
          toast('success', '💬 New message from your engineer');
          render();
        });
      }
    })
    .subscribe(function(status) { console.log('Customer messages subscription:', status); });

  // === AUTO REMINDERS: Check for upcoming appointment reminders ===
  var custReminders = []; // {jobId, type:'day_before'|'3_hours', triggerAt: Date, fired: false}
  var custReminderCheckId = setInterval(function() {
    if (!currentUser || S.role !== 'customer') { clearInterval(custReminderCheckId); return; }
    var now = new Date();
    custReminders.forEach(function(r) {
      if (!r.fired && now >= r.triggerAt) {
        r.fired = true;
        var job = custMyJobs.find(function(j) { return j.id === r.jobId; });

        } else {
          toast('info', '⏰ ' + engName + ' arrives in 3 hours (' + r.time + ') — please make sure someone is home!');
        }
      }
    });
  }, 30000); // Check every 30 seconds

  // === POLLING FALLBACK: Check for job updates every 8 seconds ===
  // Realtime may not work across tabs with the same Supabase client (shared auth session)
  console.log('POLL SETUP: Starting customer poll for user:', currentUser.id, 'role:', S.role);
  var custPollId = setInterval(function() {
    if (!currentUser || S.role !== 'customer') { clearInterval(custPollId); return; }
    console.log('POLL: Fetching marketplace_jobs for customer_id:', currentUser.id);
    sb.from('marketplace_jobs').select('*').eq('customer_id', currentUser.id).then(function(res) {

      if (!res.data || res.error) return;

        var existing = custMyJobs.find(function(j) { return j.id === mj.id; });

          // Always sync scheduled date/time/engineer from Supabase
          var statusChanged = existing.status !== mj.status;
          var schedChanged = (!existing.scheduledDate && mj.scheduled_date) || (!existing.engineerName && mj.engineer_name);
          if (mj.accepted_by && !existing.engineer) {
            existing.engineer = {name: mj.engineer_name || 'Assigned', avatar: (mj.engineer_name || 'E').charAt(0), color: 'teal', gasSafe: true};

            existing.scheduledTime = mj.scheduled_time || null;
            existing.engineerName = mj.engineer_name || null;

                var threeHrsBefore = new Date(apptDate); threeHrsBefore.setHours(threeHrsBefore.getHours() - 3);

                console.log('REMINDERS: Created 2 reminders for job', mj.id, '— day before:', dayBefore, '3hrs before:', threeHrsBefore);
              }
            }
          }
          if (statusChanged || schedChanged) { changed = true; }
        } else {
          custMyJobs.push({
            id: mj.id, type: mj.job_type || 'Repair', desc: mj.description || '',
            engineer: mj.accepted_by ? {name: mj.engineer_name || 'Assigned', avatar: (mj.engineer_name || 'E').charAt(0), color: 'teal', gasSafe: true} : null,
            status: mj.status || 'new', posted: mj.created_at || '',

            timeline: []
          });
          changed = true;
        }
      });
      // Also poll for new invoices
      sb.from('invoices').select('*').eq('customer_id', currentUser.id).then(function(invRes) {
        if (!invRes.data) return;

// ===== AVAILABILITY CALCULATOR =====
function calcDayAvailability(dateKey){
  var jobs=getJobs(dateKey);
  var e=S.engineer;
  // Parse durations to hours
  var bookedHrs=jobs.reduce(function(s,j){
    var d=j.dur||'1hr';var h=0;
    if(d.indexOf('hr')!==-1)h=parseFloat(d);
    else if(d.indexOf('min')!==-1)h=parseFloat(d)/60;
    else h=parseFloat(d)||1;
    return s+h;
  },0);
  var maxHrs=e.maxHoursPerDay||8;
  var freeHrs=Math.max(maxHrs-bookedHrs,0);
  var pct=bookedHrs/maxHrs;
  var status=pct<0.5?'green':pct<0.85?'amber':'red';
  var label=pct<0.5?'Light':pct<0.85?'Busy':'Full';
  // Build taken time slots
  var takenSlots=jobs.map(function(j){return j.time}).filter(function(t){return t&&t!=='TBD'});
  // Build available slots from work window
  var startH=parseInt(e.workStart.split(':')[0]);
  var endH=parseInt(e.workEnd.split(':')[0]);
  var slots=[];
  for(var h=startH;h<endH;h++){
    var t=(h<10?'0':'')+h+':00';
    var t30=(h<10?'0':'')+h+':30';
    var taken=takenSlots.indexOf(t)!==-1;
    var taken30=takenSlots.indexOf(t30)!==-1;
    slots.push({time:t,taken:taken});
    slots.push({time:t30,taken:taken30});
  }
  // Check if it's a working day
  var dayOfWeek=new Date(dateKey).getDay();
  var isWorkDay=e.workDays.indexOf(dayOfWeek)!==-1;
  return {dateKey:dateKey,jobs:jobs.length,bookedHrs:bookedHrs,freeHrs:freeHrs,maxHrs:maxHrs,status:status,label:label,slots:slots,isWorkDay:isWorkDay};
}

// === ADDRESS AUTOCOMPLETE (postcodes.io for postcodes + Nominatim for streets) ===
var _addrTimer=null;
var _addrCurrentInput=null;
var _ukPcRegex=/^[A-Za-z]{1,2}\d[A-Za-z\d]?\s*\d?[A-Za-z]{0,2}$/;
function addrAutocomplete(inputEl){
  _addrCurrentInput=inputEl;
  if(_addrTimer)clearTimeout(_addrTimer);
  var q=inputEl.value.trim();
  var minLen=_ukPcRegex.test(q)?3:4;
  if(q.length<minLen){hideAddrSuggestions();return}
  _addrTimer=setTimeout(function(){
    fetchAddrSuggestions(q,inputEl);
  },400);
}
function fetchAddrSuggestions(query,inputEl){
  if(_ukPcRegex.test(query)){
    // UK postcode detected → use postcodes.io (free, accurate)
    var acUrl='https://api.postcodes.io/postcodes/'+encodeURIComponent(query)+'/autocomplete';
    fetch(acUrl).then(function(r){return r.json()}).then(function(data){
      if(!data||!data.result||!data.result.length){hideAddrSuggestions();return}
      var pcs=data.result.slice(0,6);
      return fetch('https://api.postcodes.io/postcodes',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({postcodes:pcs})
      }).then(function(r2){return r2.json()});
    }).then(function(bulk){
      if(!bulk||!bulk.result){hideAddrSuggestions();return}
      showPostcodeSuggestions(bulk.result,inputEl);
    }).catch(function(){hideAddrSuggestions()});
  }else{
    // Street / address text → use Nominatim
    var url='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=gb&limit=5&q='+encodeURIComponent(query);
    fetch(url,{headers:{'Accept':'application/json'}}).then(function(r){return r.json()}).then(function(results){
      if(!results||!results.length){hideAddrSuggestions();return}
      showAddrSuggestions(results,inputEl);
    }).catch(function(){hideAddrSuggestions()});
  }
}
function _addrDropCSS(rect){
  var maxH=220;var spaceBelow=window.innerHeight-rect.bottom;var spaceAbove=rect.top;var top;
  if(spaceBelow<maxH&&spaceAbove>spaceBelow){var h=Math.min(maxH,spaceAbove-10);top=rect.top-h;maxH=h;}
  else{top=rect.bottom;maxH=Math.min(maxH,spaceBelow-10);}
  return 'position:fixed;left:'+rect.left+'px;top:'+top+'px;width:'+rect.width+'px;max-height:'+maxH+'px;overflow-y:auto;background:#fff;border:1px solid #d1d5db;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.18);z-index:9999;';
}
function showPostcodeSuggestions(results,inputEl){
  hideAddrSuggestions();
  var rect=inputEl.getBoundingClientRect();
  var dropdown=document.createElement('div');
  dropdown.id='addr-suggestions';
  dropdown.style.cssText=_addrDropCSS(rect);
  results.forEach(function(entry){
    if(!entry.result)return;
    var pc=entry.result;
    var postcode=pc.postcode||'';
    var parts=[];
    if(pc.admin_ward)parts.push(pc.admin_ward);
    if(pc.admin_district)parts.push(pc.admin_district);
    var areaText=parts.join(', ');
    var item=document.createElement('div');
    item.style.cssText='padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f3f4f6;transition:background .1s';
    item.innerHTML='<div style="font-weight:600;color:#111827">'+esc(postcode)+'</div>'+(areaText?'<div style="font-size:11px;color:#9ca3af;margin-top:2px">'+esc(areaText)+'</div>':'');
    item.onmouseenter=function(){this.style.background='#F0FDF4'};
    item.onmouseleave=function(){this.style.background='#fff'};
    item.onmousedown=function(e){
      e.preventDefault();
      var fill=[];
      if(pc.admin_ward)fill.push(pc.admin_ward);
      if(pc.admin_district)fill.push(pc.admin_district);
      fill.push(postcode);
      inputEl.value=fill.join(', ');
      hideAddrSuggestions();
      if(typeof autoCalcMiles==='function')autoCalcMiles();
    };
    dropdown.appendChild(item);
  });
  document.body.appendChild(dropdown);
  setTimeout(function(){
    document.addEventListener('click',_addrCloseHandler);
  },50);
}
function showAddrSuggestions(results,inputEl){
  hideAddrSuggestions();
  var rect=inputEl.getBoundingClientRect();
  var dropdown=document.createElement('div');
  dropdown.id='addr-suggestions';
  dropdown.style.cssText=_addrDropCSS(rect);

    var addr=r.display_name||'';

    if(a.house_number)parts.push(a.house_number);
    if(a.road)parts.push(a.road);

    if(a.city||a.town||a.village)parts.push(a.city||a.town||a.village);
    if(a.postcode)parts.push(a.postcode);
    var cleanAddr=parts.length?parts.join(', '):addr;

    item.innerHTML='<div style="font-weight:600;color:#111827">'+esc(cleanAddr)+'</div>'+(a.county?'<div style="font-size:11px;color:#9ca3af;margin-top:2px">'+esc(a.county)+'</div>':'');

// === BOILER PASSPORT LOOKUP (engineer side) ===
function lookupBoilerPassport(jobId){
  var j=findJob(jobId);
  var pc=j?(j.postcode||j._postcode||''):'';
  var house=j?(j.houseNumber||j._houseNumber||''):'';
  var addr=j?(j.addr||''):'';
  var custId=j?(j._marketCustId||null):null;
  // Show loading overlay immediately
  var overlay=document.createElement('div');overlay.className='cascade-overlay';overlay.id='bpLookupOverlay';
  overlay.onclick=function(e){if(e.target===overlay){overlay.remove()}};
  overlay.innerHTML='<div class="cascade-panel" style="max-width:560px;max-height:90vh;overflow-y:auto"><div style="text-align:center;padding:32px"><div style="font-size:48px;margin-bottom:12px">📖</div><div style="font-size:18px;font-weight:800">Looking up Property History...</div><div class="text-sm text-muted mt-8">Searching for '+esc(addr)+'</div></div></div>';
  document.body.appendChild(overlay);
  if(!currentUser||!sb){renderBPOverlay(null,[],addr,pc,house);return}
  // Helper to load history and render once we have a passport match
  function loadBPHistory(bp){
    sb.from('boiler_passport_history').select('*').eq('boiler_passport_id',bp.id).order('service_date',{ascending:false}).then(function(hRes){
      var history=[];
      if(hRes.data&&hRes.data.length>0){
        history=hRes.data.map(function(h){
          return {date:h.service_date||'',type:h.service_type||'Service',engineer:h.engineer_name||'Unknown',gasSafe:h.gas_safe_number||'',notes:h.notes||'',status:h.status||'good',nextWatch:h.next_watch||''};
        });
      }else if(bp.history&&bp.history.length>0){
        history=bp.history.map(function(h){
          return {date:h.service_date||'',type:h.service_type||'Service',engineer:h.engineer_name||'Unknown',gasSafe:h.gas_safe_number||'',notes:h.notes||'',status:h.status||'good',nextWatch:h.next_watch||''};
        });
      }
      renderBPOverlay(bp,history,addr,pc,house);
    });
  }
  // Strategy 1: postcode + house number
  var pcClean=pc.replace(/\s/g,'').toUpperCase();
  var query=sb.from('boiler_passports').select('*');
  if(pc&&house){
    query=query.ilike('house_number',house);
  }else if(custId){
    // Strategy 2: customer_id
    query=query.eq('customer_id',custId);
  }else if(addr){
    // Strategy 3: address substring
    query=query.ilike('address','%'+addr.split(',')[0].trim()+'%');
  }else{renderBPOverlay(null,[],addr,pc,house);return}
  query.then(function(res){
    if(res.error){console.log('BP lookup error:',res.error.message);renderBPOverlay(null,[],addr,pc,house);return}
    // If first strategy found nothing, try fallbacks
    if(!res.data||res.data.length===0){
      // Try customer_id if we haven't already
      if(pc&&house&&custId){
        sb.from('boiler_passports').select('*').eq('customer_id',custId).then(function(res2){
          if(res2.data&&res2.data.length>0){loadBPHistory(res2.data[0]);return}
          // Try address fallback
          if(addr){
            sb.from('boiler_passports').select('*').ilike('address','%'+addr.split(',')[0].trim()+'%').then(function(res3){
              if(res3.data&&res3.data.length>0){loadBPHistory(res3.data[0]);return}
              renderBPOverlay(null,[],addr,pc,house);
            });
          }else{renderBPOverlay(null,[],addr,pc,house)}
        });
        return;
      }
      // Try address fallback if we used customer_id
      if(custId&&addr){
        sb.from('boiler_passports').select('*').ilike('address','%'+addr.split(',')[0].trim()+'%').then(function(res2){
          if(res2.data&&res2.data.length>0){loadBPHistory(res2.data[0]);return}
          renderBPOverlay(null,[],addr,pc,house);
        });
        return;
      }
      renderBPOverlay(null,[],addr,pc,house);return;
    }
    // If we searched by house_number, narrow to matching postcode
    var matches=res.data;
    if(pcClean){
      var pcMatches=matches.filter(function(bp){return (bp.postcode||'').replace(/\s/g,'').toUpperCase()===pcClean});
      if(pcMatches.length>0)matches=pcMatches;
    }
    var bp=matches[0];
    loadBPHistory(bp);
  });
}

function addNotification(type,title,body,action,actionLabel){
