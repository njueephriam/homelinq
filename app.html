  if(custNotifications.length>50)custNotifications=custNotifications.slice(0,50);

function generateReminders(){
  // Service due reminders from Boiler Passports
  boilerPassports.forEach(function(bp){
    if(bp.nextDueDate){
      var due=new Date(bp.nextDueDate);
      var now=new Date();
      var daysUntil=Math.ceil((due-now)/(1000*60*60*24));
      var nId='svc_'+bp.id;
      var exists=custNotifications.some(function(n){return n.id===nId});
      if(!exists){
        if(daysUntil<=0){
          custNotifications.unshift({id:nId,type:'service_due',icon:'🔧',title:'Service Overdue!',body:'Your boiler at '+(bp.houseNumber?bp.houseNumber+', ':'')+bp.address+' is overdue for its annual service.',action:'custBoiler',actionLabel:'View Passport',time:new Date().toISOString(),timeLabel:'Overdue by '+Math.abs(daysUntil)+' days'});
        }else if(daysUntil<=30){
          custNotifications.unshift({id:nId,type:'service_due',icon:'🔧',title:'Service Due Soon',body:'Your boiler at '+(bp.houseNumber?bp.houseNumber+', ':'')+bp.address+' is due for service in '+daysUntil+' days.',action:'custBoiler',actionLabel:'Book Service',time:new Date().toISOString(),timeLabel:'Due in '+daysUntil+' days'});
        }
      }
    }
  });
  // Active job reminders
  custMyJobs.forEach(function(j){
    if(j.scheduledDate&&(j.status==='accepted'||j.status==='in_progress')){
      var sDate=new Date(j.scheduledDate);
      var now=new Date();
      var hoursUntil=Math.ceil((sDate-now)/(1000*60*60));
      var nId='job_'+j.id+'_reminder';
      var exists=custNotifications.some(function(n){return n.id===nId});
      if(!exists&&hoursUntil>0&&hoursUntil<=24){
        custNotifications.unshift({id:nId,type:'reminder',icon:'⏰',title:'Appointment Tomorrow',body:(j.engineerName||'Your engineer')+' is visiting'+(j.scheduledTime?' at '+j.scheduledTime:'')+' for '+j.type+'.',action:'custMyJobs',actionLabel:'View Job',time:new Date().toISOString(),timeLabel:'In '+hoursUntil+' hours'});
      }
    }
  });
  // CO alarm reminder (seasonal, once)
  var month=new Date().getMonth();
  if(month>=9||month<=2){
    var coId='co_season_'+new Date().getFullYear();
    var exists=custNotifications.some(function(n){return n.id===coId});
    if(!exists){
      custNotifications.unshift({id:coId,type:'co_alert',icon:'⚠️',title:'Winter CO Safety Check',body:'With heating season here, test your carbon monoxide alarms and ensure boiler vents are clear.',action:null,actionLabel:null,time:new Date().toISOString(),timeLabel:'Seasonal reminder'});
    }
  }
}

function finalizeCompletion(id,completionType,labourCharge,partsCost,diagnosis){
  var j=findJob(id);if(!j)return;
  if(S.engineer.vatReg&&_completionVatRate===null){askCompletionVat([id,completionType,labourCharge,partsCost,diagnosis]);return}
  var vatRate=S.engineer.vatReg?(_completionVatRate||0):0;_completionVatRate=null;
  j.st='completed'; // Always mark job complete — diagnosis creates callout invoice, books update
  var jobDate=j._date||S.selectedDate;
  var calloutFee=j.calloutFee||0;
  var isMarketplace=j.fromMarketplace&&calloutFee>0;
  var isReturn=j.isReturnVisit;
  var platformFee=j.platformFee||PLATFORM_FEE_FIXED;
  // Calculate expenses
  var billableExp=j.expenses.filter(function(e){return e.billable});
  var billableTotal=billableExp.reduce(function(s,e){return s+e.amt},0);
  var nonBillableTotal=j.expenses.filter(function(e){return !e.billable}).reduce(function(s,e){return s+e.amt},0);
  var allExpTotal=j.expenses.reduce(function(s,e){return s+e.amt},0);
  // === INVOICE LOGIC based on completion type ===
  var invId=nextInvId();
  var invTo=j.type==='company'?j.company+' ('+j.compRef+')':j.cust;
  var custEmail=j.custEmail||'';
  var invAddr=j.addr||'';
  var invCustPhone=j.custPhone||'';
  var invAmt=0;var invDesc='';var invVat=0;
  var engVatReg=vatRate>0;
  if(completionType==='fixed'){
    // Fixed on spot: callout (single line, not broken down) + labour invoice
    // Callout invoice — single line item
    var calloutInvId=nextInvId();
    var calloutVat=vatRate>0?Math.round((calloutFee-calloutFee/(1+vatRate))*100)/100:0;
    var calloutInv={id:invId,cust:invTo,custEmail:custEmail,addr:invAddr,custPhone:invCustPhone,date:fmtDate(jobDate),amt:Math.round((calloutFee-calloutVat)*100)/100,st:'paid',desc:'Callout & Diagnosis',vat:calloutVat,vatInclusive:engVatReg,vatNumber:S.engineer.vatNumber||'',vatRate:vatRate,ecid:j.ecid||null,type:j.type,company:j.company,compRef:j.compRef,jobNum:j.jobNum,expenses:[],paidDate:fmtDate(jobDate),paidMethod:'stripe',paidRef:'ESCROW-RELEASE',chaseCount:0,sentDate:fmtDate(jobDate),lastChase:null,nextChase:null,payLink:false,isCallout:true,platformFee:platformFee};
    invoices.unshift(calloutInv);

    // Labour invoice (if any) — needs paying
    if(labourCharge>0){
      var labInvId=nextInvId();
      var labBaseAmt=labourCharge+billableTotal;
      var labVat=Math.round(labBaseAmt*vatRate*100)/100;
      var labInv={id:labInvId,cust:invTo,custEmail:custEmail,addr:invAddr,custPhone:invCustPhone,date:fmtDate(jobDate),amt:labBaseAmt,st:'unpaid',desc:'Labour — '+j.job+(billableExp.length?' + '+billableExp.length+' expense(s)':''),vat:labVat,vatInclusive:engVatReg,vatNumber:S.engineer.vatNumber||'',vatRate:vatRate,ecid:j.ecid||null,type:j.type,company:j.company,compRef:j.compRef,jobNum:j.jobNum,expenses:billableExp,paidDate:null,paidMethod:null,paidRef:null,chaseCount:0,sentDate:fmtDate(jobDate),lastChase:null,nextChase:null,payLink:true,isCallout:false};
      invoices.unshift(labInv);
      if(currentUser)saveInvoiceToSupabase(labInv);
      invAmt=calloutFee+labourCharge+billableTotal;
    }else{
      invAmt=calloutFee+billableTotal;
    }
  }else if(completionType==='diagnosis'){

    var diagInv={id:invId,cust:invTo,custEmail:custEmail,addr:invAddr,custPhone:invCustPhone,date:fmtDate(jobDate),amt:Math.round((calloutFee-diagVat)*100)/100,st:'paid',desc:'Callout & Diagnosis',vat:diagVat,vatInclusive:engVatReg,vatNumber:S.engineer.vatNumber||'',vatRate:vatRate,ecid:j.ecid||null,type:j.type,company:j.company,compRef:j.compRef,jobNum:j.jobNum,expenses:[],paidDate:fmtDate(jobDate),paidMethod:'stripe',paidRef:'ESCROW-RELEASE',chaseCount:0,sentDate:fmtDate(jobDate),lastChase:null,nextChase:null,payLink:false,isCallout:true,platformFee:platformFee};
    invoices.unshift(diagInv);
    if(currentUser)saveInvoiceToSupabase(diagInv);
    invAmt=calloutFee;
  }else if(completionType==='return'){
    // Return visit: labour + parts only, no callout fee
    var returnAmt=(j.quoteLabourCost||0)+(j.quotePartsCost||0)+billableTotal;
    var returnVat=Math.round(returnAmt*vatRate*100)/100;
    var returnInv={id:invId,cust:invTo,custEmail:custEmail,addr:invAddr,custPhone:invCustPhone,date:fmtDate(jobDate),amt:returnAmt,st:'unpaid',desc:'Return Visit — Labour & Parts'+(billableExp.length?' + '+billableExp.length+' expense(s)':''),vat:returnVat,vatInclusive:engVatReg,vatNumber:S.engineer.vatNumber||'',vatRate:vatRate,ecid:j.ecid||null,type:j.type,company:j.company,compRef:j.compRef,jobNum:j.jobNum,expenses:billableExp,paidDate:null,paidMethod:null,paidRef:null,chaseCount:0,sentDate:fmtDate(jobDate),lastChase:null,nextChase:null,payLink:true,isCallout:false};

      var cq=custQuotes.find(function(x){return x.id===j.quoteId});if(cq)cq.status='completed';
    }
  }else{

    var stdInv={id:invId,cust:invTo,custEmail:custEmail,addr:invAddr,custPhone:invCustPhone,date:fmtDate(jobDate),amt:invAmt,st:'unpaid',desc:j.job+(billableExp.length?' + '+billableExp.length+' expense(s)':''),vat:stdVat,vatInclusive:engVatReg,vatNumber:S.engineer.vatNumber||'',vatRate:vatRate,ecid:j.ecid||null,type:j.type,company:j.company,compRef:j.compRef,jobNum:j.jobNum,expenses:billableExp,paidDate:null,paidMethod:null,paidRef:null,chaseCount:0,sentDate:fmtDate(jobDate),lastChase:null,nextChase:null,payLink:true};

  if(currentUser){

  // Record expenses in books

  // Revenue

  // === MILEAGE ===

  var newMileage={date:fmtDate(jobDate),cust:j.cust,from:'Home ('+S.engineer.postcode+')',to:j.addr,mi:j.mi,ret:j.mi};

  if(custRecord){
    custRecord.jobs=(custRecord.jobs||0)+1;
    custRecord.spent=(custRecord.spent||0)+invAmt;

function engineerConfirmQuote(quoteId){
  var q=engineerQuotes.find(function(x){return x.id===quoteId});if(!q)return;
  if(q.status!=='accepted'){toast('error','Quote must be accepted by customer first');return}
  var slot=q.acceptedSlot;if(!slot){toast('error','No accepted slot found');return}
  q.status='scheduled';
  q.scheduledDate=slot.date;
  q.scheduledTime=slot.time;
  updateQuoteStatusInSupabase(quoteId, 'scheduled', null, slot.date, slot.time);
  // Create job on calendar
  var returnJobNum='GL-'+(glJobNum++);
  var parentJob=findJob(q.jobId);
  var returnJob={id:nextJobId++,jobNum:returnJobNum,time:slot.time,cust:q.cust,custEmail:q.custEmail,custPhone:'',
    addr:q.addr,job:'Return Visit — '+q.originalJob,dur:'1.5hr',amt:q.total,st:'upcoming',mi:parentJob?parentJob.mi:5,type:'direct',company:null,compRef:'',expenses:[],fromMarketplace:true,_marketCustId:q.custId,_marketplaceId:q.marketplaceId,
    calloutFee:0,calloutPaid:false,platformFee:0,escrowStatus:'none',isReturnVisit:true,parentJobId:q.jobId,quoteId:q.id,
    quotePartsCost:q.partsCost,quoteLabourCost:q.labourCost,quoteTotal:q.total,diagnosis:q.diagnosis};
  q.returnJobId=returnJob.id;
  if(!allJobs[slot.date])allJobs[slot.date]=[];
  allJobs[slot.date].push(returnJob);
  allJobs[slot.date].sort(function(a,b){return a.time.localeCompare(b.time)});
  saveJobToSupabase(returnJob,slot.date);
  // Send notification to customer via messages
  var msg=messages.find(function(m){return m.marketJobId===q.marketplaceId});
  if(msg){
    msg.thread.push({from:'me',text:'Great news '+q.cust.split(' ')[0]+' — your return visit is confirmed!\n\n📅 '+fullDay(slot.date)+' '+fmtDateShort(slot.date)+' at '+slot.time+'\n📍 '+q.addr+'\n💰 £'+q.total.toFixed(2)+' (labour + parts)\n\nI\'ll bring all the parts needed. See you then!',time:'Just now',photos:[]});
    msg.lastTime='Just now';
  }
  // Update customer quote status
  var cq=custQuotes.find(function(x){return x.id===quoteId});
  if(cq){cq.status='scheduled';cq.scheduledDate=slot.date;cq.scheduledTime=slot.time}
  // Update customer job
  var custJob=custMyJobs.find(function(j){return j.id===q.marketplaceId||j.type===q.originalJob});
  if(custJob){custJob.status='accepted';custJob.scheduledDate=slot.date;custJob.scheduledTime=slot.time;custJob.engineerName=S.engineer.name}
  toast('success','Return visit confirmed for '+fmtDateShort(slot.date)+' at '+slot.time);
  S.selectedDate=slot.date;
  render();
}
// ===== COMPLETION EMAIL SENDER — called AFTER in-app + marketplace updates =====
function sendCompletionEmails(j, completionType){
  var lastGeneratedInv=invoices[0];
  if(lastGeneratedInv&&lastGeneratedInv.custEmail&&completionType!=='diagnosis'){
    // Auto-send the most recent unpaid invoice for this job
    var invToSend=null;
    for(var ii=0;ii<invoices.length;ii++){
      if(invoices[ii].st==='unpaid'&&invoices[ii].jobNum===j.jobNum){invToSend=invoices[ii];break}
    }
    if(invToSend){
      setTimeout(function(){sendInvoiceEmail(invToSend.id)},2000);
    }
    // Send job completion notification email
    var engName=S.engineer.business||S.engineer.name||'Your Engineer';
    sendHomeLinqEmail(lastGeneratedInv.custEmail, 'Job Complete — '+engName, 'job_completed', {
      customer_name:(j.cust||'').split(' ')[0]||'Customer',
      engineer_name:engName,
      job_type:j.job||'Gas engineer service',
      address:j.addr||'',
      invoice_id:invToSend?invToSend.id:(lastGeneratedInv.id||''),
      total:invToSend?'£'+(invToSend.amt+invToSend.vat).toFixed(2):'£'+(lastGeneratedInv.amt+lastGeneratedInv.vat).toFixed(2)
    }, {reply_to:S.engineer.email||'', from_name:engName});
  }
}
// ===== REUSABLE EMAIL HELPER — calls send-email edge function =====
// opts.reply_to = engineer's email (so customer can reply directly)
// opts.from_name = engineer's business name (shown as "Spencer via HomeLinq")
function sendHomeLinqEmail(to, subject, type, data, opts){
  if(!to||!subject){toast('error','Missing email address or subject');return}
  var payload={to:to,subject:subject,type:type||'generic',data:data||{}};
  if(opts&&opts.reply_to){payload.reply_to=opts.reply_to}
  if(opts&&opts.from_name){payload.from_name=opts.from_name}
  if(opts&&opts.attachments&&opts.attachments.length){payload.attachments=opts.attachments}
  sb.auth.getSession().then(function(sRes){
    var token=(sRes.data&&sRes.data.session)?sRes.data.session.access_token:'';
    fetch(STRIPE_EDGE_URL+'/send-email',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SUPABASE_KEY},
      body:JSON.stringify(payload)
    }).then(function(r){return r.json()}).then(function(res){
      if(res.success){
        toast('success','Email sent to '+to);
      }else{
        console.log('Email send error:',res.error);
        toast('warning','Could not send email: '+(res.error||'unknown error'));
      }
    }).catch(function(err){
      console.log('Email fetch error:',err);
      toast('warning','Email service unavailable — saved locally');
    });
  });
}

function addJobExpense(jobId){
  var descEl=document.getElementById('jexp-desc-'+jobId);var amtEl=document.getElementById('jexp-amt-'+jobId);
  var catEl=document.getElementById('jexp-cat-'+jobId);
  if(!descEl||!amtEl){toast('error','Could not find expense inputs');return}
  var desc=descEl.value.trim();
  if(!desc){toast('error','Enter an expense description');descEl.focus();return}
  var amt=parseFloat(amtEl.value)||0;
  if(amt<=0){toast('error','Enter an expense amount');amtEl.focus();return}
  var j=findJob(jobId);if(!j)return;
  var catId=catEl?catEl.value:'cogs';
  var hcat=HMRC_CATS.find(function(c){return c.id===catId})||HMRC_CATS[0];
  var vatEl=document.getElementById('jexp-vat-'+jobId);var vatAmt=S.engineer.vatReg&&vatEl?Math.max(0,parseFloat(vatEl.value)||0):0;
  if(vatAmt>amt){toast('error','VAT can\'t be more than the amount');return}
  if(vatEl)vatEl.value='';
  var expObj={id:nextExpId++,desc:desc,amt:amt,vat:vatAmt,billable:true,receipt:false,cat:catId,catLabel:hcat.label};
  j.expenses.push(expObj);
  descEl.value='';amtEl.value='';
  toast('success',hcat.icon+' £'+amt.toFixed(2)+' added → '+hcat.sa103);
  render();
  /* === SUPABASE: Save job expense === */
  if(currentUser){
    var jobIdStr=String(j.id||'');
    if(jobIdStr.length>8&&jobIdStr.indexOf('-')>-1){
      sb.from('job_expenses').insert({
        job_id:jobIdStr, description:desc, amount:amt, vat:vatAmt, billable:true,
        hmrc_category:catId, sa103_box:hcat.sa103
      }).select('id').single().then(function(res){
        if(res.error){console.log('Save job expense error:',res.error.message);toast('error','Expense not saved to cloud: '+res.error.message)}
        else{expObj._supaId=res.data.id;console.log('Job expense saved to Supabase');setTimeout(booksRefresh,800)}
      });
    }else{
      toast('warning','Expense kept on this device until the job finishes syncing');
    }
  }
}
function toggleBillable(jobId,expId){
  var j=findJob(jobId);if(!j)return;
  var e=j.expenses.find(function(x){return x.id===expId});if(e)e.billable=!e.billable;
  if(e&&e._supaId&&currentUser){sb.from('job_expenses').update({billable:e.billable}).eq('id',e._supaId).then(function(res){if(res.error)console.log('Update job expense error:',res.error.message)})}

function toggleReceipt(jobId,expId){

function removeJobExpense(jobId,expId){
  var j=findJob(jobId);if(!j)return;
  var gone=j.expenses.find(function(x){return x.id===expId});
  j.expenses=j.expenses.filter(function(x){return x.id!==expId});
  if(gone&&gone._supaId&&currentUser){sb.from('job_expenses').delete().eq('id',gone._supaId).then(function(res){if(res.error){console.log('Delete job expense error:',res.error.message);toast('error','Could not remove from cloud: '+res.error.message)}})}

function selectExpCat(catId){
  var cat=HMRC_CATS.find(function(c){return c.id===catId});if(!cat)return;
  document.getElementById('ge-cat-val').value=catId;
  // Highlight selected
  var btns=document.querySelectorAll('.exp-cat-btn');
  btns.forEach(function(b){b.classList.remove('selected')});
  document.getElementById('ge-cat-'+catId).classList.add('selected');
  // Show details section
  document.getElementById('ge-details-section').style.display='block';
  document.getElementById('ge-cat-badge').innerHTML='<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--primary-light);border-radius:var(--radius)"><span style="font-size:18px">'+cat.icon+'</span><div><div class="fw-700" style="color:var(--primary-dark)">'+cat.label+'</div><div class="text-sm" style="color:var(--primary-dark)">→ '+cat.sa103+' · '+cat.desc+'</div></div></div>';
  // Focus description
  var descEl=document.getElementById('ge-desc');
  if(descEl)descEl.focus();
}
function saveGenExp(){
  var catId=document.getElementById('ge-cat-val').value;
  if(!catId){toast('error','Please pick a category first');return}
  var cat=HMRC_CATS.find(function(c){return c.id===catId});
  var desc=document.getElementById('ge-desc').value;var amt=parseFloat(document.getElementById('ge-amt').value)||0;
  var expDate=document.getElementById('ge-date').value||S.selectedDate;
  var hasReceipt=document.getElementById('ge-receipt-btn').dataset.has==='1';
  if(!desc){toast('error','Please describe the expense');return}
  if(amt<=0){toast('error','Enter an amount');return}
  var vatEl=document.getElementById('ge-vat');var vatAmt=S.engineer.vatReg&&vatEl?Math.max(0,parseFloat(vatEl.value)||0):0;
  if(vatAmt>amt){toast('error','VAT can\'t be more than the amount');return}
  var newGenExp={id:nextGenExpId++,date:expDate,desc:desc,amt:amt,vat:vatAmt,cat:catId,catLabel:cat.label,sa103:cat.sa103,receipt:hasReceipt};
  generalExpenses.unshift(newGenExp);
  // === SUPABASE: Save general expense ===
  saveExpenseToSupabase(newGenExp);
  document.getElementById('genExpModal').remove();
  toast('success',cat.icon+' £'+amt.toFixed(2)+' added → '+cat.sa103);render();setTimeout(booksRefresh,1500);
}
// ===== DAILY NOTEPAD =====
function addNote(){
  var input=document.getElementById('notepad-input');if(!input)return;
  var text=input.value.trim();if(!text){toast('error','Type a note first');return}
  var d=S.selectedDate;
  if(!dailyNotes[d])dailyNotes[d]=[];
  var now=new Date();var h=now.getHours();var m=now.getMinutes();var ampm=h>=12?'PM':'AM';
  h=h%12||12;var timeStr=(h<10?'0':'')+h+':'+(m<10?'0':'')+m+' '+ampm;
  var noteObj={id:nextNoteId++,text:text,pinned:false,time:timeStr};
  dailyNotes[d].unshift(noteObj);
  input.value='';
  toast('success','Note saved');render();
  /* === SUPABASE: Save note === */
  if(currentUser){
    sb.from('daily_notes').insert({
      engineer_id:currentUser.id, date:d, content:text, pinned:false, time_added:timeStr
    }).then(function(res){
      if(res.error)console.log('Save note error:',res.error.message);
      else console.log('Note saved to Supabase');
    });
  }
}
function togglePin(noteId){
  Object.keys(dailyNotes).forEach(function(d){
    dailyNotes[d].forEach(function(n){if(n.id===noteId)n.pinned=!n.pinned});
  });render();
}
function deleteNote(noteId){
  Object.keys(dailyNotes).forEach(function(d){
    dailyNotes[d]=dailyNotes[d].filter(function(n){return n.id!==noteId});
  });render();
}
function addDateReminder(){
  var text=document.getElementById('dr-text');var date=document.getElementById('dr-date');
  if(!text||!date||!text.value.trim()||!date.value){toast('error','Enter both a date and description');return}
  dateReminders.push({id:dateReminders.length+10,date:date.value,text:text.value.trim(),type:'reminder',recurring:false});
  toast('success','Reminder set for '+fmtDateShort(date.value));render();
}
function renderNotepad(){
  var d=S.selectedDate;
  var notes=dailyNotes[d]||[];
  // Sort pinned first
  var sorted=notes.slice().sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)});
  // Check for date reminders today
  var todayReminders=dateReminders.filter(function(r){return r.date===d});
  var reminderHTML=todayReminders.map(function(r){
    var cls=r.type==='deadline'?'deadline':r.type==='tax'?'tax':'';
    var icon=r.type==='deadline'?'⚠️':r.type==='tax'?'🏛️':'📌';
    return '<div class="date-reminder-banner '+cls+'"><span style="font-size:18px">'+icon+'</span><div style="flex:1"><div class="fw-700" style="font-size:13px">'+r.text+'</div><div class="text-sm text-muted">'+fmtDate(r.date)+'</div></div><button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();dateReminders=dateReminders.filter(function(x){return x.id!=='+r.id+'});toast(\'success\',\'Dismissed\');render()">Dismiss</button></div>';
  }).join('');
  var isOpen=S.notepadOpen!==false;
  return reminderHTML+'<div class="notepad mb-24"><div class="notepad-header" onclick="S.notepadOpen=!S.notepadOpen;render()" style="cursor:pointer"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:18px">📝</span><div class="fw-700" style="font-size:14px">Notes — '+fmtDateShort(d)+'</div>'+(sorted.length?'<span class="badge badge-neutral">'+sorted.length+'</span>':'')+'</div><div class="flex gap-8" style="align-items:center"><span class="collapse-arrow'+(isOpen?' open':'')+'">▼</span></div></div>'+
    (isOpen?'<div>'+
    (sorted.length?sorted.map(function(n){
      return '<div class="note-item"><div class="note-pin" onclick="event.stopPropagation();togglePin('+n.id+')" title="'+(n.pinned?'Unpin':'Pin as reminder')+'">'+(n.pinned?'📌':'○')+'</div><div class="note-text'+(n.pinned?' fw-700':'')+'">'+n.text+'</div><div class="note-time">'+n.time+'</div><div class="note-actions"><button class="note-del" onclick="event.stopPropagation();deleteNote('+n.id+')" title="Delete">✕</button></div></div>';
    }).join(''):'<div class="text-center text-muted" style="padding:16px;font-size:13px">No notes for this day. Jot something down below.</div>')+
    '<div class="notepad-input"><input id="notepad-input" class="input" placeholder="Add a note for '+fmtDateShort(d)+'..." onkeydown="if(event.key===\'Enter\')addNote()"><button onclick="addNote()">+ Add</button></div></div>':'')+'</div>';
}
function editJob(id){S.editJobId=id;go('editJob')}
function saveEditJob(){
  var j=findJob(S.editJobId);if(!j)return;
  j.time=document.getElementById('ej-time').value||j.time;
  var ejTimeTo=document.getElementById('ej-time-to')?document.getElementById('ej-time-to').value:'';
  j.timeTo=(ejTimeTo&&ejTimeTo>j.time)?ejTimeTo:'';
  j.cust=document.getElementById('ej-cust').value||j.cust;
  j.custEmail=document.getElementById('ej-email').value||j.custEmail;
  j.custPhone=document.getElementById('ej-phone')?document.getElementById('ej-phone').value:j.custPhone;
  j.addr=document.getElementById('ej-addr').value||j.addr;j.job=document.getElementById('ej-job').value||j.job;
  j.dur=document.getElementById('ej-dur').value||j.dur;j.amt=parseFloat(document.getElementById('ej-amt').value)||j.amt;
  j.mi=parseFloat(document.getElementById('ej-mi').value)||j.mi;
  // Sync to Supabase
  if(currentUser&&j.id&&String(j.id).indexOf('-')>-1){
    var dateKey=null;
    Object.keys(allJobs).forEach(function(d){
      allJobs[d].forEach(function(x){if(x.id===j.id)dateKey=d});
    });
    sb.from('jobs').update({
      scheduled_time:j.time||'',
      time_to:j.timeTo||'',
      customer_name:j.cust||'',
      customer_email:j.custEmail||'',
      customer_phone:j.custPhone||'',
      address:j.addr||'',
      description:j.job||'',
      estimated_duration:j.dur||'',
      price:j.amt||0,
      miles:j.mi||0,
      status:j.st||'upcoming'
    }).eq('id',j.id).then(function(res){
      if(res.error)console.log('Job update error:',res.error.message);
      else console.log('Job updated in Supabase');
    });
    // Also update linked invoice if exists
    var linkedInv=invoices.find(function(i){return i.jobNum===j.jobNum});
    if(linkedInv){
      var billableExp=j.expenses.filter(function(e){return e.billable}).reduce(function(s,e){return s+e.amt},0);
      var _oldRate=linkedInv.amt?(Number(linkedInv.vat)||0)/linkedInv.amt:0;_oldRate=Math.abs(_oldRate-0.2)<0.01?0.2:(Math.abs(_oldRate-0.05)<0.01?0.05:0);
      linkedInv.amt=j.amt+billableExp;
      linkedInv.cust=j.cust;linkedInv.custEmail=j.custEmail;
      linkedInv.desc=j.job;
      linkedInv.vat=S.engineer.vatReg?Math.round(linkedInv.amt*_oldRate*100)/100:0;
      saveInvoiceToSupabase(linkedInv);
    }
  }
  toast('success','Job '+j.jobNum+' updated: '+j.cust);go('jobsheet');
}
function deleteJob(){
  Object.keys(allJobs).forEach(function(d){allJobs[d]=allJobs[d].filter(function(x){return x.id!==S.editJobId})});
  toast('success','Job removed');go('jobsheet');
}
function saveNewJob(){
  var jtype=document.getElementById('nj-type').value;
  var custName=document.getElementById('nj-cust').value||'New Customer';
  var custId=document.getElementById('nj-cust').dataset.custId;
  // For company jobs: the company IS the selected customer (if isCompany)
  var comp=null;
  if(jtype==='company'){
    var selCust=custId?customers.find(function(c){return String(c.id)===String(custId)}):null;
    comp=selCust&&selCust.isCompany?selCust.name:custName;
  }
  var compRef=jtype==='company'?(document.getElementById('nj-compref').value||''):'';
  var custEmail=document.getElementById('nj-email').value||'';
  var custPhone=document.getElementById('nj-phone')?document.getElementById('nj-phone').value:'';
  var addr=document.getElementById('nj-addr').value||'';
  var autoMi=estimateMiles(addr);
  var manualMi=document.getElementById('nj-mi').value;
  // Job number: company jobs use company ref, direct jobs get GL- prefix
  var jobNum=jtype==='company'&&compRef?compRef:'GL-'+(glJobNum++);
  var njTimeFrom=document.getElementById('nj-time').value||'09:00';
  var njTimeTo=document.getElementById('nj-time-to')?document.getElementById('nj-time-to').value:'';
  if(njTimeTo&&njTimeTo<=njTimeFrom)njTimeTo='';// ignore if TO is before FROM
  var nj={id:nextJobId++,jobNum:jobNum,time:njTimeFrom,timeTo:njTimeTo||'',
    cust:custName,custEmail:custEmail,custPhone:custPhone,
    addr:addr,job:document.getElementById('nj-job').value||'Service',
    dur:document.getElementById('nj-dur').value||'1hr',amt:parseFloat(document.getElementById('nj-amt').value)||0,
    st:'upcoming',mi:manualMi?parseFloat(manualMi):autoMi,type:jtype,company:comp,compRef:compRef,expenses:[],parts:(window._njParts||[]).slice(),
    ecid:(function(){var _sc=custId?customers.find(function(c){return String(c.id)===String(custId)}):null;return _sc?(_sc._supaId||null):null})()};
  window._njParts=[];
  var day=document.getElementById('nj-day').value;
  if(!allJobs[day])allJobs[day]=[];
  allJobs[day].push(nj);
  allJobs[day].sort(function(a,b){return a.time.localeCompare(b.time)});
  // Add company to customers list if new (customers is now the master list)
  if(jtype==='company'&&comp){
    var exists=customers.find(function(c){return c.name===comp&&c.isCompany});
    if(!exists){
      var ini=comp.split(' ').map(function(w){return w[0]}).join('').substring(0,2).toUpperCase();
      var rf=comp.substring(0,2).toUpperCase();
      var _compCust={id:nextCustId++,name:comp,ini:ini,addr:'',email:custEmail,phone:custPhone,boiler:'—',last:'New',next:'Ongoing',jobs:0,spent:0,c:'purple',isCompany:true,contactPerson:'',refPrefix:rf,hist:[]};
      customers.push(_compCust);
      saveCustomerToSupabase(_compCust);
      // Also add to legacy companies list
      companies.push({name:comp,short:comp.length>12?comp.substring(0,12):comp,ref:rf,color:'#6366F1'});
    }
  }
  // For direct customers, also add to DB if new
  if(jtype==='direct'&&custName&&!custId){
    var existsDirect=customers.find(function(c){return c.name===custName&&!c.isCompany});
    if(!existsDirect){
      var iniD=custName.split(' ').map(function(w){return w[0]}).join('').substring(0,2).toUpperCase();
      var cols=['teal','blue','warning','purple'];
      var _dirCust={id:nextCustId++,name:custName,ini:iniD,addr:addr,email:custEmail,phone:custPhone,boiler:'',last:'New',next:'TBD',jobs:0,spent:0,c:cols[nextCustId%4],isCompany:false,hist:[]};
      customers.push(_dirCust);
      saveCustomerToSupabase(_dirCust);
    }
  }
  S.selectedDate=day;
  // === SUPABASE: Save new job ===
  saveJobToSupabase(nj, day);
  // === Send booking notification ===
  var engName=S.engineer.business||S.engineer.name||'Your Engineer';
  var timeDisplay=nj.time;
  if(nj.timeTo&&nj.timeTo!==nj.time){timeDisplay=nj.time+' - '+nj.timeTo}
  if(jtype==='company'){
    // Company job: ask engineer if they want to notify company
    var hoName=document.getElementById('nj-ho-name')?document.getElementById('nj-ho-name').value.trim():'';
    var hoPhone=document.getElementById('nj-ho-phone')?document.getElementById('nj-ho-phone').value.trim():'';
    nj.homeownerName=hoName;
    nj.homeownerPhone=hoPhone;
    showCompanyNotifyDialog(nj, day, custEmail, engName, timeDisplay, addr, custName, hoName, hoPhone);
  }else{
    // Direct customer: auto-send notification as before
    if(custEmail){
      sendHomeLinqEmail(custEmail,'Booking Confirmed — '+fmtDateShort(day),'booking_confirmation',{
        customer_name:(custName||'').split(' ')[0]||'Customer',
        engineer_name:engName,
        job_type:nj.job||'Gas engineer services',
        date:fullDay(day)+' '+fmtDateShort(day),
        time:timeDisplay,
        address:addr||'',
        gas_safe:S.engineer.gasSafe||''
      },{reply_to:S.engineer.email||'',from_name:engName});
    }
    toast('success','Job '+jobNum+' added: '+nj.cust+' on '+fmtDateShort(day));go('jobsheet');
  }
}

function handleCompanyNotify(sendIt){
  var d=window._pendingCompanyNotify;if(!d)return;
  var btn=event.target;
  if(sendIt&&d.compEmail){
    btn.textContent='Sending...';btn.disabled=true;
    sendHomeLinqEmail(d.compEmail,'Booking Confirmed — '+fmtDateShort(d.day),'booking_confirmation',{
      customer_name:(d.compName||'').split(' ')[0]||'Company',
      engineer_name:d.engName,
      job_type:d.nj.job||'Gas engineer services',
      date:fullDay(d.day)+' '+fmtDateShort(d.day),
      time:d.timeDisplay,
      address:d.addr||'',
      gas_safe:S.engineer.gasSafe||''
    },{reply_to:S.engineer.email||'',from_name:d.engName});
    btn.textContent='✓ Sent!';btn.style.background='#059669';
    toast('success','Notification sent to '+d.compName);
  }else{
    btn.textContent='Skipped';btn.disabled=true;btn.style.background='#9CA3AF';
    toast('info','Company notification skipped');
  }
}
function handleHomeownerSMS(){
  var d=window._pendingCompanyNotify;if(!d)return;
  var engName=d.engName;
  var compLabel=d.compName||'your service provider';
  var hoLabel=d.hoName?(d.hoName.split(' ')[0]):'';
  var dateStr=fullDay(d.day)+' '+fmtDateShort(d.day);
  var timeStr=d.timeDisplay;
  var msg='Hi'+(hoLabel?' '+hoLabel:'')+', this is '+engName+' from '+compLabel+'. Just to let you know I have your job booked in for '+dateStr+', arriving '+timeStr+'. See you then!';

  window.open(smsUrl,'_blank');
  var btn=event.target;btn.textContent='✓ SMS Opened';btn.style.background='#047857';btn.disabled=true;
}
function closeCompanyNotifyDialog(){

  var today=new Date();
  var dateStr=today.getDate()+' '+mon[today.getMonth()]+' '+today.getFullYear();
  var due=new Date(today.getTime()+(st.dueDays||14)*86400000);
  var dueKey=localDateKey(due);
  var dueStr=due.getDate()+' '+mon[due.getMonth()]+' '+due.getFullYear();
  var desc=items[0].desc+(items.length>1?' + '+(items.length-1)+' more item'+(items.length>2?'s':''):'');
  var newInv={id:nextInvId(),cust:c.name,custEmail:String(st.email||'').trim(),custPhone:st.phone||'',addr:st.addr||'',date:dateStr,
    amt:t.sub,vat:t.vat,vatInclusive:t.vat>0,vatRate:S.engineer.vatReg?t.rate:0,vatNumber:S.engineer.vatNumber||'',
    items:items,st:'unpaid',desc:desc,ecid:c._supaId||null,dueDate:dueStr,dueDateKey:dueKey,
    type:c.isCompany?'company':'direct',company:c.isCompany?c.name:null,chaseCount:0,expenses:[]};

function processCalloutPayment(){
  var pType=custPostData.priority==='emergency'?'emergency':'standard';
  var calloutFee=getCustRate(pType,custPostData._acceptedEngineerId);
  var feeType=custPostData.priority==='emergency'?'Out of Hours':'Standard';
  var engineerShare=calloutFee-PLATFORM_FEE_FIXED;
  // Show Stripe processing overlay
  var overlay=document.createElement('div');overlay.className='cascade-overlay';overlay.id='stripePayOverlay';
  overlay.innerHTML='<div class="cascade-panel" style="max-width:400px;text-align:center">'+
    '<div style="margin-bottom:20px"><div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#635BFF,#7B73FF);margin:0 auto 16px;display:flex;align-items:center;justify-content:center"><div style="width:24px;height:24px;border:3px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div></div>'+
    '<div style="font-weight:800;font-size:18px">Connecting to Stripe...</div>'+
    '<div style="font-size:13px;color:#6b7280;margin-top:8px">Preparing secure checkout for &#163;'+calloutFee+'</div></div>'+
    '<div style="padding:12px;background:#f8fafc;border-radius:10px;font-size:12px;color:#64748b">'+
    '<div style="display:flex;align-items:center;gap:8px;justify-content:center"><span>🔒</span><span>256-bit encrypted payment via Stripe Connect</span></div></div></div>';
  document.body.appendChild(overlay);
  // Call Supabase Edge Function to create Stripe Checkout session
  if(currentUser&&sb){
    var session=sb.auth.getSession?sb.auth.getSession():null;
    var token=currentUser.access_token||'';
    // Try to get fresh token
    sb.auth.getSession().then(function(sRes){
      if(!sRes.data||!sRes.data.session){
        console.log('No valid session — falling back to local payment');
        var payOverlay=document.getElementById('stripePayOverlay');if(payOverlay)payOverlay.remove();
        processCalloutPaymentLocal(calloutFee,feeType,engineerShare);
        return;
      }
      token=sRes.data.session.access_token;
      var successUrl=window.location.href.split('?')[0]+'?payment=success';
      var cancelUrl=window.location.href.split('?')[0]+'?payment=cancelled';
      // Save job data so we can create the job when customer returns from Stripe
      try{localStorage.setItem('homelinq_pending_post',JSON.stringify(custPostData))}catch(e){}
      // Add 15-second timeout so it never hangs
      var controller=new AbortController();
      var timeoutId=setTimeout(function(){controller.abort()},15000);
      fetch(STRIPE_EDGE_URL+'/create-checkout-session',{
        method:'POST',
        signal:controller.signal,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SUPABASE_KEY},
        body:JSON.stringify({
          engineer_id:custPostData._acceptedEngineerId||null,
          job_id:null,
          job_type:custPostData.type||'Callout',
          job_description:(custPostData.type||'Gas engineer')+' - '+(custPostData.desc||'callout'),
          success_url:successUrl,
          cancel_url:cancelUrl,
          customer_name:S.custUser.name||'',
          customer_email:S.custUser.email||'',
          customer_phone:S.custUser.phone||'',
          customer_address:custPostData.addr||S.custUser.addr||'',
          house_number:custPostData.houseNumber||S.custUser.houseNumber||'',
          postcode:S.custUser.postcode||'',
          job_note:custPostData.desc||'',
          is_emergency:custPostData.priority==='emergency',
          preferred_slots:custPostData.preferredSlots||[]
        })
      }).then(function(r){
        clearTimeout(timeoutId);
        if(!r.ok){
          console.log('Stripe edge function returned status:',r.status);
          return {error:'Edge function error ('+r.status+')'};
        }
        return r.json();
      }).then(function(data){
        var payOverlay=document.getElementById('stripePayOverlay');if(payOverlay)payOverlay.remove();
        if(data&&data.checkout_url){
          // Redirect to Stripe hosted checkout
          window.location.href=data.checkout_url;
        }else if(data&&data.error&&data.error.indexOf('not connected')>-1){
          // Engineer hasn't connected Stripe yet — tell customer honestly
          toast('warning','This engineer has not set up payments yet. Please try another engineer or check back later.');
        }else{
          // Edge function error or engineer not connected — fall back to local flow
          console.log('Stripe Connect not available:',data?data.error:'no data');
          processCalloutPaymentLocal(calloutFee,feeType,engineerShare);
        }
      }).catch(function(err){
        clearTimeout(timeoutId);
        console.log('Stripe checkout error, falling back:',err);
        var payOverlay=document.getElementById('stripePayOverlay');if(payOverlay)payOverlay.remove();
        if(err.name==='AbortError'){
          toast('warning','Payment service timed out — using backup payment flow');
        }
        processCalloutPaymentLocal(calloutFee,feeType,engineerShare);
      });
    }).catch(function(err){
      console.log('Session error:',err);
      var payOverlay=document.getElementById('stripePayOverlay');if(payOverlay)payOverlay.remove();
      processCalloutPaymentLocal(calloutFee,feeType,engineerShare);
    });
  }else{
    // Not logged in — use local flow
    var payOverlay=document.getElementById('stripePayOverlay');if(payOverlay)payOverlay.remove();
    processCalloutPaymentLocal(calloutFee,feeType,engineerShare);
  }
}

}

function submitCustJob(calloutFee){
  var finalPrice=calloutFee||getCustRate(custPostData.priority==='emergency'?'emergency':'standard',custPostData._acceptedEngineerId);
  var prefSlots=custPostData.preferredSlots.slice();
  var feeType=custPostData.priority==='emergency'?'out_of_hours':'standard';
  var nj={id:103+custMyJobs.length,type:custPostData.type,desc:custPostData.desc,engineer:null,status:'open',posted:new Date().toLocaleString(),accepted:null,scheduled:null,price:finalPrice,addr:custPostData.addr||S.custUser.addr,priority:custPostData.priority,
    calloutFee:finalPrice,calloutPaid:true,calloutPaidDate:new Date().toISOString(),paymentType:feeType,escrowStatus:'held',paymentHeldMsg:'Your payment of £'+finalPrice+' is held securely by Stripe until the job is completed.',
    preferredSlots:prefSlots,scheduledDate:null,scheduledTime:null,engineerName:null,
    timeline:[{step:'Payment Held by Stripe',date:'Just now',done:true},{step:'Engineer Accepts',date:'',done:false},{step:'Scheduled',date:'',done:false},{step:'In Progress',date:'',done:false},{step:'Completed & Paid',date:'',done:false}]};
  custMyJobs.unshift(nj);
  var marketJob={id:nextMarketId++,cust:S.custUser.name,custEmail:S.custUser.email,phone:S.custUser.phone,addr:nj.addr,job:nj.type+' — '+nj.desc,urgent:nj.priority==='emergency',posted:'Just now',price:finalPrice,priceType:feeType,calloutFee:finalPrice,calloutPaid:true,boiler:'',dist:2.1,status:'new',photos:[],note:nj.desc,preferredSlots:prefSlots};
  marketplaceJobs.push(marketJob);
  // === SUPABASE: Ensure customer row exists, then insert marketplace job ===
  if(currentUser){
    var custRow={id:currentUser.id,full_name:S.custUser.name,email:S.custUser.email,phone:S.custUser.phone||'',address:S.custUser.addr||'',house_number:S.custUser.houseNumber||'',postcode:S.custUser.postcode||''};
    sb.from('customers').upsert(custRow,{onConflict:'id'}).then(function(uRes){
      if(uRes.error){console.log('Customer upsert error:',uRes.error.message)}
      var custHouseNum=custPostData.houseNumber||S.custUser.houseNumber||'';
      var custPostcode=S.custUser.postcode||'';
      var mjData={
        customer_id:currentUser.id,
        customer_name:S.custUser.name,
        customer_email:S.custUser.email,
        customer_phone:S.custUser.phone||'',
        address:nj.addr,
        house_number:custHouseNum,
        postcode:custPostcode,
        description:nj.type+' — '+nj.desc,
        is_emergency:nj.priority==='emergency',
        price:finalPrice,
        price_type:feeType,
        note:nj.desc,
        status:'new',
        preferred_slots:prefSlots
      };
      // === LEAD ENGINEER PRIORITY ROUTING ===
      // If no specific engineer requested, check postcode for area lead
      if(!custPostData._acceptedEngineerId&&custPostcode){
        var pcPrefix=custPostcode.replace(/\s+/g,'').toUpperCase().replace(/[0-9].*$/,'');
        console.log('Priority routing: postcode prefix =',pcPrefix);
        sb.from('engineers').select('id,full_name,lead_area').eq('status','approved').not('lead_area','is',null).then(function(engRes){
          if(engRes.data&&engRes.data.length>0){
            for(var ei=0;ei<engRes.data.length;ei++){
              var eng=engRes.data[ei];
              var areas=(eng.lead_area||'').split(',').map(function(a){return a.trim().toUpperCase()});
              if(areas.indexOf(pcPrefix)!==-1){
                mjData.preferred_engineer_id=eng.id;
                mjData.preferred_engineer_name=eng.full_name;
                mjData.priority_expires_at=new Date(Date.now()+60*60*1000).toISOString();
                console.log('Priority routing: lead engineer =',eng.full_name,'for',pcPrefix,'- 1hr priority');
                break;
              }
            }
          }
          sb.from('marketplace_jobs').insert(mjData).select().single().then(function(res){
            if(res.data){marketJob.id=res.data.id;nj.id=res.data.id;console.log('Marketplace job created:',res.data.id)}
            if(res.error){console.log('Marketplace insert error:',res.error.message,res.error.details);toast('error','Failed to post job: '+res.error.message)}
          });
        });
      }else{
        // Customer requested specific engineer or no postcode — insert directly
        if(custPostData._acceptedEngineerId){
          mjData.preferred_engineer_id=custPostData._acceptedEngineerId;
          mjData.preferred_engineer_name=custPostData._acceptedEngineerName||'';
          // No priority_expires_at — direct assignment stays until accepted/rejected
          console.log('Direct engineer request:',custPostData._acceptedEngineerName,'(',custPostData._acceptedEngineerId,')');
        }
        sb.from('marketplace_jobs').insert(mjData).select().single().then(function(res){
          if(res.data){marketJob.id=res.data.id;nj.id=res.data.id;console.log('Marketplace job created:',res.data.id)}
          if(res.error){console.log('Marketplace insert error:',res.error.message,res.error.details);toast('error','Failed to post job: '+res.error.message)}
        });
      }
    });
  }
  custPostStep=1;custPostData={type:'',desc:'',photos:0,addr:'',date:'',time:'',budget:'standard',customPrice:0,priority:'normal',preferredSlots:[],_acceptedEngineerId:null,_acceptedEngineerName:null};
  toast('success','Payment held securely by Stripe! Nearby engineers are being notified.');
  go('custMyJobs');
}

function custAcceptQuote(quoteId){
  var qi=custQuotes.findIndex(function(q){return q.id===quoteId});
  if(qi===-1){toast('error','Quote not found');return}
  var q=custQuotes[qi];
  if(window._custSelectedSlot===null||window._custSelectedSlot===undefined){toast('error','Please pick a date & time first');return}
  var chosenSlot=q.availableSlots[window._custSelectedSlot];
  if(!chosenSlot){toast('error','Invalid slot selected');return}
  // Update customer quote
  q.status='accepted';
  q.acceptedSlot=chosenSlot;
  // Update engineer quote
  var eq=engineerQuotes.find(function(x){return x.id===quoteId});
  if(eq){eq.status='accepted';eq.acceptedSlot=chosenSlot}
  // Save to Supabase
  updateQuoteStatusInSupabase(quoteId, 'accepted', chosenSlot, null, '');
  // Send message notification
  var cm=custMessages.find(function(m){return m.name===q.engineerName});
  if(cm){
    cm.thread.push({from:'me',text:'I\'ve accepted your quote for £'+q.total.toFixed(2)+'.\n\n📅 Preferred slot: '+fullDay(chosenSlot.date)+' '+fmtDateShort(chosenSlot.date)+' at '+chosenSlot.time+'\n\nPlease confirm this on your calendar.',time:'Just now',photos:[]});
    cm.lastTime='Just now';
  }
  // Also push notification to engineer messages
  var engMsg=messages.find(function(m){return m.marketJobId&&m.name===q.engineerName||m.thread.some(function(t){return t.text&&t.text.indexOf(quoteId)>-1})});
  if(!engMsg)engMsg=messages.find(function(m){return m.name===q.engineerName||m.marketJobId});
  if(engMsg){
    engMsg.thread.push({from:'cust',text:q.engineerName.split(' ')[0]+', I\'ve accepted your quote '+quoteId+' for £'+q.total.toFixed(2)+'!\n\n📅 Preferred slot: '+fullDay(chosenSlot.date)+' '+fmtDateShort(chosenSlot.date)+' at '+chosenSlot.time+'\n\nPlease confirm and add to your calendar.',time:'Just now',photos:[]});
    engMsg.lastTime='Just now';engMsg.unread=true;
  }
  window._custSelectedSlot=null;
  toast('success','Quote accepted! '+q.engineerName+' will confirm your appointment.');
  render();
}
function custDeclineQuote(quoteId){
  var qi=custQuotes.findIndex(function(q){return q.id===quoteId});
  if(qi===-1)return;
  var q=custQuotes[qi];
  q.status='declined';
  var eq=engineerQuotes.find(function(x){return x.id===quoteId});
  if(eq)eq.status='declined';
  updateQuoteStatusInSupabase(quoteId, 'declined', null, null, '');
  // Send message
  var cm=custMessages.find(function(m){return m.name===q.engineerName});
  if(cm){
    cm.thread.push({from:'me',text:'I\'ve decided not to go ahead with quote '+quoteId+' at this time. Thank you for the diagnosis.',time:'Just now',photos:[]});
    cm.lastTime='Just now';
  }
  window._custSelectedSlot=null;
  toast('info','Quote declined');
  go('custQuotes');
}

function custSendMessage(idx){
  var t=document.getElementById('cust-msg-input');if(!t||!t.value.trim())return;
  var msg=t.value.trim();var conv=custMessages[idx];if(!conv)return;
  conv.thread.push({from:'cust',text:msg,time:new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})});
  t.value='';render();
  // Save to Supabase via RPC
  if(currentUser&&conv._otherUserId){
    sb.rpc('send_message',{
      p_sender_id:currentUser.id,
      p_sender_role:'customer',
      p_other_user_id:conv._otherUserId,
      p_content:msg
    }).then(function(res){
      if(res.error){console.log('Cust send message error:',res.error.message)}
      else{
        console.log('Cust message sent via RPC:',res.data);
        if(res.data&&res.data.conversation_id){conv._convId=res.data.conversation_id}
      }
    });
  }
}
function payInvoiceNow(idx){

  toast('info','Online card payment for invoices is coming soon. Please pay your engineer using the details on your invoice, or message them to arrange payment. They will mark it as paid.');
  return;
  // Save to Supabase via RPC
  if(currentUser&&inv._supaId){
    sb.rpc('pay_invoice',{
      p_invoice_id:inv._supaId,
      p_paid_method:'bank_transfer',
      p_paid_reference:'CUST-'+currentUser.id.substring(0,8)
    }).then(function(res){
      if(res.error){console.log('Pay invoice error:',res.error.message)}
      else{console.log('Invoice paid via RPC:',res.data)}
    });
  }
}

function saveCustSettings(){
  var name=document.getElementById('cs-name')?document.getElementById('cs-name').value.trim():'';
  var phone=document.getElementById('cs-phone')?document.getElementById('cs-phone').value.trim():'';
  var addr=document.getElementById('cs-addr')?document.getElementById('cs-addr').value.trim():'';
  var house=document.getElementById('cs-house')?document.getElementById('cs-house').value.trim():'';
  var postcode=document.getElementById('cs-postcode')?document.getElementById('cs-postcode').value.trim():'';
  if(!name){toast('error','Name is required');return}
  S.custUser.name=name;S.custUser.phone=phone;S.custUser.addr=addr;S.custUser.houseNumber=house;S.custUser.postcode=postcode;
  if(currentUser){
    sb.from('customers').update({full_name:name,phone:phone,address:addr,house_number:house,postcode:postcode,updated_at:new Date().toISOString()}).eq('id',currentUser.id).select('id').then(function(res){
      if(res.error){toast('error','Failed to save: '+res.error.message);return}
      if(!res.data||res.data.length===0){toast('error','Could not save — please sign out and back in');return}
      toast('success','Settings saved');render();
    });
  } else {
    toast('success','Settings saved');render();
  }
}

var faultChatInitialised=false;
var faultDiagActive=null; // null or {flowId, step, answers:{}}
var faultFeedbackPending=false;

function initFaultChat(){
  if(faultChatInitialised)return;
  faultChatInitialised=true;
  var name=(S.engineer&&S.engineer.name)?S.engineer.name.split(' ')[0]:'mate';
  faultChatMessages=[
    {from:'bot',text:'Welcome, <strong>'+name+'</strong>! What are we fixing today? 🔧',time:fmtTime()},
    {from:'bot',text:'Just a heads up — I\'m here to <strong>guide you</strong> based on the data I\'ve got, but <strong>you\'re the expert</strong> behind the fix. I\'m not perfect and I\'m always learning.\n\nI learn from you just as you learn from me — after we crack a fault together, I\'ll ask what you found so I can help the next engineer even better.\n\nDescribe the problem, type a fault code, or just tell me what\'s going on.',time:fmtTime()}
  ];
}
function fmtTime(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

function faultChatSend(){
  var input=document.getElementById('faultChatInput');if(!input)return;
  var msg=input.value.trim();if(!msg)return;
  input.value='';
  faultChatMessages.push({from:'user',text:msg,time:fmtTime()});
  render();
  setTimeout(function(){var c=document.getElementById('faultChatBody');if(c)c.scrollTop=c.scrollHeight},50);
  // Process with delay for natural feel
  setTimeout(function(){
    var responses=processUserMessage(msg);
    showBotResponses(responses);
  },500);
}
function showBotResponses(responses){
  responses.forEach(function(r,i){
    setTimeout(function(){
      faultChatMessages.push({from:'bot',text:r,time:fmtTime()});
      render();
      var c=document.getElementById('faultChatBody');if(c)c.scrollTop=c.scrollHeight;
    },i*400+200);
  });
}

function processUserMessage(msg){
  var q=msg.toLowerCase().replace(/[^a-z0-9\s.]/g,'').trim();

  // === Handle feedback flow ===
  if(faultFeedbackPending){
    var ql=q;
    if(ql.indexOf('yes')!==-1||ql.indexOf('sure')!==-1||ql.indexOf('yeah')!==-1||ql.indexOf('ok')!==-1||ql.indexOf('go on')!==-1){
      faultFeedbackPending=false;
      faultChatState='awaiting_fix_detail';
      return ['Brilliant! Tell me:\n\n1. <strong>What was the actual problem?</strong>\n2. <strong>How did you fix it?</strong>\n\nJust describe it naturally — e.g. "Diverter valve was stuck, replaced the motor head and it sorted it."'];
    }
    if(ql.indexOf('no')!==-1||ql.indexOf('skip')!==-1||ql.indexOf('nah')!==-1||ql.indexOf('not now')!==-1){
      faultFeedbackPending=false;
      faultChatState='idle';
      faultDiagActive=null;
      return ['No worries at all! I\'m here whenever you need me. What else can I help with? 🔧'];
    }
    faultFeedbackPending=false;
    faultChatState='awaiting_fix_detail';
    return ['Tell me what the problem was and how you fixed it — I\'ll remember it for next time.'];
  }

  // === Handle fix detail submission (learning) ===
  if(faultChatState==='awaiting_fix_detail'){
    if(msg.length<10){
      return ['Can you give me a bit more detail? Even a short sentence like "Replaced the diverter valve motor" helps me learn.'];
    }
    var engName=(S.engineer&&S.engineer.name)?S.engineer.name:'Unknown';
    var learned={problem:faultChatContext.lastQuery||'General',brand:faultChatContext.brand||'',solution:msg,engineer:engName,date:localDateKey(new Date())};
    faultChatLearned.push(learned);
    // Also add to faultCodesDB so it shows up in future searches
    var learnedKeywords=msg.toLowerCase().split(/\s+/).filter(function(w){return w.length>3});
    learnedKeywords=learnedKeywords.concat((faultChatContext.lastQuery||'').toLowerCase().split(/\s+/).filter(function(w){return w.length>3}));
    faultCodesDB.push({brand:faultChatContext.brand||'Community',model:'Engineer Fix',code:'—',desc:faultChatContext.lastQuery||'Engineer-reported fix',fix:msg+' (Shared by '+engName+' on '+learned.date+')',severity:'medium',time:'Varies',keywords:learnedKeywords,learned:true});
    faultChatState='idle';
    faultDiagActive=null;
    faultChatContext={symptom:'',brand:'',pressure:'',details:'',lastResults:[],lastQuery:''};
    return ['🙏 Thanks, <strong>'+engName.split(' ')[0]+'</strong>! I\'ve saved that to my knowledge base. Next time an engineer hits this problem, your fix will be part of what I suggest.\n\n<strong>'+faultChatLearned.length+'</strong> fix'+(faultChatLearned.length!==1?'es':'')+' learned from engineers so far.\n\nWhat else can I help with?'];
  }

  // === Handle active diagnostic flow ===
  if(faultDiagActive){
    var flow=faultDiagFlows[faultDiagActive.flowId];
    if(faultDiagActive.step<flow.questions.length){
      var currentQ=flow.questions[faultDiagActive.step];
      faultDiagActive.answers[currentQ.field]=msg;
      // Check if they gave a brand name
      var brands=['vaillant','worcester','baxi','ideal'];
      brands.forEach(function(b){if(q.indexOf(b)!==-1)faultChatContext.brand=b.charAt(0).toUpperCase()+b.slice(1)});
      // Check if they gave a fault code directly
      var directCode=extractFaultCode(q);
      if(directCode){
        faultDiagActive=null;
        return handleFaultCodeLookup(directCode,q);
      }
      faultDiagActive.step++;
      if(faultDiagActive.step<flow.questions.length){
        // Ask next question
        return ['Got it. '+flow.questions[faultDiagActive.step].q];
      }
    }
    // All questions answered — give diagnosis
    return giveDiagnosis();
  }

  // === Check for exact fault code ===
  var directCode=extractFaultCode(q);
  if(directCode){
    return handleFaultCodeLookup(directCode,q);
  }

  // === Detect symptom and start diagnostic flow ===
  var detectedSymptom=null;
  faultSymptomPatterns.forEach(function(sp){
    if(detectedSymptom)return;
    sp.patterns.forEach(function(p){
      if(q.indexOf(p)!==-1)detectedSymptom=sp.id;
    });
  });

  // Check for emergency first
  if(q.indexOf('gas smell')!==-1||q.indexOf('smell gas')!==-1||q.indexOf('gas leak')!==-1){
    return ['🔴 <strong>SAFETY FIRST!</strong>\n\n1. Open all windows immediately\n2. Do NOT operate any switches or flames\n3. Turn off gas at the meter\n4. Call <strong>Gas Emergency: 0800 111 999</strong>\n5. Do NOT attempt repair until area is safe\n\nYou know the drill — safety always comes first. Once the area is safe, we can look at the cause.'];
  }
  if(q.indexOf('co alarm')!==-1||q.indexOf('carbon monoxide')!==-1||q.indexOf('co detector')!==-1){
    return ['🔴 <strong>CARBON MONOXIDE — EVACUATE!</strong>\n\n1. Open all windows and doors\n2. Turn off boiler and ALL gas appliances\n3. <strong>Evacuate the property</strong>\n4. Call <strong>Gas Emergency: 0800 111 999</strong>\n5. Do NOT re-enter until cleared\n\nCO is odourless and lethal. You already know this — act fast.'];
  }

  if(detectedSymptom&&faultDiagFlows[detectedSymptom]){
    var flow=faultDiagFlows[detectedSymptom];
    faultDiagActive={flowId:detectedSymptom,step:0,answers:{}};
    faultChatContext.symptom=detectedSymptom;
    faultChatContext.lastQuery=msg;
    return [flow.intro+'\n\nLet me ask you a few questions so I can give you the best possible guidance.',flow.questions[0].q];
  }

  // === Brand listing ===
  var mentionedBrand='';
  brands.forEach(function(b){if(q.indexOf(b)!==-1)mentionedBrand=b});
  if(mentionedBrand){
    var brandFaults=faultCodesDB.filter(function(f){return f.brand.toLowerCase()===mentionedBrand&&f.code!=='—'});
    if(brandFaults.length>0){
      var listMsg='Here are the <strong>'+brandFaults[0].brand+'</strong> fault codes I know:\n\n';
      brandFaults.forEach(function(f){
        var sevEmoji=f.severity==='critical'?'🔴':f.severity==='high'?'🟠':'🟢';
        listMsg+=sevEmoji+' <strong>'+f.code+'</strong> — '+f.desc+'\n';
      });
      var learnedForBrand=faultCodesDB.filter(function(f){return f.learned&&f.brand.toLowerCase()===mentionedBrand});
      if(learnedForBrand.length>0){
        listMsg+='\n📚 Plus <strong>'+learnedForBrand.length+'</strong> fix'+(learnedForBrand.length!==1?'es':'')+' contributed by engineers.';
      }
      listMsg+='\n\nAsk me about any specific code, or describe the symptom and I\'ll walk you through it.';
      return [listMsg];
    }
  }

  // === Help ===
  if(q.indexOf('help')!==-1||q.indexOf('what can')!==-1){
    return ['Here\'s what I can do:\n\n🔍 <strong>Fault codes</strong> — type "F.28", "E133", "EA 227"\n🩺 <strong>Symptoms</strong> — "no hot water", "losing pressure"\n📋 <strong>Brand codes</strong> — "Vaillant codes", "Baxi errors"\n🗣️ <strong>Plain English</strong> — just describe what\'s happening\n\nI\'ll ask you the right questions to narrow it down, then give you my best guidance. Remember, you\'re the expert — I\'m just here to help! 🔧'];
  }

  // === All codes list ===
  if(q.indexOf('all')!==-1&&(q.indexOf('code')!==-1||q.indexOf('list')!==-1)){
    var byBrand2={};
    faultCodesDB.forEach(function(f){if(f.code!=='—'){if(!byBrand2[f.brand])byBrand2[f.brand]=[];byBrand2[f.brand].push(f.code+' — '+f.desc)}});
    var listResp2='Here are all the fault codes I know:\n\n';
    Object.keys(byBrand2).forEach(function(b){listResp2+='<strong>'+b+':</strong>\n'+byBrand2[b].join('\n')+'\n\n'});
    if(faultChatLearned.length>0){listResp2+='📚 Plus <strong>'+faultChatLearned.length+'</strong> engineer-contributed fixes in my knowledge base.'}
    return [listResp2];
  }

  // === General keyword search fallback ===
  var scored2=[];
  faultCodesDB.forEach(function(f){
    var score=0;var words=q.split(/\s+/);
    f.keywords.forEach(function(kw){if(q.indexOf(kw)!==-1)score+=3;words.forEach(function(w){if(w.length>2&&kw.indexOf(w)!==-1)score+=1})});
    var descWords=f.desc.toLowerCase().split(/\s+/);
    descWords.forEach(function(dw){if(dw.length>3&&q.indexOf(dw)!==-1)score+=2});
    if(score>0)scored2.push({fault:f,score:score});
  });
  scored2.sort(function(a,b){return b.score-a.score});
  if(scored2.length>0){
    faultChatContext.lastQuery=msg;
    var top2=scored2.slice(0,3);
    var resp2=['I found some matches based on what you\'ve described:'];
    top2.forEach(function(s){
      var f=s.fault;
      var sevEmoji=f.severity==='critical'?'🔴':f.severity==='high'?'🟠':'🟢';
      var codeStr=f.code!=='—'?(' <strong>'+f.code+'</strong> —'):' ';
      var learnedTag=f.learned?' <span style="background:#DBEAFE;color:#1D4ED8;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700">ENGINEER FIX</span>':'';
      resp2.push(sevEmoji+codeStr+' '+f.brand+' '+f.model+learnedTag+'\n<strong>'+f.desc+'</strong>\n\n'+f.fix+'\n\n⏱ '+f.time);
    });
    resp2.push('Did any of those help? If you want, I can ask more specific questions to narrow it down. Or if you\'ve fixed it, I\'d love to hear what the actual problem was — it helps me learn! Just say <strong>"fixed it"</strong>.');
    faultFeedbackPending=false;
    return resp2;
  }

  // === Fallback ===
  return ['Hmm, I\'m not sure I follow. Try telling me:\n\n• The <strong>fault code</strong> on the display (e.g. "F.28")\n• The <strong>symptom</strong> (e.g. "no hot water", "losing pressure")\n• The <strong>boiler brand</strong> (e.g. "Vaillant")\n\nOr just describe what\'s happening in your own words — I\'ll ask the right questions to help figure it out. 🔧'];
}

function extractFaultCode(q){
  // Match common fault code patterns: F.28, F28, EA 227, EA227, E133, E119, FD, L1, etc.
  var patterns=[/\b(f\.?\d{1,3})\b/i,/\b(ea\s?\d{3})\b/i,/\b(e\d{2,3})\b/i,/\b(a\s?\d{3})\b/i,/\b(d1\s?\d{3})\b/i,/\b(h07\s?\d{3})\b/i,/\b(fd)\b/i,/\b(l[12c])\b/i,/\b(lc)\b/i];
  for(var i=0;i<patterns.length;i++){
    var m=q.match(patterns[i]);
    if(m)return m[1];
  }
  return null;
}

function handleFaultCodeLookup(code,q){
  var codeClean=code.toLowerCase().replace(/\s/g,'');
  var matches=faultCodesDB.filter(function(f){
    return f.code!=='—'&&(f.code.toLowerCase()===code.toLowerCase()||f.code.toLowerCase().replace(/[\s.]/g,'')===codeClean);
  });
  if(matches.length>0){
    faultChatContext.lastQuery=code;
    var resp=[];
    matches.forEach(function(f){
      var sevEmoji=f.severity==='critical'?'🔴':f.severity==='high'?'🟠':'🟢';
      faultChatContext.brand=f.brand;
      resp.push(sevEmoji+' <strong>'+f.code+'</strong> — '+f.brand+' '+f.model+'\n<strong>'+f.desc+'</strong>\n\n'+f.fix+'\n\n⏱ Estimated time: '+f.time);
    });
    // Check for engineer-learned fixes related to this code
    var learnedRelated=faultChatLearned.filter(function(l){return l.problem.toLowerCase().indexOf(codeClean)!==-1||l.problem.toLowerCase().indexOf(code.toLowerCase())!==-1});
    if(learnedRelated.length>0){
      var lMsg='📚 <strong>Engineer Tips</strong> (from the field):\n';
      learnedRelated.forEach(function(l){lMsg+='\n• '+l.solution+' <em>— '+l.engineer+', '+l.date+'</em>'});
      resp.push(lMsg);
    }
    resp.push('Remember, you know the boiler better than I do once you\'re in front of it. This is just a starting point.\n\nOnce you\'ve sorted it, let me know what the fix was — say <strong>"fixed it"</strong> and I\'ll learn from you! 🔧');
    faultFeedbackPending=false;
    return resp;
  }
  return ['I don\'t have <strong>'+code.toUpperCase()+'</strong> in my database yet. Can you tell me the boiler brand? That might help me find it.\n\nIf you end up solving it, please share the fix with me — say <strong>"fixed it"</strong> and I\'ll add it to my knowledge base for other engineers.'];
}

function giveDiagnosis(){
  var answers=faultDiagActive?faultDiagActive.answers:{};
  var flowId=faultDiagActive?faultDiagActive.flowId:'';
  var brand=faultChatContext.brand||'';
  var resp=[];
  resp.push('Thanks for those details. Based on what you\'ve told me, here\'s what I think:');
  // Build search from all the answers combined
  var allText=Object.values(answers).join(' ').toLowerCase()+' '+faultChatContext.symptom;
  if(brand)allText+=' '+brand.toLowerCase();
  // Check for any fault codes in the answers
  var codeInAnswers=null;
  Object.values(answers).forEach(function(a){
    var c=extractFaultCode(a.toLowerCase());
    if(c)codeInAnswers=c;
  });
  if(codeInAnswers){
    faultDiagActive=null;
    return handleFaultCodeLookup(codeInAnswers,allText);
  }
  // Score all faults against the combined context
  var scored3=[];
  faultCodesDB.forEach(function(f){
    var score=0;
    f.keywords.forEach(function(kw){if(allText.indexOf(kw)!==-1)score+=3});
    var descWords=f.desc.toLowerCase().split(/\s+/);
    descWords.forEach(function(dw){if(dw.length>3&&allText.indexOf(dw)!==-1)score+=2});
    if(brand&&f.brand.toLowerCase()===brand.toLowerCase())score+=4;
    if(brand&&f.brand.toLowerCase()!==brand.toLowerCase()&&f.brand!=='General'&&f.brand!=='Community')score-=2;
    if(score>2)scored3.push({fault:f,score:score});
  });
  scored3.sort(function(a,b){return b.score-a.score});
  if(scored3.length>0){
    var top3=scored3.slice(0,3);
    faultChatContext.lastResults=top3;
    top3.forEach(function(s){
      var f=s.fault;
      var sevEmoji=f.severity==='critical'?'🔴':f.severity==='high'?'🟠':'🟢';
      var codeStr=f.code!=='—'?('<strong>'+f.code+'</strong> — '):'';
      var learnedTag=f.learned?' <span style="background:#DBEAFE;color:#1D4ED8;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700">ENGINEER FIX</span>':'';
      resp.push(sevEmoji+' '+codeStr+f.brand+learnedTag+'\n<strong>'+f.desc+'</strong>\n\n'+f.fix);
    });
  } else {
    resp.push('I couldn\'t find a specific match in my database for this combination. It might be something I haven\'t encountered yet.');
  }
  resp.push('⚠️ <strong>Disclaimer:</strong> This is guidance only — you\'re the qualified engineer and the final call is always yours.\n\nDid this help you crack it? Once you\'ve fixed the issue, say <strong>"fixed it"</strong> and I\'ll ask you what the actual fix was. Your experience makes me smarter for every engineer who uses me next. 🙏');
  faultDiagActive=null;
  faultFeedbackPending=false;
  return resp;
}

function initAccountChat(){

  accountChatInitialised=true;
  var name=(S.engineer&&S.engineer.name)?S.engineer.name.split(' ')[0]:'there';
  accountChatMessages=[
    {from:'bot',text:'Hey <strong>'+name+'</strong>! 👋 Welcome to your Account Assistant.',time:fmtTime()},
    {from:'bot',text:'I know everything about your HomeLinq account — customers, jobs, invoices, quotes, certificates, expenses, and more.\n\nAsk me anything, like:\n• "Who owes me the most money?"\n• "Which day is my most profitable?"\n• "List customers whose service is due soon"\n• "How do I create a quote?"\n• "What\'s my total revenue this month?"\n\nI\'m your data, just ask. 📊',time:fmtTime()}
