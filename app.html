function _impStr(v){return v===undefined||v===null?'':String(v).trim()}
function _impPhone(v){
  var p=_impStr(v);if(!p)return '';
  if(/^[0-9oO\s+()\-]+$/.test(p))p=p.replace(/[oO]/g,'0');
  var digits=p.replace(/[^0-9]/g,'');
  if(p.charAt(0)!=='+'&&p.charAt(0)!=='0'&&digits.length===10&&digits.charAt(0)==='7')p='0'+p;
  if(p.charAt(0)!=='+'&&p.charAt(0)!=='0'&&digits.length===10&&(digits.charAt(0)==='1'||digits.charAt(0)==='2'))p='0'+p;
  return p;
}
function _impPhoneKey(v){var d=_impPhone(v).replace(/[^0-9]/g,'');if(d.indexOf('44')===0)d='0'+d.substring(2);return d.length>=10?d:''}
function _impMoney(v){var n=parseFloat(_impStr(v).replace(/[£$,\s]/g,''));return isNaN(n)?0:Math.round(n*100)/100}
function _impDate(v,fmt){
  var s=_impStr(v);if(!s)return null;
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s); // UK day/month/year
  if(m){var y=m[3].length===2?'20'+m[3]:m[3];var d=parseInt(m[1],10),mo=parseInt(m[2],10);if(fmt==='MDY'){var t0=d;d=mo;mo=t0}if(mo>12&&d<=12){var t=d;d=mo;mo=t}
    if(mo>=1&&mo<=12&&d>=1&&d<=31)return y+'-'+('0'+mo).slice(-2)+'-'+('0'+d).slice(-2)}
  var dt=new Date(s);if(!isNaN(dt.getTime()))return localDateKey(dt);
  return null;
}

function _wizParseFile(f){
  var file=f.file;var name=String(file.name||'').toLowerCase();
  var isExcel=/\.(xlsx|xlsm|xls)$/.test(name);
  if(isExcel){
    if(file.size>WIZ_MAX_XLS){f.status='error';f.error='Excel file too large (max 50 MB) — save it as CSV instead';render();return}
    f.status='reading';render();
    _loadSheetJS(function(err){
      if(err){f.status='error';f.error=err;render();return}
      var reader=new FileReader();
      reader.onload=function(e){
        try{
          var wb=window.XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
          var ws=wb.Sheets[wb.SheetNames[0]];
          var rows=window.XLSX.utils.sheet_to_json(ws,{defval:'',raw:false,dateNF:'yyyy-mm-dd'});
          _wizFileReady(f,rows.length?Object.keys(rows[0]):[],rows);
        }catch(ex){console.log('Excel parse error:',ex);f.status='error';f.error='Could not read this Excel file — try saving it as CSV';render()}
      };
      reader.readAsArrayBuffer(file);
    });
    return;
  }
  if(!/\.(csv|txt|tsv)$/.test(name)){f.status='error';f.error='Not a CSV or Excel file';render();return}
  if(file.size>WIZ_MAX_CSV){f.status='error';f.error='File too large (max 100 MB)';render();return}
  f.status='reading';f.readPct=0;render();
  var rows=[];var fields=null;
  Papa.parse(file,{header:true,skipEmptyLines:'greedy',dynamicTyping:false,chunkSize:1024*1024,
    chunk:function(res){
      if(!fields&&res.meta&&res.meta.fields)fields=res.meta.fields;
      for(var k=0;k<res.data.length;k++)rows.push(res.data[k]);
      f.readPct=file.size?Math.min(99,Math.round((res.meta.cursor||0)*100/file.size)):0;
      var el=document.getElementById('wiz-read-'+f.id);if(el)el.textContent='Reading… '+f.readPct+'% ('+rows.length.toLocaleString()+' rows)';
    },
    complete:function(){_wizFileReady(f,fields||[],rows)},
    error:function(){f.status='error';f.error='Could not read this file';render()}
  });
}
function _wizFileReady(f,headers,rows){
  headers=headers.filter(function(h){return h!==undefined&&h!==null&&String(h).trim()!==''}).map(function(h){return String(h).trim()});
  rows=rows.filter(function(r){for(var k in r){if(r.hasOwnProperty(k)&&String(r[k]===null||r[k]===undefined?'':r[k]).trim()!=='')return true}return false});
  if(!headers.length||!rows.length){f.status='error';f.error='No rows found — is the first row the column headings?';render();return}
  f.type=_wizDetectType(headers);
  f.derived=_wizDerive(headers,rows);
  f.headers=headers;f.rows=rows;f.mapping=_impAutoMap(f.type,headers);f.status='ready';
  try{f.profile=_wizProfile(f)}catch(e){console.log('Profile error:',e)}
  render();
  _wizAnalyse(f);
}
// Many systems export first name / surname and address lines separately: add combined columns so a whole name and address are imported
function _wizDerive(headers,rows){
  var n=headers.map(_impNorm),added=[];
  function find(list){for(var k=0;k<list.length;k++){for(var i=0;i<n.length;i++){if(n[i]===list[k])return headers[i]}}return null}
  var first=find(['firstname','forename','forenames','givenname','contactfirst','contactfirstname','customerfirstname','first']);
  var last=find(['surname','lastname','familyname','contactlast','contactlastname','customersurname','customerlastname','last']);
  var full=find(['name','fullname','customername','clientname','contactname','contact']);
  if(first&&last&&!full){
    rows.forEach(function(r){r['Full name (combined)']=[_impStr(r[first]),_impStr(r[last])].filter(function(x){return x}).join(' ')});
    headers.push('Full name (combined)');added.push('Full name (combined)');
  }
  var parts=[find(['addressline1','address1','street','billingaddress','siteaddressline1','address']),find(['addressline2','address2','billingaddress2','siteaddressline2']),
    find(['addressline3','address3','locality','district']),find(['town','city','towncity','billingcity','suburb','billingsuburb']),find(['county','region','state'])].filter(function(x){return x});
  if(parts.length>=2){
    rows.forEach(function(r){var seen={};r['Full address (combined)']=parts.map(function(p){return _impStr(r[p])}).filter(function(x){var k=x.toLowerCase();if(!x||seen[k])return false;seen[k]=1;return true}).join(', ')});
    headers.push('Full address (combined)');added.push('Full address (combined)');
  }
  // certificates: property address + separate property postcode
  var pa=find(['propertyaddress','installationaddress','siteaddress']),pp=find(['propertypostcode','installationpostcode','sitepostcode']);
  if(pa&&pp){
    rows.forEach(function(r){var a=_impStr(r[pa]),c=_impStr(r[pp]);r['Property address (combined)']=c&&a.toUpperCase().replace(/\s/g,'').indexOf(c.toUpperCase().replace(/\s/g,''))===-1?(a?a+', ':'')+c.toUpperCase():a});
    headers.push('Property address (combined)');added.push('Property address (combined)');
  }
  return added;
}

  bad_amount:'Amount can\'t be read',no_prop:'No property address',no_desc:'No description',no_amount:'No amount',
  zero_total:'Total is £0',negative:'Negative amount',vat_gt_total:'VAT is more than the total',future_date:'Date is in the future',
  old_date:'Very old date',expiry_before_issue:'Expiry is before the issue date',bad_email:'Email looks wrong',bad_phone:'Phone looks wrong',
  bad_postcode:'Postcode looks wrong',date_dropped:'A date can\'t be read — it will be left empty',bad_price:'Price can\'t be read — saved as £0',bad_vat:'VAT can\'t be read — saved as £0',no_cert_date:'No issue or expiry date',expiry_assumed:'No expiry date — set to 1 year after issue',issue_assumed:'No issue date — set to 1 year before expiry',dup_existing:'Already in HomeLinq',dup_file:'Appears earlier in your files'};

function _wizMoney(v){
  var s=_impStr(v);if(!s)return {e:true,v:0};
  var c=s.replace(/[£$€,\s]|gbp|inc\.?|vat/gi,'');var neg=false;
  if(/^\(.*\)$/.test(c)){neg=true;c=c.slice(1,-1)}

  var n=Math.round(parseFloat(c)*100)/100;return {v:neg?-n:n};
}
function _wizAddYears(d,n){var p=String(d).split('-');var dd=p[2];if(p[1]==='02'&&dd==='29')dd='28';return (parseInt(p[0],10)+n)+'-'+p[1]+'-'+dd}

// Existing records, read 1,000 at a time so duplicates are checked against everything already in HomeLinq
function _wizFetchAll(table,cols,cb){
  var out=[],from=0;
  (function next(){
    sb.from(table).select(cols).eq('engineer_id',currentUser.id).order('id').range(from,from+999).then(function(res){
      if(res.error){cb(res.error,out);return}
      var d=res.data||[];out=out.concat(d);
      if(d.length<1000){cb(null,out);return}
      from+=1000;next();
    });
  })();
}

// Check every file in import order with one shared context (so customers files feed the linking of later files)
function _wizValidateAll(){
  var ex=wiz.existing;if(!ex)return;
  var seen={customers:{},jobs:{},invoices:{},certificates:{},expenses:{}};var known={};
  Object.keys(ex.names).forEach(function(k){known[k]=ex.names[k]});
  var files=wiz.files.filter(function(f){return f.status==='ready'&&!f.skipped});
  files.sort(function(a,b){return WIZ_ORDER.indexOf(a.type)-WIZ_ORDER.indexOf(b.type)});
  files.forEach(function(f){
    var exk=ex.keys[f.type],sk=seen[f.type],rv=[];
    for(var ix=0;ix<f.rows.length;ix++){
      var o=_wizRow(f,f.rows[ix],ix);var v={r:o.r,cname:o.cname,amt:o.amount,dt:o.date,paid:!!o.paid};
      if(o.bad){v.s='bad'}
      else{
        for(var k=0;k<o.keys.length;k++){var key=o.keys[k];
          if(exk[key]!==undefined){v.s='dup';v.dupOf='existing';if(f.type==='customers')v.dupId=exk[key];break}
          if(sk[key]){v.s='dup';v.dupOf='file';break}}
        if(v.s==='dup')v.r=o.r.concat([v.dupOf==='existing'?'dup_existing':'dup_file']);
        else{v.s=o.r.length?'warn':'ok';o.keys.forEach(function(key){sk[key]=1})}
        if(f.type==='customers'&&o.cname){var nk=_wizNameKey(o.cname);if(nk&&!known[nk])known[nk]=o.cname}
      }
      rv.push(v);
    }
    f.rv=rv;
  });
  files.forEach(function(f){_wizRecount(f,known)});
}
function _wizIncluded(f,ix){
  var v=f.rv[ix];if(!v||v.s==='bad')return false;
  if(f.rowSel&&f.rowSel[ix]!==undefined)return f.rowSel[ix];
  if(v.s==='dup'){var mode=f.dupMode||'skip';return mode==='import'||(mode==='fill'&&v.dupOf==='existing'&&f.type==='customers')}
  return true;
}
function _wizIsFill(f,ix){var v=f.rv[ix];return v&&v.s==='dup'&&v.dupOf==='existing'&&f.type==='customers'&&(f.dupMode||'skip')==='fill'&&_wizIncluded(f,ix)}
function _wizRecount(f,known){
  var c={ok:0,warn:0,bad:0,dup:0,excluded:0,included:0,fill:0},reasons={},tot={sum:0,paid:0,unpaid:0,from:null,to:null};
  var unmatched={},matched=0,linkable=f.type==='jobs'||f.type==='invoices'||f.type==='certificates';
  if(known)f._known=known;known=f._known||{};
  for(var ix=0;ix<f.rv.length;ix++){
    var v=f.rv[ix];c[v.s]++;v.r.forEach(function(x){reasons[x]=(reasons[x]||0)+1});
    var inc=_wizIncluded(f,ix);
    if(!inc){if(v.s!=='bad'&&(v.s!=='dup'||(f.rowSel&&f.rowSel[ix]===false)))c.excluded++;continue}
    if(_wizIsFill(f,ix)){c.fill++;continue}
    c.included++;
    if(v.amt){tot.sum+=v.amt;if(f.type==='invoices'){if(v.paid)tot.paid+=v.amt;else tot.unpaid+=v.amt}}
    if(v.dt){if(!tot.from||v.dt<tot.from)tot.from=v.dt;if(!tot.to||v.dt>tot.to)tot.to=v.dt}
    if(linkable&&v.cname){var nk=_wizNameKey(v.cname);if(known[nk])matched++;else{if(!unmatched[nk])unmatched[nk]={name:v.cname,n:0};unmatched[nk].n++}}
  }
  ['sum','paid','unpaid'].forEach(function(k){tot[k]=Math.round(tot[k]*100)/100});
  f.rvStat={c:c,reasons:reasons,tot:tot,matched:matched,unmatched:unmatched,near:linkable?_wizNear(unmatched,known):[]};
}
// "J Smith" vs "John Smith": same surname, compatible first name
function _wizNear(unmatched,known){
  var bySur={};Object.keys(known).forEach(function(k){var t=k.split(' ');if(t.length<2)return;var s=t[t.length-1];(bySur[s]=bySur[s]||[]).push(k)});
  var out=[];
  Object.keys(unmatched).forEach(function(u){
    var t=u.split(' ');if(t.length<2)return;var cands=bySur[t[t.length-1]]||[];
    for(var i=0;i<cands.length;i++){var a=t[0],b=cands[i].split(' ')[0];
      if(a.charAt(0)===b.charAt(0)&&(a.length===1||b.length===1||a.indexOf(b)===0||b.indexOf(a)===0)){out.push({key:u,name:unmatched[u].name,n:unmatched[u].n,to:known[cands[i]]});break}}
  });
  out.sort(function(x,y){return y.n-x.n});
  return out.slice(0,50);
}
function _wizReviewSummary(){
  return wiz.files.filter(function(f){return f.status==='ready'&&!f.skipped&&f.rvStat}).map(function(f){

            if(e.code==='23505'&&ch._net&&ch.length===1){r.imported+=1;tick(1);nextChunk();return}
            // Data problem: split the batch so only the faulty row(s) fail
            if(ch.length>1){var mid=Math.ceil(ch.length/2);var a=ch.slice(0,mid),b=ch.slice(mid);a._net=b._net=ch._net;q.unshift(b);q.unshift(a);nextChunk();return}
            r.failed+=1;r.error=e.message;if(r.failedRows.length<50)r.failedRows.push({row:ch[0]._row,error:String(e.message||'').substring(0,160)});
            console.log('Import row error (row '+ch[0]._row+'):',e.message);tick(1);nextChunk();
          });
        })();
      }
      var fi=0;
      function nextFill(){
        if(fi>=fills.length){_wizSaveProgress();nextFile();return}
        var it=fills[fi++];var cur=wiz.existing.cust[it.id]||{};var patch=_wizFillPatch(cur,it.rec);
        if(!Object.keys(patch).length){r.skipped++;tick(1);nextFill();return}
        (function attemptFill(tries){
          sb.from('engineer_customers').update(patch).eq('id',it.id).then(function(res3){
            if(res3.error&&_wizIsNetErr(res3.error)&&tries<3){setTimeout(function(){attemptFill(tries+1)},2000*Math.pow(2,tries));return}
            if(res3.error){r.failed++;r.error=res3.error.message}else{r.updated++;wiz.fillsDone.push({id:it.id,f:patch});for(var k in patch)cur[k]=patch[k]}
            tick(1);nextFill();
          });
        })(0);
      }
      nextChunk();
    }
    nextFile();
  });
}

// ===== M2: Moti analysis (only headings + masked samples leave the browser) =====
var WIZ_PII_HEADERS=['name','email','mail','phone','mobile','tel','address','street','road','postcode','post','contact','tenant','landlord','customer','client','recipient','owner','occupier','town','city'];
function _wizIsPiiHeader(h){var n=_impNorm(h);for(var i=0;i<WIZ_PII_HEADERS.length;i++){if(n.indexOf(WIZ_PII_HEADERS[i])!==-1)return true}return false}
function _wizMaskValue(v,header){
  var s=_impStr(v);if(!s)return '';
  if(s.indexOf('@')>0){var at=s.indexOf('@');return s.charAt(0)+'***'+s.substring(at)}
  var digits=s.replace(/[^0-9]/g,'');
  if(digits.length>=7&&/^[0-9+()\s\-oO]+$/.test(s))return digits.substring(0,2)+'*** ***'+digits.substring(digits.length-3);
  if(/^[A-Za-z]{1,2}[0-9][A-Za-z0-9]?\s*[0-9][A-Za-z]{2}$/.test(s))return s.replace(/\s*[0-9][A-Za-z]{2}$/,'')+' ***';
  if(_wizIsPiiHeader(header))return s.split(/\s+/).map(function(w){return /^[0-9]+$/.test(w)?w:(w.charAt(0)+'***')}).join(' ');
  return s.substring(0,40);
}
function _wizMaskedSamples(f){
  var out=[];
  for(var i=0;i<f.rows.length&&out.length<5;i++){
    var r=f.rows[i];var o={};
    f.headers.forEach(function(h){o[h]=_wizMaskValue(r[h],h)});
    out.push(o);
  }
  return out;
}
function _wizAnalyse(f){

    }).then(function(r){return r.json()}).then(function(res){
      if(!res||res.error){f.ai={status:'failed',error:(res&&res.error)||'Moti unavailable'};render();_wizMaybeOpenChat();return}
      if(!f.typeLocked&&res.record_type&&IMPORT_TYPES[res.record_type]&&res.record_type!==f.type){f.type=res.record_type;f.mapping=_impAutoMap(f.type,f.headers)}

// ===== M2.5: column profiles — worked out on this device; no personal details leave it =====
function _wizKind(s){
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s))return 'email';
  if(/^[A-Za-z]{1,2}[0-9][A-Za-z0-9]?\s*[0-9][A-Za-z]{2}$/.test(s))return 'postcode';
  if(/^\d{4}-\d{1,2}-\d{1,2}/.test(s)||/^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}(\s|$|T)/.test(s))return 'date';
  if(/^[£$€]?\s*-?[\d,]+(\.\d+)?$/.test(s)&&s.replace(/[^0-9]/g,'').length<10)return 'number';
  if(/^[0-9+()\s\-]{7,}$/.test(s)&&s.replace(/[^0-9]/g,'').length>=9)return 'phone';
  if(/^(yes|no|true|false|y|n)$/i.test(s))return 'yesno';
  return 'text';
}
var WIZ_VALUE_HEADERS=/status|type|category|result|method|stage|priority|paid|appliance|make|model|service|kind|trade/i;
function _wizSafeValue(s,header){
  if(!WIZ_VALUE_HEADERS.test(header)&&/^[A-Z][a-z'\-]+(\s+[A-Z][a-z'\-]+)+$/.test(s))return s.split(/\s+/).map(function(w){return w.charAt(0)+'***'}).join(' ');
  return s;
}
function _wizProfile(f){
  var n=f.rows.length,step=n>20000?Math.ceil(n/20000):1,cols={},seen=0,i,j;
  f.headers.forEach(function(h){cols[h]={filled:0,kinds:{},distinct:{},dcount:0,dcap:false,min:null,max:null,zeros:0,neg:0,dmin:null,dmax:null,dfirst:0,dsecond:0,dslash:0,diso:0,len:0}});
  for(i=0;i<n;i+=step){
    seen++;var r=f.rows[i];
    for(j=0;j<f.headers.length;j++){
      var h=f.headers[j],c=cols[h],s=_impStr(r[h]);if(!s)continue;
      c.filled++;c.len+=s.length;var k=_wizKind(s);c.kinds[k]=(c.kinds[k]||0)+1;
      if(!c.dcap){if(c.distinct[s]===undefined){c.distinct[s]=1;c.dcount++;if(c.dcount>25000){c.dcap=true;c.distinct=null}}else{c.distinct[s]++}}
      if(k==='number'){var v=_impMoney(s);if(c.min===null||v<c.min)c.min=v;if(c.max===null||v>c.max)c.max=v;if(v===0)c.zeros++;if(v<0)c.neg++}
      else if(k==='date'){
        var m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s);
        if(m){c.dslash++;if(parseInt(m[1],10)>12)c.dfirst++;if(parseInt(m[2],10)>12)c.dsecond++}else{c.diso++}
        var iso=_impDate(s,f.dateFormat||'DMY');if(iso){if(!c.dmin||iso<c.dmin)c.dmin=iso;if(!c.dmax||iso>c.dmax)c.dmax=iso}
      }
    }
  }
  var out={};
  f.headers.forEach(function(h){
    var c=cols[h],kind='empty',best=0;
    Object.keys(c.kinds).forEach(function(k){if(c.kinds[k]>best){best=c.kinds[k];kind=k}});
    var personal=_wizIsPiiHeader(h)||kind==='email'||kind==='phone'||kind==='postcode';
    var p={filled_pct:seen?Math.round(c.filled*100/seen):0,kind:kind};
    if(c.filled){
      p.avg_len=Math.round(c.len/c.filled);
      if(best<c.filled*0.9){p.kinds={};Object.keys(c.kinds).forEach(function(k){p.kinds[k]=Math.round(c.kinds[k]*100/c.filled)})}
      p.distinct=c.dcap?'25000+':c.dcount;
      p.unique_pct=c.dcap?100:Math.round(c.dcount*100/c.filled);
    }
    if(personal){p.personal=true}
    else if(c.filled){
      if(kind==='number'){p.min=c.min;p.max=c.max;p.zeros=Math.round(c.zeros*step);if(c.neg)p.negatives=Math.round(c.neg*step)}
      if(kind==='date'){p.from=c.dmin;p.to=c.dmax;
        p.date_hint=c.dslash?(c.dfirst&&!c.dsecond?'DMY':(c.dsecond&&!c.dfirst?'MDY':(!c.dfirst&&!c.dsecond?'ambiguous':'mixed'))):(c.diso?'YMD':'')}
      if(!c.dcap&&c.dcount<=15&&kind!=='date'){
        p.top_values=Object.keys(c.distinct).filter(function(v){return v.length<=40}).sort(function(a,b){return c.distinct[b]-c.distinct[a]}).slice(0,12)
          .map(function(v){return [_wizSafeValue(v,h),Math.round(c.distinct[v]*step)]});
      }
    }
    out[h]=p;
  });
  return {rows:n,sampled_every:step,columns:out};
}
function _wizKey(v){return _impStr(v).toLowerCase().replace(/\s+/g,' ')}
function _wizLinks(){
  var files=wiz.files.filter(function(f){return f.status==='ready'&&!f.skipped&&f.profile});
  var res=[];
  files.forEach(function(T){
    if(T.type!=='customers')return; // links attach records to a customers file
    var keys=T.headers.filter(function(h){var p=T.profile.columns[h];return p&&p.filled_pct>=50&&p.unique_pct>=90&&p.kind!=='date'&&(p.distinct==='25000+'||p.distinct>=5)}).slice(0,8);
    keys.forEach(function(tk){
      var set={};T.rows.forEach(function(r){var k=_wizKey(r[tk]);if(k)set[k]=1});
      files.forEach(function(S){
        if(S===T)return;
        S.headers.forEach(function(sc){
          var p=S.profile.columns[sc];if(!p||p.filled_pct<30||p.kind==='date')return;
          var step=Math.max(1,Math.floor(S.rows.length/1000)),chk=0,hit=0;
          for(var i=0;i<S.rows.length&&chk<1000;i+=step){var k=_wizKey(S.rows[i][sc]);if(!k)continue;chk++;if(set[k])hit++}
          if(chk>=5&&hit/chk>=0.5)res.push({file_id:S.id,column:sc,target_file_id:T.id,target_column:tk,match_pct:Math.round(hit*100/chk)});
        });
      });
    });
  });
  res.sort(function(a,b){return b.match_pct-a.match_pct});
  return res.slice(0,10);
}

// ===== M2.5: one conversation with Moti for the whole import =====
function _wizChatInit(){if(!wiz.chat)wiz.chat={messages:[],memory:'',busy:false,started:false,draft:'',fileSig:''}}
function _wizFile(id){return wiz.files.find(function(x){return x.id===Number(id)})}
function _wizFileSig(){return wiz.files.filter(function(f){return f.status==='ready'}).map(function(f){return f.id}).join(',')}
function _wizFilesForMoti(){
  return wiz.files.filter(function(f){return f.status==='ready'}).map(function(f){
    return {file_id:f.id,name:f.name,rows:f.rows.length,type:f.type,type_chosen_by_engineer:!!f.typeLocked,skipped:!!f.skipped,date_format:f.dateFormat||null,
      mapping:f.mapping,missing_required:_wizMissing(f),linked:f.link||null,
      earlier_analysis:(f.ai&&f.ai.status==='done')?{software:f.ai.software,confidence:f.ai.confidence,notes:f.ai.notes,open_questions:(f.ai.questions||[]).map(function(q){return q.text})}:null,
      columns:f.profile?f.profile.columns:{},masked_samples:_wizMaskedSamples(f).slice(0,3)};
  });
}
function _wizScrollChat(focus){setTimeout(function(){var el=document.getElementById('wiz-chat');if(el)el.scrollTop=el.scrollHeight;if(focus){var i=document.getElementById('wiz-chat-in');if(i)i.focus()}},30)}
function _wizMaybeOpenChat(){

  if(wiz.files.some(function(f){return f.status==='ready'&&f.ai&&f.ai.status==='loading'}))return;
  var sig=_wizFileSig();
  if(!wiz.chat.started){wiz.chat.fileSig=sig;wizMotiSend(null);return}
  if(sig!==wiz.chat.fileSig){wiz.chat.fileSig=sig;wiz.chat.messages.push({role:'event',text:'Files changed — now '+wiz.files.filter(function(f){return f.status==='ready'}).length+' file(s)'});wizMotiSend(null)}
}
function wizMotiSend(text){
  _wizChatInit();var c=wiz.chat;if(c.busy)return;
  if(text!==null){text=String(text||'').trim();if(!text)return;c.messages.push({role:'you',text:text.substring(0,2000)});c.draft=''}
  c.started=true;c.busy=true;render();_wizScrollChat();
  var hist=c.messages.slice(-16).map(function(m){return {role:m.role==='moti'?'assistant':'user',text:m.role==='event'?('[Engineer action] '+m.text):(m.text||'')}});
  sb.auth.getSession().then(function(sRes){
    var token=(sRes.data&&sRes.data.session)?sRes.data.session.access_token:'';

      body:JSON.stringify({action:'converse',software:wiz.software||'unknown',files:_wizFilesForMoti(),links:_wizLinks(),memory:c.memory,history:hist})
    }).then(function(r){return r.json()});

var WIZ_DF_LABEL={DMY:'day/month/year',MDY:'month/day/year',YMD:'year-month-day'};
function _wizActionLabel(a){
  var f=_wizFile(a.file_id),fn=f?'"'+f.name+'"':'file',t;
  switch(a.kind){
    case 'set_type':return 'Treat '+fn+' as '+(IMPORT_TYPES[a.record_type]?IMPORT_TYPES[a.record_type].label:a.record_type);
    case 'set_mapping':return a.column?fn+': use column "'+a.column+'" for '+a.field:fn+': leave '+a.field+' empty';
    case 'set_date_format':return fn+': dates are '+(WIZ_DF_LABEL[a.date_format]||a.date_format);
    case 'skip_file':return 'Skip '+fn+' — don\'t import it';
    case 'include_file':return 'Include '+fn+' again';
    case 'link_files':t=_wizFile(a.target_file_id);return 'Link '+fn+' to customers in '+(t?'"'+t.name+'"':'file')+' where "'+a.column+'" = "'+a.target_column+'"';
    case 'map_value':return fn+': treat "'+a.from_value+'" as '+String(a.to_value).replace('_',' ');
  }
  return a.kind;
}
function _wizLink(f,col,t,tcol){
  if(!t||t.type!=='customers'||!t.mapping.name){toast('error','Linking needs a customers file with a name column');return false}
  if(f.headers.indexOf(col)===-1||t.headers.indexOf(tcol)===-1)return false;
  var idx={};t.rows.forEach(function(r){var k=_wizKey(r[tcol]);if(k&&!idx[k])idx[k]=r});
  var tm=t.mapping,fields=IMPORT_TYPES[f.type].fields,hits=0;
  var nameF=f.type==='certificates'?'recipientName':'customer',emailF=f.type==='certificates'?'recipientEmail':'email',addrF=f.type==='certificates'?'prop':'address';
  if(fields.indexOf(nameF)===-1){toast('error','This kind of file can\'t be linked to customers');return false}
  var plan=[['Linked customer',nameF,'name'],['Linked email',emailF,'email'],['Linked phone','phone','phone']];
  if(!f.mapping[addrF])plan.push(['Linked address',addrF,'address']);
  if(!f.mapping.postcode)plan.push(['Linked postcode','postcode','postcode']);
  plan=plan.filter(function(p){return fields.indexOf(p[1])!==-1&&tm[p[2]]});
  var cur={};plan.forEach(function(p){cur[p[1]]=f.mapping[p[1]]&&f.mapping[p[1]].indexOf('Linked ')!==0?f.mapping[p[1]]:''});
  f.rows.forEach(function(r){
    var tr=idx[_wizKey(r[col])];if(tr)hits++;
    plan.forEach(function(p){var v=tr?_impStr(tr[tm[p[2]]]):'';if(!v&&cur[p[1]])v=_impStr(r[cur[p[1]]]);r[p[0]]=v});
  });
  plan.forEach(function(p){if(f.headers.indexOf(p[0])===-1)f.headers.push(p[0]);f.mapping[p[1]]=p[0]});
  f.link={column:col,target_file_id:t.id,target_column:tcol,matched:hits};
  f.profile=_wizProfile(f);
  toast('success',hits.toLocaleString()+' of '+f.rows.length.toLocaleString()+' rows linked to a customer');
  return true;
}
function _wizApply(a){
  var f=_wizFile(a.file_id);if(!f)return false;
  switch(a.kind){
    case 'set_type':if(!IMPORT_TYPES[a.record_type])return false;f.type=a.record_type;f.typeLocked=true;f.mapping=_impAutoMap(f.type,f.headers);return true;
    case 'set_mapping':if(IMPORT_TYPES[f.type].fields.indexOf(a.field)===-1)return false;if(a.column&&f.headers.indexOf(a.column)===-1)return false;f.mapping[a.field]=a.column||'';return true;
    case 'set_date_format':if(!WIZ_DF_LABEL[a.date_format])return false;f.dateFormat=a.date_format;f.profile=_wizProfile(f);return true;
    case 'skip_file':f.skipped=true;return true;
    case 'include_file':f.skipped=false;return true;
    case 'link_files':return _wizLink(f,a.column,_wizFile(a.target_file_id),a.target_column);
    case 'map_value':
      var col=f.mapping[a.field];if(!col)return false;var n=0;
      f.rows.forEach(function(r){if(_impStr(r[col])===a.from_value){r[col]=a.to_value;n++}});
      f.profile=_wizProfile(f);toast('success',n.toLocaleString()+' rows updated');return n>0;
  }
  return false;
}
function wizApplyAction(mi,ai){
  var m=wiz.chat&&wiz.chat.messages[mi];if(!m||!m.actions)return;var a=m.actions[ai];if(!a||a.state!=='new')return;

function wizApplyAll(mi){var m=wiz.chat&&wiz.chat.messages[mi];if(!m||!m.actions)return;m.actions.forEach(function(a,ai){if(a.state==='new')wizApplyAction(mi,ai)})}

  var data=[];var filename='homelinq_'+type+'_'+localDateKey(new Date())+'.csv';
  if(type==='customers'){
    data=customers.map(function(c){return{Name:c.name,Email:c.email||'',Phone:c.phone||'',Address:c.address||'',Postcode:c.postcode||'',Company:c.company||''}});
  } else if(type==='jobs'){
    var allJ=getAllJobsFlat();
    data=allJ.map(function(j){return{Date:j._date||'',Customer:j.customer||'',Type:j.type||'',Description:j.desc||'',Address:j.address||'',Price:j.price||0,Parts:j.partsTotal||0,Status:j.status||'',Time:j.time||''}});
  } else if(type==='invoices'){
    data=invoices.map(function(inv){return{ID:inv.id,Customer:inv.customer||'',Date:inv.date||'',Total:inv.total||0,Status:inv.status||'',Email:inv.email||''}});
  } else if(type==='certificates'){
    data=cp12Certs.map(function(c){return{ID:c.id,Type:c.certType||'',Recipient:c.recipientName||c.tenant||c.landlord||'',Email:c.recipientEmail||'',Property:c.prop||'',Date:c.date||'',Expiry:c.expiry||'',Result:c.result||'',Sent:c.sent?'Yes':'No'}});
  } else if(type==='expenses'){
    booksQuickExport('expenses');return;
  } else if(type==='mileage'){
    booksQuickExport('mileage');return;
  }
  if(data.length===0){toast('error','No '+type+' data to export');return}
  var csv=Papa.unparse(data);
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var link=document.createElement('a');
  link.href=URL.createObjectURL(blob);link.download=filename;
  document.body.appendChild(link);link.click();document.body.removeChild(link);
  toast('success',data.length+' records exported to '+filename);
}

function downloadTemplate(type){
  var fields=IMPORT_TYPES[type].fields;
  var sample={};fields.forEach(function(f){sample[f]=''});
  var csv=Papa.unparse([sample]);
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var link=document.createElement('a');
  link.href=URL.createObjectURL(blob);link.download='homelinq_'+type+'_template.csv';
  document.body.appendChild(link);link.click();document.body.removeChild(link);
  toast('success','Template downloaded — fill it in and import!');
}

// ===== WRITE-BACK FUNCTIONS (save data to Supabase) =====
function saveJobToSupabase(job, dateKey) {
  if (!currentUser) {
    toast('error','Not signed in — job saved locally only. Sign in to sync.');
    job._needsSync=true;job._syncDateKey=dateKey;
    return;
  }
  var mkId=job._marketplaceId?String(job._marketplaceId):null;
  // Validate marketplace_job_id is a proper UUID before sending
  if(mkId&&(mkId.length<8||mkId.indexOf('-')===-1))mkId=null;
  var params={
    p_engineer_id: currentUser.id,
    p_job_number: job.jobNum || '',
    p_scheduled_date: dateKey || null,
    p_scheduled_time: job.time || '',
    p_time_to: job.timeTo || '',
    p_customer_name: job.cust || '',
    p_customer_email: job.custEmail || '',
    p_customer_phone: job.custPhone || '',
    p_address: job.addr || '',
    p_postcode: job.postcode || job._postcode || '',
    p_description: job.job || '',
    p_estimated_duration: job.dur || '',
    p_price: job.amt || 0,
    p_status: job.st || 'upcoming',
    p_miles: job.mi || 0,
    p_source: job.type || 'direct',
    p_company_name: job.company || '',
    p_company_ref: job.compRef || '',
    p_from_marketplace: job.fromMarketplace || false,
    p_marketplace_job_id: mkId,
    p_house_number: job.houseNumber || job._houseNumber || '',
    p_customer_id: job._marketCustId || null,
    p_parts: JSON.stringify(job.parts || []),
    p_engineer_customer_id: job.ecid || null
  };
  _saveJobRetry(params,job,dateKey,0);
}
function _saveJobRetry(params,job,dateKey,attempt){
  sb.rpc('save_engineer_job',params).then(function(res){
    if(res.error){
      console.log('Save job RPC error (attempt '+(attempt+1)+'):',res.error.message);
      if(attempt<2){
        setTimeout(function(){_saveJobRetry(params,job,dateKey,attempt+1)},2000*(attempt+1));
      }else{
        toast('error','Job saved locally but failed to sync to cloud. Will retry on next load.');
        job._needsSync=true;
        job._syncDateKey=dateKey;
      }
    }else{
      console.log('Job saved via RPC:',res.data);
      scheduleCustomerReload();
      if(res.data&&res.data.job_id){job.id=res.data.job_id}
      job._needsSync=false;
    }
  });
}
// Recover unsynced jobs from offline cache on load
function _mergeOfflineJobs(){
  try{
    var key='hlq_offline_'+currentUser.id;
    var raw=localStorage.getItem(key);
    if(!raw)return;
    var data=JSON.parse(raw);
    if(!data||!data.allJobs)return;
    var offJobs=data.allJobs;
    var syncCount=0;
    var dbJobNums={};
    // Index all DB-loaded job numbers
    Object.keys(allJobs).forEach(function(dk){
      allJobs[dk].forEach(function(j){if(j.jobNum)dbJobNums[j.jobNum]=true});
    });
    Object.keys(offJobs).forEach(function(dk){
      offJobs[dk].forEach(function(oj){
        if(oj.jobNum&&!dbJobNums[oj.jobNum]){
          // Job in cache but not in DB — recover it
          if(!allJobs[dk])allJobs[dk]=[];
          allJobs[dk].push(oj);
          saveJobToSupabase(oj,dk);
          syncCount++;
        }
      });
    });
    if(syncCount>0){
      toast('warning',syncCount+' job'+(syncCount>1?'s':'')+' recovered from local cache and syncing to cloud.');
      render();
    }
  }catch(e){console.log('Merge offline jobs error:',e)}
}

function saveReminderToSupabase(rem,jobId){
  if(!currentUser)return;
  var dueDate=rem.dueDate||rem.due;
  // Parse "12 Aug 2027" format to ISO date
  if(dueDate&&dueDate.indexOf('-')===-1){
    var parts=dueDate.split(' ');
    var months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
    if(parts.length===3&&months[parts[1]]){dueDate=parts[2]+'-'+months[parts[1]]+'-'+(parts[0].length===1?'0'+parts[0]:parts[0])}
  }
  sb.from('reminders').insert({
    engineer_id:currentUser.id,
    customer_name:rem.cust||'',
    service_type:rem.svc||'',
    due_date:dueDate,
    message:rem.msg||'',
    channels:['sms','email','inapp'],
    status:'scheduled',
    job_id:jobId||null
  }).then(function(res){
    if(res.error)console.log('Reminder save error:',res.error.message);
    else console.log('Reminder saved to Supabase');
  });
}

    if(res.error){console.log('Load reminders error:',res.error.message);return}
    if(res.data&&res.data.length>0){
      reminders=res.data.map(function(r){
        var dueD=new Date(r.due_date);

        var dueStr=dueD.getDate()+' '+months[dueD.getMonth()]+' '+dueD.getFullYear();
        var now=new Date();
        var daysUntil=Math.ceil((dueD-now)/(1000*60*60*24));
        return{
          id:r.id,_supaId:r.id,cust:r.customer_name,svc:r.service_type||'Annual Service',
          due:dueStr,dueDate:r.due_date,daysUntil:daysUntil,

// ES5 UUID v4 generator
function genUUID(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}

function loadEngineerCustomers() {
  if (!currentUser || !sb) return;
  sb.from('engineer_customers').select('*').eq('engineer_id', currentUser.id).order('full_name', { ascending: true }).then(function(res) {
    if(res.error){console.log('Load customers error:',res.error.message);return}
    if (!res.data || !res.data.length) return;
    var dbNames={};
    var dbCustomers = res.data.map(function(c) {
      var _nm = c.full_name || '';
      dbNames[_nm.toLowerCase()]=true;
      return {
        id: c.id, _supaId: c.id, linkedCustomerId: c.linked_customer_id || null,
        name: _nm, ini: (_nm || 'XX').split(' ').map(function(w){return w[0]||''}).join('').substring(0,2).toUpperCase(),
        addr: c.address || '', email: c.email || '', phone: c.phone || '',
        postcode: c.postcode || '', houseNumber: c.house_number || '',
        boiler: c.boiler || '—', company: c.is_company ? _nm : '',
        contactPerson: c.contact_person || '', refPrefix: c.ref_prefix || '',
        last: '', next: '', jobs: 0, spent: 0, c: c.is_company ? 'purple' : 'teal', isCompany: !!c.is_company, hist: [],
        source: c.source || 'manual'
      };
    });
    var unsaved = customers.filter(function(c){
      var sid=String(c._supaId||c.id||'');
      return sid.indexOf('-')===-1 && !dbNames[String(c.name||'').toLowerCase()];
    });
    customers = dbCustomers.concat(unsaved);
    if (S.selCustomer && S.selCustomer._supaId) {
      var cur = customers.find(function(x){return x._supaId===S.selCustomer._supaId});
      if (cur) S.selCustomer = cur;
    }
    syncCustomerInvoices();
    render();
  });
}
var _custReloadTimer=null;
function scheduleCustomerReload(){
  if(_custReloadTimer)clearTimeout(_custReloadTimer);
  _custReloadTimer=setTimeout(loadEngineerCustomers,2000);
}
function _likeEsc(v){return String(v||'').replace(/[\\%_]/g,function(ch){return '\\'+ch})}
function saveCustomerToSupabase(cust) {
  if (!currentUser || !sb) return;
  var known = cust._supaId || (typeof cust.id === 'string' && cust.id.indexOf('-') > -1);
  if (!known) {
    // New customer: reuse an existing record with the same email (or same name) instead of creating a duplicate
    var em = String(cust.email || '').trim();
    var nm = String(cust.name || '').trim();
    var q = sb.from('engineer_customers').select('id').eq('engineer_id', currentUser.id).limit(1);
    q = em ? q.ilike('email', _likeEsc(em)) : q.ilike('full_name', _likeEsc(nm));
    q.then(function(fr) {
      if (!fr.error && fr.data && fr.data.length) {
        cust._supaId = fr.data[0].id;
        _saveCustomerRow(cust, true);
      } else if (em && nm) {
        sb.from('engineer_customers').select('id').eq('engineer_id', currentUser.id).ilike('full_name', _likeEsc(nm)).limit(1).then(function(fr2) {
          if (!fr2.error && fr2.data && fr2.data.length) { cust._supaId = fr2.data[0].id; _saveCustomerRow(cust, true); }
          else { _saveCustomerRow(cust, false); }
        });
      } else {
        _saveCustomerRow(cust, false);
      }
    });
    return;
  }
  _saveCustomerRow(cust, false);
}
function _saveCustomerRow(cust, mergeOnly) {
  var custId = cust._supaId || cust.id;
  // Ensure UUID format
  if (typeof custId !== 'string' || custId.indexOf('-') === -1) {
    custId = genUUID();
    cust._supaId = custId;
  }
  var row = {
    id: custId,
    engineer_id: currentUser.id,
    full_name: cust.name || '',
    email: cust.email || '',
    phone: cust.phone || '',
    address: cust.addr || cust.address || '',
    house_number: cust.houseNumber || '',
    postcode: cust.postcode || '',
    is_company: !!cust.isCompany,
    contact_person: cust.contactPerson || '',
    ref_prefix: cust.refPrefix || '',
    boiler: (cust.boiler && cust.boiler !== '—') ? cust.boiler : '',
    linked_customer_id: cust.linkedCustomerId || null,
    source: cust.source || 'manual',
    updated_at: new Date().toISOString()
  };
  if (mergeOnly) {
    // Existing record found: only fill in details that were provided, never blank out what is already saved
    var upd = {updated_at: row.updated_at};
    ['email','phone','address','house_number','postcode','contact_person','ref_prefix','boiler'].forEach(function(k){ if (row[k]) upd[k] = row[k]; });
    if (row.linked_customer_id) upd.linked_customer_id = row.linked_customer_id;
    if (row.is_company) upd.is_company = true;
    sb.from('engineer_customers').update(upd).eq('id', custId).then(function(res) {
      if (res.error) { console.log('Update customer error:', res.error.message); }
      else { console.log('Existing customer updated (no duplicate created):', custId); scheduleCustomerReload(); }
    });
    return;
  }
  // Privacy: engineer-owned record, never the customer's own account row
  sb.from('engineer_customers').upsert(row, {onConflict: 'id'}).then(function(res) {
    if (res.error) { console.log('Save customer error:', res.error.message); }
    else { console.log('Customer saved to Supabase:', custId); scheduleCustomerReload(); }
  });
}
function saveExpenseToSupabase(exp) {
  if (!currentUser) return;
  var data = {
    engineer_id: currentUser.id,
    date: exp.date,
    description: exp.desc,
    amount: exp.amt,
    category: exp.cat,
    category_label: exp.catLabel,
    has_receipt: exp.receipt,
    vat: exp.vat || 0
  };
  sb.from('general_expenses').upsert(data).then(function(res) {
    if(res.error)console.log('Save expense error:',res.error.message);
    else console.log('Expense saved to Supabase');
  });
}

    p_diagnosis: q.diagnosis || '',

function updateQuoteStatusInSupabase(quoteNumber, status, acceptedSlot, scheduledDate, scheduledTime) {

// ===== AUTH STATE: Check session on page load =====
var _isPasswordRecovery = false;

// Detect password recovery from ALL possible URL formats
var _fullUrl = window.location.href || '';
var _urlHash = window.location.hash || '';
var _urlSearch = window.location.search || '';
if (_urlHash.indexOf('type=recovery') !== -1 ||
    _urlSearch.indexOf('type=recovery') !== -1 ||
    _fullUrl.indexOf('type=recovery') !== -1 ||
    _urlHash.indexOf('reset-password') !== -1) {
  _isPasswordRecovery = true;
}

// Use onAuthStateChange as the ONLY auth handler — no getSession race condition
sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'PASSWORD_RECOVERY') {
    _isPasswordRecovery = true;
    showPasswordResetForm();
    return;
  }
  if (_isPasswordRecovery) {
    // Block ALL other events from overriding the reset form
    return;
  }
  if (event === 'TOKEN_REFRESHED' && session && session.user) {
    currentUser = session.user;
    _lastSyncOk = true;
  }
  if (event === 'INITIAL_SESSION') {
    if (session && session.user) {
      currentUser = session.user;
      startSessionKeepAlive();
      if (!navigator.onLine) {
        if (loadOfflineCache()) {
          showOfflineBanner();
          isLoading = false;
          render();
          return;
        }
      }
      sb.from('profiles').select('role').eq('id', currentUser.id).single().then(function(pRes) {
        if (pRes.error && !navigator.onLine) {
          if (loadOfflineCache()) { showOfflineBanner(); isLoading = false; render(); return; }
        }
        var role = (pRes.data && pRes.data.role) || 'customer';
        loadUserProfile(role);
      });
    } else {
      if (!navigator.onLine) {
        var app = document.getElementById('app');
        app.innerHTML = '<div class="login-wrap"><div class="login-card" style="max-width:420px;text-align:center"><div style="font-size:48px;margin-bottom:16px">&#128225;</div><h2 style="color:#fff;font-size:20px;margin-bottom:8px">You are offline</h2><p style="color:rgba(255,255,255,.7);font-size:14px;line-height:1.6">Connect to the internet to sign in. If you were signed in before, your data will load automatically when connection returns.</p></div></div>';
        return;
      }
      render();
    }
    return;
  }
  if (event === 'SIGNED_IN' && session && !currentUser) {
    currentUser = session.user;
    startSessionKeepAlive();
    sb.from('profiles').select('role').eq('id', currentUser.id).single().then(function(pRes) {
      var role = (pRes.data && pRes.data.role) || 'customer';
      loadUserProfile(role);
    });
  }
  if (event === 'SIGNED_OUT') {
    currentUser = null;
  }
});

// Fallback: if recovery flag is set but onAuthStateChange hasn't fired after 2 seconds, show form anyway
if (_isPasswordRecovery) {
  document.getElementById('app').innerHTML = '<div class="login-wrap"><div class="login-card" style="max-width:420px;text-align:center"><div style="font-size:40px;margin-bottom:16px">🔒</div><div style="font-size:18px;font-weight:700">Loading password reset...</div></div></div>';
  setTimeout(function() {
    if (_isPasswordRecovery) {
      showPasswordResetForm();
    }
  }, 2000);
}

function showPasswordResetForm() {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="login-wrap"><div class="login-card" style="max-width:420px">' +
    '<div style="text-align:center;margin-bottom:24px">' +
    '<div style="font-size:40px;margin-bottom:8px">🔒</div>' +
    '<div style="font-size:22px;font-weight:900">Set New Password</div>' +
    '<div class="text-sm text-muted mt-8">Enter your new password below</div></div>' +
    '<div class="field"><div class="label">New Password</div>' +
    '<input class="input" id="reset-pw" type="password" placeholder="Enter new password (min 6 chars)"></div>' +
    '<div class="field"><div class="label">Confirm Password</div>' +
    '<input class="input" id="reset-pw2" type="password" placeholder="Confirm new password"></div>' +
    '<div id="reset-error" style="color:var(--danger);font-size:13px;margin-bottom:12px;display:none"></div>' +
    '<button class="btn btn-primary btn-block btn-lg" onclick="doResetPassword()">Update Password</button>' +
    '</div></div>';
}

function doResetPassword() {
  var pw = document.getElementById('reset-pw').value;
  var pw2 = document.getElementById('reset-pw2').value;
  var errEl = document.getElementById('reset-error');
  if (!pw || pw.length < 6) { errEl.style.display = 'block'; errEl.textContent = 'Password must be at least 6 characters'; return; }
  if (pw !== pw2) { errEl.style.display = 'block'; errEl.textContent = 'Passwords do not match'; return; }
  errEl.style.display = 'none';
  sb.auth.updateUser({ password: pw }).then(function(res) {
    if (res.error) { errEl.style.display = 'block'; errEl.textContent = res.error.message; return; }
    _isPasswordRecovery = false;
    sb.auth.signOut();
    var app = document.getElementById('app');
    app.innerHTML = '<div class="login-wrap"><div class="login-card" style="max-width:420px;text-align:center">' +
      '<div style="font-size:48px;margin-bottom:16px">✅</div>' +
      '<div style="font-size:22px;font-weight:900;margin-bottom:8px">Password Updated!</div>' +
      '<div class="text-sm text-muted mb-24">Your password has been changed successfully.</div>' +
      '<button class="btn btn-primary btn-block btn-lg" onclick="window.location.href=\'app.html\'">Continue to Login</button>' +
      '</div></div>';
  });
}
// Check for Stripe redirect params on page load
checkStripeReturn();

// Backup: detect password recovery from URL hash on page load
(function() {
  var hash = window.location.hash;
  if (hash && hash.indexOf('type=recovery') !== -1) {
    _isPasswordRecovery = true;
    // Small delay to let Supabase process the token first
    setTimeout(function() {
      showPasswordResetForm();
    }, 500);
  }
})();

// app.html#import (link from the Moti home-screen app): open the import wizard once the engineer is signed in
(function() {
  if (window.location.hash !== '#import') return;
  var tries = 0;
  var t = setInterval(function() {
    tries++;
    if (currentUser && S && S.engineer && S.screen !== 'login') {
      clearInterval(t);
      try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
      window.motiOpenImport();
    } else if (tries > 120) { clearInterval(t); }
  }, 500);
})();
</script>
