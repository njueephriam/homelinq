<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Moti — HomeLinq Assistant</title>
<meta name="description" content="Your HomeLinq AI teammate. Give Moti a command and it handles your admin.">
<meta name="theme-color" content="#1A1C22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moti">
<link rel="manifest" href="moti-manifest.json">
<link rel="apple-touch-icon" href="moti/icons/moti-apple-touch.png">
<link rel="icon" type="image/png" href="moti/icons/moti-icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15170A;--bg2:#1A1C22;--panel:#212430;--line:#2C2F39;--card:#30343E;
  --volt:#D4F500;--ink:#15170a;--text:#F4F4F0;--mut:#9AA0AC;--mut2:#646A76;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg2);color:var(--text);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
[hidden]{display:none!important}

/* ---------- login ---------- */
#screen-login{align-items:center;justify-content:center;padding:28px;
  background:radial-gradient(120% 80% at 50% 0%,#23261c 0%,var(--bg2) 60%)}
.login-box{width:100%;max-width:360px;text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:8px}
.brand svg{width:78px}
.brand .bn{font-size:26px;font-weight:800;letter-spacing:-.5px}
.login-sub{color:var(--mut);font-size:14.5px;line-height:1.55;margin:6px 0 26px}
#login-form{display:flex;flex-direction:column;gap:11px}
#login-form input{
  background:#0E0F13;border:1px solid var(--line);border-radius:12px;
  color:var(--text);font-family:inherit;font-size:15px;padding:14px 15px;width:100%
}
#login-form input:focus{outline:none;border-color:var(--volt)}
#login-btn{
  background:var(--volt);color:var(--ink);border:none;border-radius:12px;
  font-family:inherit;font-weight:700;font-size:15.5px;padding:14px;cursor:pointer;
  margin-top:4px
}
#login-btn:disabled{opacity:.6}
.login-error{color:#ff8a8a;font-size:13px;min-height:18px;line-height:1.4}
.login-foot{color:var(--mut2);font-size:13px;margin-top:22px}
.login-foot a{color:var(--volt);text-decoration:none;font-weight:600}

/* ---------- app ---------- */
#screen-app{background:var(--bg2)}
.app-head{
  display:flex;align-items:center;gap:11px;padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto
}
.app-head .mark{width:42px;height:42px;background:var(--card);border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.app-head .mark svg{width:31px}
.head-name{font-weight:700;font-size:16.5px}
.head-sub{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--volt);display:inline-block}
.head-btn{background:transparent;border:1px solid var(--line);
  color:var(--mut);font-family:inherit;font-size:12.5px;font-weight:600;
  padding:7px 13px;border-radius:999px;cursor:pointer}
.head-btn:hover{color:var(--text);border-color:var(--mut2)}
.app-head>div{flex:1;min-width:0}
.head-icon{padding-left:11px;padding-right:11px;font-size:15px}
.head-btn.muted{opacity:.5}

.push-banner{display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:#2a2d1a;border-bottom:1px solid var(--line);font-size:13px;flex:0 0 auto}
.push-banner span.pb-txt{flex:1;color:#E9EDF0;line-height:1.4}
.push-banner button{font-family:inherit;cursor:pointer;border:none}
#push-enable{background:var(--volt);color:var(--ink);font-weight:700;font-size:12.5px;
  padding:7px 13px;border-radius:999px}
.push-x{background:transparent;color:var(--mut);font-size:20px;line-height:1;padding:2px 4px}

.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px;
  -webkit-overflow-scrolling:touch}
.msg{max-width:86%;font-size:14.8px;line-height:1.55;padding:11px 14px;
  border-radius:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:var(--card);color:var(--text);border-bottom-left-radius:5px;align-self:flex-start}
.msg.user{background:var(--volt);color:var(--ink);font-weight:500;
  border-bottom-right-radius:5px;align-self:flex-end}
.confirm{background:var(--panel);border:1px solid #3A3F4A;border-radius:13px;
  padding:13px 15px;align-self:flex-start;max-width:92%}
.confirm .cl{font-size:10.5px;color:var(--volt);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:7px;font-weight:700}
.confirm .cs{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:12px}
.crow{display:flex;gap:9px}
.crow button{font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 17px;
  border-radius:9px;cursor:pointer;border:1px solid #3A3F4A}
.c-yes{background:var(--volt);color:var(--ink);border-color:var(--volt)}
.c-no{background:transparent;color:var(--mut)}
.typing{align-self:flex-start;background:var(--card);border-radius:15px;
  border-bottom-left-radius:5px;padding:13px 16px;display:flex;gap:5px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--mut);
  animation:td 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes td{0%,60%,100%{opacity:.3;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-4px)}}

.chat-chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 9px;flex:0 0 auto}
.chat-chips button{background:transparent;border:1px solid var(--line);color:var(--mut);
  font-family:inherit;font-size:12.5px;padding:8px 12px;border-radius:999px;cursor:pointer}
.chat-chips button:active{border-color:var(--volt);color:var(--volt)}

.chat-input{display:flex;gap:8px;align-items:center;padding:12px 13px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.chat-input input{flex:1;background:#0E0F13;border:1px solid var(--line);
  border-radius:12px;color:var(--text);font-family:inherit;font-size:15px;padding:12px 14px}
.chat-input input:focus{outline:none;border-color:var(--volt)}
.mic-btn,.send-btn{flex:0 0 auto;border:none;cursor:pointer;border-radius:12px;
  width:46px;height:46px;font-size:19px;display:flex;align-items:center;justify-content:center}
.mic-btn{background:var(--card);color:var(--text)}
.mic-btn.listening{background:var(--volt);color:var(--ink);
  animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,245,0,.5)}
  70%{box-shadow:0 0 0 12px rgba(212,245,0,0)}}
.send-btn{background:var(--volt);color:var(--ink);font-weight:800}
.mtw-eye{transform-box:fill-box;transform-origin:center;animation:blink 5.4s infinite}
.mtw-eye2{animation-delay:.06s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
@keyframes mSlideUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
@keyframes mSlideDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(60px)}}
.voice-hint{text-align:center;font-size:12px;color:var(--mut2);padding:0 14px 8px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="screen-login" class="screen">
  <div class="login-box">
    <div class="brand">
      <svg viewBox="0 0 140 122" xmlns="http://www.w3.org/2000/svg">
        <line x1="70" y1="26" x2="70" y2="16" stroke="#474D5B" stroke-width="5" stroke-linecap="round"/>
        <circle cx="70" cy="10" r="5.5" fill="#D4F500"/>
        <rect x="18" y="56" width="12" height="40" rx="6" fill="#2A2D36"/>
        <rect x="110" y="56" width="12" height="40" rx="6" fill="#2A2D36"/>
        <rect x="26" y="26" width="88" height="84" rx="24" fill="#474D5B"/>
        <rect x="38" y="44" width="64" height="50" rx="16" fill="#121319"/>
        <circle class="mtw-eye" cx="57" cy="68" r="9.5" fill="#D4F500"/>
        <circle class="mtw-eye mtw-eye2" cx="83" cy="68" r="9.5" fill="#D4F500"/>
        <circle cx="54" cy="64" r="2.8" fill="#fff"/>
        <circle cx="80" cy="64" r="2.8" fill="#fff"/>
        <path d="M60 83 Q70 91 80 83" fill="none" stroke="#D4F500" stroke-width="4" stroke-linecap="round"/>
        <circle cx="24" cy="76" r="2.5" fill="#D4F500"/>
        <circle cx="116" cy="76" r="2.5" fill="#D4F500"/>
      </svg>
      <div class="bn">Moti</div>
    </div>
    <p class="login-sub">Your HomeLinq teammate. Sign in once and Moti is one tap away on your home screen.</p>
    <form id="login-form" autocomplete="on">
      <input id="login-email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Sign in</button>
      <div id="login-error" class="login-error"></div>
    </form>
    <p class="login-foot">New to HomeLinq Pro? <a href="app.html">Create your account</a></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="screen-app" class="screen" hidden>
  <header class="app-head">
    <span class="mark">
      <svg viewBox="0 0 140 122" xmlns="http://www.w3.org/2000/svg">
        <line x1="70" y1="26" x2="70" y2="16" stroke="#474D5B" stroke-width="5" stroke-linecap="round"/>
        <circle cx="70" cy="10" r="5.5" fill="#D4F500"/>
        <rect x="18" y="56" width="12" height="40" rx="6" fill="#2A2D36"/>
        <rect x="110" y="56" width="12" height="40" rx="6" fill="#2A2D36"/>
        <rect x="26" y="26" width="88" height="84" rx="24" fill="#474D5B"/>
        <rect x="38" y="44" width="64" height="50" rx="16" fill="#121319"/>
        <circle class="mtw-eye" cx="57" cy="68" r="9.5" fill="#D4F500"/>
        <circle class="mtw-eye mtw-eye2" cx="83" cy="68" r="9.5" fill="#D4F500"/>
        <circle cx="54" cy="64" r="2.8" fill="#fff"/>
        <circle cx="80" cy="64" r="2.8" fill="#fff"/>
        <path d="M60 83 Q70 91 80 83" fill="none" stroke="#D4F500" stroke-width="4" stroke-linecap="round"/>
        <circle cx="24" cy="76" r="2.5" fill="#D4F500"/>
        <circle cx="116" cy="76" r="2.5" fill="#D4F500"/>
      </svg>
    </span>
    <div>
      <div class="head-name">Moti</div>
      <div class="head-sub"><span class="dot"></span> <span id="head-status">HomeLinq teammate</span></div>
    </div>
    <button id="btn-voice" class="head-btn head-icon" type="button" title="Moti's voice" aria-label="Toggle Moti's voice">&#128266;</button>
    <button id="btn-signout" class="head-btn" type="button">Sign out</button>
  </header>

  <div id="push-banner" class="push-banner" hidden>
    <span class="pb-txt">Turn on notifications so Moti can ping you the moment a task is done.</span>
    <button id="push-enable" type="button">Turn on</button>
    <button id="push-dismiss" class="push-x" type="button" aria-label="Dismiss">&times;</button>
  </div>

  <div id="chat-body" class="chat-body"></div>
  <div id="chat-chips" class="chat-chips"></div>
  <div id="voice-hint" class="voice-hint" hidden>Listening… speak your command</div>
  <form id="chat-form" class="chat-input" autocomplete="off">
    <button type="button" id="btn-mic" class="mic-btn" title="Speak to Moti" hidden>&#127908;</button>
    <input id="chat-text" type="text" placeholder="Ask Moti, or tap the mic…" autocomplete="off" aria-label="Message">
    <button type="submit" class="send-btn" aria-label="Send">&#8593;</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="moti/config.js"></script>
<script src="moti/moti-app.js"></script>
<script>
// ===== MOTI PWA SERVICE WORKER + INSTALL =====
var motiIsPWA=window.matchMedia('(display-mode:standalone)').matches||window.navigator.standalone===true;
var motiDeferredPrompt=null;
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('moti-sw.js').then(function(r){console.log('Moti SW registered')}).catch(function(e){console.log('Moti SW error:',e)});
}
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();motiDeferredPrompt=e;
  if(!motiIsPWA&&!sessionStorage.getItem('moti-install-dismissed')){setTimeout(showMotiInstall,2500)}
});
window.addEventListener('appinstalled',function(){motiDeferredPrompt=null;var b=document.getElementById('moti-install-bar');if(b)b.remove()});
function showMotiInstall(){
  if(motiIsPWA||document.getElementById('moti-install-bar'))return;
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  var d=document.createElement('div');d.id='moti-install-bar';
  d.style.cssText='position:fixed;bottom:70px;left:12px;right:12px;z-index:9999;background:linear-gradient(135deg,#D4F500,#B8D900);border-radius:14px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:mSlideUp .4s ease';
  if(isIOS){
    d.innerHTML='<div style="display:flex;align-items:flex-start;gap:10px"><div style="font-size:24px">🤖</div><div style="flex:1"><div style="color:#15170a;font-weight:700;font-size:14px">Install Moti</div><div style="color:#15170a;opacity:.8;font-size:12px;line-height:1.4">Tap <strong>Share</strong> ↑ then <strong>"Add to Home Screen"</strong></div></div><button onclick="dismissMotiInstall()" style="background:rgba(0,0,0,.15);border:none;color:#15170a;border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer">✕</button></div>';
  } else if(motiDeferredPrompt){
    d.innerHTML='<div style="display:flex;align-items:center;gap:10px"><div style="font-size:24px">🤖</div><div style="flex:1"><div style="color:#15170a;font-weight:700;font-size:14px">Install Moti</div><div style="color:#15170a;opacity:.8;font-size:12px">Your AI assistant, one tap from your home screen.</div></div><div style="display:flex;gap:6px"><button onclick="doMotiInstall()" style="background:#15170a;color:#D4F500;border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer">Install</button><button onclick="dismissMotiInstall()" style="background:rgba(0,0,0,.12);border:none;color:#15170a;padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer">Later</button></div></div>';
  } else {
    d.innerHTML='<div style="display:flex;align-items:flex-start;gap:10px"><div style="font-size:24px">🤖</div><div style="flex:1"><div style="color:#15170a;font-weight:700;font-size:14px">Install Moti</div><div style="color:#15170a;opacity:.8;font-size:12px;line-height:1.4">Open browser menu <strong>⋮</strong> → <strong>"Install App"</strong></div></div><button onclick="dismissMotiInstall()" style="background:rgba(0,0,0,.15);border:none;color:#15170a;border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer">✕</button></div>';
  }
  document.body.appendChild(d);
}
function doMotiInstall(){
  if(!motiDeferredPrompt)return;
  motiDeferredPrompt.prompt();
  motiDeferredPrompt.userChoice.then(function(c){motiDeferredPrompt=null;var b=document.getElementById('moti-install-bar');if(b)b.remove()});
}
function dismissMotiInstall(){
  sessionStorage.setItem('moti-install-dismissed','1');
  var b=document.getElementById('moti-install-bar');if(b){b.style.animation='mSlideDown .3s ease forwards';setTimeout(function(){b.remove()},300)}
}
</script>
</body>
</html>
